# Dependency updates arrive as pull requests on a weekly cadence: one grouped
# pull request for the actions the workflows run, one for the crates the root
# cargo workspace resolves. Each group opens at most one pull request at a time,
# so a week with twenty upstream releases produces two pull requests.
#
# SHA PINS SURVIVE. All 110 `uses:` entries in .github/workflows name a 40
# character commit. The trailing comment is the version on 88 of them; on the
# other 22, every one of them
# `dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master`,
# it is a branch name. The updater rewrites a sha and its version comment
# together, so a step pinned to a release stays pinned to a commit.
#
# THE TITLE PREFIX IS WHAT LETS THE PULL REQUEST MERGE.
# tools/scripts/check_pr_title.sh runs in the Lint job and accepts
# `<type>(<scope>): <description>`: `build` is in its type vocabulary and `deps`
# matches its scope pattern, so `prefix: build` with `include: scope` produces a
# title that conforms. That same script accepts the head branch shape
# `dependabot/<ecosystem>/<name>` when the pull request author is this bot, and
# the branch cannot be renamed because renaming a head branch closes its pull
# request.
#
# ONE CARGO ROOT. `directory: "/"` resolves the root workspace, the only tree a
# required check builds with `--locked` (`cargo build --locked --workspace` in
# the Linux test shards). The standalone workspaces under examples/ and
# benches/ keep their own lockfiles, written by hand, and no required check
# resolves one under `--locked`: the Examples job runs `cargo check` from inside
# each directory with no such flag, so a lockfile the updater rewrote there
# would be rewritten again by the next run. Those trees take their versions by
# hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]
    ignore:
      # The 22 `dtolnay/rust-toolchain` entries pin a commit of a BRANCH, not of
      # a release, so a proposal here moves the pin to another commit of that
      # branch and carries no release name to write in the trailing comment.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: ["dependencies"]
    ignore:
      # Three families carried as exact (`=`) requirements, every requirement in
      # the root workspace manifests: 24 `iceoryx2*` at `=0.9.1`, 7 `re_*` at
      # `=0.34.1`, 3 `iroh` at `=1.0.2`. An exact requirement names one version,
      # so a patch move rewrites those pins in the manifests and arrives in the
      # weekly group. A major or minor move is left out because these versions
      # are chosen together as one change.
      - dependency-name: "iceoryx2*"
        # =0.9.1
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "re_*"
        # =0.34.1
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: rerun
        # 0.34, a caret: rerun's own re_* crates resolve against the pins above.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: iroh
        # =1.0.2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Two crates this project publishes itself, renamed forks of upstream
      # packages. Their versions move when the fork is rebuilt and republished,
      # which is a sequence their manifests describe, so no update is wanted
      # here at any level.
      - dependency-name: cerulion-ros2-client
      - dependency-name: cerulion-rustdds
