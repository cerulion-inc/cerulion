# Syncs .github/labels.yml to the repo's GitHub labels.
# Triggers: manual (workflow_dispatch), or automatically when a change to
# .github/labels.yml lands on main — so every label change is reviewed as a
# PR diff before it mutates the repo. Off-the-shelf declarative sync action,
# no custom scripting — it does idempotent create/update/prune itself.
name: labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/labels.yml]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          # Source of truth: explicitly prune labels not listed in labels.yml
          # (incl. GitHub's default labels) so the repo matches the file exactly.
          # This is the action's default; pinned here so the intent is conscious.
          skip-delete: false
