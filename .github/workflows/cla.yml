# CLA Assistant — gates first-time external contributors on signing the CLA.
#
# The `if:` guard below matches only the public repository, so this workflow
# is inert anywhere else (a fork, a private mirror). The CLA text it links
# lives in .github/CLA/ and is a license grant, not an assignment; the
# corporate form is handled out of band (see .github/CONTRIBUTING.md).
#
# Security posture (per the launch CI-hardening rules):
# - action pinned by commit SHA (v2.6.1)
# - job-scoped permissions only; no checkout of PR code anywhere in this job
# - pull_request_target is safe here BECAUSE nothing checks out or executes
#   fork code — do not add a checkout step to this workflow.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    # The public repository is the only place external contributions arrive.
    if: >-
      github.repository == 'cerulion-inc/cerulion' &&
      (github.event_name == 'pull_request_target' ||
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
       github.event.comment.body == 'recheck')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read # the signatures live in the store repository, written with its own token
      pull-requests: write # posts/updates the CLA comment
      statuses: write
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the signatures file in the separate store repository below; a
          # fine-grained token with contents read and write on that repository only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/cerulion-inc/cerulion/blob/main/.github/CLA/individual.md
          # The store is its own repository, so signature commits never enter this
          # repository's history and one store serves every Cerulion repository.
          remote-organization-name: cerulion-inc
          remote-repository-name: cla
          branch: main
          allowlist: lakshay2010sharma,raveenk9696,dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge your first
            pull request, we ask you to sign our
            [Contributor License Agreement](https://github.com/cerulion-inc/cerulion/blob/main/.github/CLA/individual.md).
            It is a license grant, not a copyright assignment: you keep your
            copyright. Signing takes one comment (below) and never blocks the
            review conversation, only the final merge. Contributing on behalf
            of your employer? See the
            [Corporate CLA](https://github.com/cerulion-inc/cerulion/blob/main/.github/CLA/corporate.md)
            or email licensing@cerulion.com.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thank you!
