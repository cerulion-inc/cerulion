name: Leak guard

# Keeps machine names, addresses, home paths, logins, people and location
# metadata out of what this repository publishes: file contents, path and
# branch names, commit messages and identities, pull request text, and media
# containers. The scanner is tools/scripts/leak_scan.py; docs/leak_guard.md
# explains the classes and how to read a hit.
#
# Two tiers. GENERIC classes are shapes and ship in the tree. PRIVATE patterns
# are a repository secret (LEAK_PATTERNS) mapped at STEP level only. A machine
# NICKNAME (a machine called by its model, a colour, or "the big one") belongs in
# that secret, tagged @nickname, beside the host names of the same machines: the
# shape carries no host name, no address and no login, so no generic class can see
# it and nothing in the tree may name it. docs/leak_guard.md says how to write the
# entry.
# A private hit prints the file, the line and the pattern INDEX, never the matched
# text, and a generic hit on a line a private pattern touches (in any view of it)
# prints no matched text either, so this log does not publish a name the
# secret knows. A generic hit whose text is itself an address, a host, a
# login or a path segment prints a masked shape (letters and digits replaced)
# in this log whether or not the secret is mapped, so a fork run, where no
# secret is, publishes no value either; a file or directory NAME that is such
# a value is masked the same way inside every printed location, and a masked
# location rides the annotation message, not its file property. Every
# printed line is stripped of line breaks and escape sequences before it
# leaves the scanner, so no path or match can start a workflow command. The
# secret is read by the scanner from its environment and is never echoed,
# written to disk or passed as an argument.
#
# What a fork can reach: a pull request from a fork runs here with NO secret,
# so only the generic classes gate it and the log says so loudly. On a pull
# request from a branch of this repository, on the merge queue, on a push to
# main and on manual dispatch the private tier is REQUIRED: a deleted secret
# fails the run instead of quietly scanning less.
#
# `edited` is in the pull request trigger because a title or body edit does not
# re-run the default trigger, and a re-run replays the original payload. No
# `paths:` filter: every diff, title, body and message is in scope.
#
# Issues, issue comments and review comments are public the moment they are
# written and no check runs before they are: the incident that added the
# reference classes was an internal ticket quoted as a `#` shorthand in an issue
# on this repository. The conversation job cannot stop that text from existing,
# so it labels, asks once, and goes red.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]

# The title and body come from the event payload, so no pull-requests scope is
# needed; the three code jobs write nothing. The conversation job raises its own
# scope to the two it needs and nothing wider.
permissions:
  contents: read

# Same three shapes as ci.yml: a pull request keys on its number and cancels
# the superseded run; a merge queue run keys on the queue's own branch and is
# never cancelled; anything else keys on the run id and groups with nothing.
concurrency:
  group: leak-guard-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tree:
    name: Leak guard (tree and names)
    # The code events only: a comment carries no diff, no name and no
    # container, and this job would report success on an empty scan.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group'
      || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A whole-tree scan takes seconds on a warm file cache; the budget only
    # guards a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The message and name scans need the base and head commits, and the
          # push scan needs the previous tip. A shallow checkout has neither.
          fetch-depth: 0

      # The self-test runs FIRST and as its own step: the real tree is clean by
      # construction, so this is the only place the classes meet content that
      # violates them, and a class whose regex stopped matching would otherwise
      # look exactly like a clean tree.
      - name: Scanner self-test
        run: python3 -B tools/scripts/leak_scan.py --self-test

      - name: Decide whether the private tier is required
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          require=no
          if [ "$EVENT_NAME" != pull_request ]; then
            require=yes
          elif [ "$HEAD_IS_FORK" != true ] && [ "$ACTOR" != 'dependabot[bot]' ]; then
            require=yes
          fi
          echo "require=$require" >> "$GITHUB_OUTPUT"
          echo "private tier required: $require (event $EVENT_NAME)"

      - name: Scan the changed files and the added names (pull request, merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          REQUIRE: ${{ steps.mode.outputs.require }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          # A fork run holds no secret, so --require-private cannot be its gate;
          # ref-unverified is escalated by name instead, and every run here fails
          # closed on a reference the forge would not confirm.
          flags=(--hard ref-unverified)
          if [ "$REQUIRE" = yes ]; then flags+=(--require-private); fi
          git fetch -q --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true
          # The list names the files the head commit changed since the merge
          # base, and the content scanned is that commit's copy of each one
          # (--ref), so every listed path exists in the scan source by
          # construction. The merge commit that the checkout holds can carry a
          # changed file under another name when the base renamed it since the
          # branch point; the scanner treats a listed path it cannot find as a
          # NO RUN (exit 3), never as a clean file.
          git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" > changed.zlist
          python3 -B tools/scripts/leak_scan.py tree --ref "$HEAD_SHA" --files-from changed.zlist \
            --allow-empty --format github ${flags[@]+"${flags[@]}"}
          python3 -B tools/scripts/leak_scan.py names --range "$BASE_SHA..$HEAD_SHA" \
            --branch-env BRANCH_NAME --allow-empty --format github ${flags[@]+"${flags[@]}"}

      # A push to main and a manual run scan the WHOLE tree: this is also where
      # a newly added private pattern meets old content.
      - name: Scan the whole tree and every name (push, dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          set -euo pipefail
          python3 -B tools/scripts/leak_scan.py tree --require-private --format github \
            --hard ref-unverified
          python3 -B tools/scripts/leak_scan.py names --require-private --format github \
            --hard ref-unverified

  messages:
    name: Leak guard (messages)
    # The code events only: a comment carries no diff, no name and no
    # container, and this job would report success on an empty scan.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group'
      || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Decide whether the private tier is required
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          require=no
          if [ "$EVENT_NAME" != pull_request ]; then
            require=yes
          elif [ "$HEAD_IS_FORK" != true ] && [ "$ACTOR" != 'dependabot[bot]' ]; then
            require=yes
          fi
          echo "require=$require" >> "$GITHUB_OUTPUT"

      # On a pull request the range is the pull request's own commits plus its
      # title and body, which arrive through environment variable NAMES so no
      # untrusted text is ever interpolated into this block. On the merge queue
      # the range holds the FINAL squash messages before they become permanent,
      # the one server-side moment a message can still be stopped. On a push
      # the range is before..after and a red run is an alarm, not a gate: main
      # is never rewritten.
      - name: Scan commit messages, identities and pull request text
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          REQUIRE: ${{ steps.mode.outputs.require }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          flags=(--hard ref-unverified)
          if [ "$REQUIRE" = yes ]; then flags+=(--require-private); fi
          case "$EVENT_NAME" in
            pull_request)
              git fetch -q --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true
              range="$BASE_SHA..$HEAD_SHA"
              flags+=(--require-commits --pr-title-env PR_TITLE --pr-body-env PR_BODY)
              ;;
            merge_group)
              range="$BASE_SHA..$HEAD_SHA"
              ;;
            push)
              if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                range="$BEFORE_SHA..$AFTER_SHA"
              else
                range="$AFTER_SHA~1..$AFTER_SHA"
              fi
              ;;
            *)
              range="HEAD~1..HEAD"
              ;;
          esac
          python3 -B tools/scripts/leak_scan.py messages --range "$range" --format github \
            ${flags[@]+"${flags[@]}"}

  media:
    name: Leak guard (media)
    # The code events only: a comment carries no diff, no name and no
    # container, and this job would report success on an empty scan.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group'
      || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Decide whether the private tier is required
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          require=no
          if [ "$EVENT_NAME" != pull_request ]; then
            require=yes
          elif [ "$HEAD_IS_FORK" != true ] && [ "$ACTOR" != 'dependabot[bot]' ]; then
            require=yes
          fi
          echo "require=$require" >> "$GITHUB_OUTPUT"
          echo "private tier required: $require (event $EVENT_NAME)"

      # The walkers PARSE each container (PNG, JPEG, GIF, WebP, MP4 and MOV
      # family) for comments, EXIF, XMP, location boxes and trailing bytes; a
      # container no walker can read is itself a hit until it is reviewed. The
      # job always runs and always reports: a job-level skip would report
      # success, so the event split sits at STEP level. The private tier is
      # required on the same events as in the other two jobs: metadata text
      # is where a device or a person's name rides into a picture.
      - name: Walk the metadata of the changed media (pull request, merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          REQUIRE: ${{ steps.mode.outputs.require }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$REQUIRE" = yes ]; then flags=(--require-private); fi
          git fetch -q --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true
          git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" > changed.zlist
          tracked=$(git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' '*.mp4' '*.mov' | wc -l | tr -d ' ')
          echo "tracked media containers in the tree: $tracked"
          python3 -B tools/scripts/leak_scan.py media --ref "$HEAD_SHA" --files-from changed.zlist \
            --allow-empty --format github ${flags[@]+"${flags[@]}"}

      - name: Walk the metadata of every tracked media container (push, dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          set -euo pipefail
          python3 -B tools/scripts/leak_scan.py media --require-private --format github

  conversation:
    name: Leak guard (issue and comment bodies)
    # Issues, issue comments and pull request review comments. These events run
    # in the context of this repository, so the private tier is always here and
    # is always required.
    #
    # Only the guard's own ask is out of scope, because scanning it would be the
    # guard reading itself. Every other author is in scope, bots included: a bot
    # that posts an unopenable reference publishes it exactly as a person does,
    # and no other job here sees an issue or a comment.
    #
    # What keeps a reviewer's prose from reding this job is not who wrote it but
    # WHERE it is: the scan of a conversation body skips fenced blocks and inline
    # code spans (--skip-code), because the forge does not turn a reference
    # inside them into a link either. A quoted example is a quotation; the
    # reference this guard exists for is the one a reader can follow.
    if: >-
      (github.event_name == 'issues' || github.event_name == 'issue_comment'
      || github.event_name == 'pull_request_review_comment')
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time per BODY, newest wins. The workflow level group keys on
    # the run id for these events, so without this an edit could be overtaken by
    # the scan of the text it replaced, and the label and the ask would describe
    # a body that no longer exists. Two different bodies on one thread are
    # independent and still run in parallel.
    concurrency:
      group: >-
        leak-guard-body-${{ github.event.issue.number || github.event.pull_request.number }}-${{
        github.event.comment.id || 'body' }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scanner self-test
        run: python3 -B tools/scripts/leak_scan.py --self-test

      # The body reaches the scanner through an environment variable NAME, never
      # interpolated into a shell line, and is neither echoed nor written to
      # disk. What the scanner prints is a masked shape and a class, which is
      # what every other job here prints.
      - name: Scan the body
        id: scan
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LG_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          set -uo pipefail
          case "$EVENT_NAME" in
            issues) label=issue-body ;;
            *) label=comment-body ;;
          esac
          rc=0
          if [ "${ACTION:-}" = deleted ]; then
            # The text is gone, so there is nothing to scan and nothing to ask
            # about. A deleted body is a CLEAN body: the step below takes back
            # the ask left for it and clears the label if that was the last one,
            # which is the only way a label on a deleted comment ever comes off.
            echo "the body was deleted; treating it as clean"
          else
            python3 -B tools/scripts/leak_scan.py messages --require-private --format github \
              --skip-code --body-env LG_BODY --body-label "$label" || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # The job cannot stop the text from existing, so this is the whole
      # remedy: a label the triage list can see, one ask addressed to the
      # author, and a red run. The label tracks the THREAD, not this body: an
      # outstanding ask is a comment the GUARD left and has not taken back, so
      # the label comes off only when the last one is gone.
      #
      # Three rules make that safe. A lookup that FAILS is not an empty thread:
      # the step goes red and touches neither the label nor a comment, because
      # "the forge would not tell me" must never read as "nothing is
      # outstanding". Only comments written by this workflow's own identity
      # count as asks and only those are ever deleted, so a marker pasted by
      # anyone else neither suppresses an ask nor gets the guard to delete
      # someone's comment. And the label is removed only after a SECOND read
      # still shows no ask, then confirmed by a third: two bodies on one thread
      # are scanned concurrently by design, and a clean run must not race a
      # flagged one into taking the label off behind it.
      - name: Label, ask once, and fail
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.scan.outputs.rc }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          LG_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ "$RC" = 3 ]; then
            echo "::error ::the leak guard could not run on this body"
            exit 1
          fi
          # The marker names the surface and digests the text that was refused,
          # so one body is asked once however often it is rescanned, and an edit
          # that leaves the reference in place is a new ask.
          asks="${RUNNER_TEMP:-/tmp}/leak-guard-asks.txt"
          scope=${COMMENT_ID:-body}
          digest=$(printf '%s' "$LG_BODY" | sha256sum | cut -c1-16)
          prefix="<!--leak-guard:$EVENT_NAME:$scope:"
          marker="$prefix$digest-->"

          # One read of the thread, into a file outside the checkout, keeping
          # only comments this workflow's own identity wrote. Nothing is piped
          # into a reader that may stop early: under pipefail that reads as a
          # failed lookup. A lookup that fails is fatal, never an empty list.
          read_asks() {
            # The identity is this workflow's own, which is a fixed forge name
            # and not a project name, so it sits in the filter rather than in a
            # variable that would have to be expanded into it.
            if ! gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
                 --jq '.[] | select(.user.login == "github-actions[bot]")
                           | select(.body | test("<!--leak-guard:"))
                           | "\(.id) \(.body | match("<!--leak-guard:[^>]*-->").string)"' \
                 > "$asks"; then
              echo "::error ::the thread could not be read; the leak label is left as it is"
              exit 1
            fi
          }
          # Prints 1 when an ask from another body is outstanding, else 0.
          others_outstanding() {
            local id found out=0
            while read -r id found; do
              [ -n "${id:-}" ] || continue
              case "$found" in "$prefix"*) ;; *) out=1 ;; esac
            done < "$asks"
            echo "$out"
          }
          read_asks

          if [ "$RC" = 0 ]; then
            stuck=0
            while read -r id found; do
              [ -n "${id:-}" ] || continue
              case "$found" in
                "$prefix"*)
                  # -i prints the status line, so the outcome is read from the
                  # forge's own answer rather than from whether the client exited
                  # nonzero. 204 is deleted, 404 is already gone, and both are the
                  # outcome asked for. EVERYTHING else, a throttle, a network
                  # error, an authorization failure, a reply that cannot be
                  # parsed, leaves the ask standing, and an ask standing must
                  # never end with the label coming off. Unknown is stuck.
                  status=$(gh api "repos/$REPO/issues/comments/$id" -X DELETE -i 2>/dev/null \
                           | head -n 1 || true)
                  case "$status" in
                    HTTP/*\ 204\ *|HTTP/*\ 204|HTTP/*\ 404\ *|HTTP/*\ 404) ;;
                    *) stuck=1; echo "the ask on comment $id could not be taken back" ;;
                  esac
                  ;;
              esac
            done < "$asks"
            if [ "$stuck" = 1 ]; then
              echo "::error ::an ask could not be taken back; the leak label is left as it is"
              exit 1
            fi
            read_asks
            if [ "$(others_outstanding)" = 1 ]; then
              echo "clean here, but another body on this thread still has an outstanding ask"
              exit 0
            fi
            gh api "repos/$REPO/issues/$NUMBER/labels/leak" -X DELETE >/dev/null 2>&1 || true
            # A flagged run for another body can have posted its ask between the
            # read above and the delete just now, and it added the label before
            # this run took it off. Confirm, and put it back if so.
            read_asks
            if [ "$(others_outstanding)" = 1 ]; then
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=leak" >/dev/null
              echo "an ask landed while the label was coming off; the label is back"
            else
              echo "clean, and no ask is outstanding on this thread"
            fi
            exit 0
          fi

          # The ask goes up BEFORE the label, so the label is the last write this
          # run makes. A clean run for another body that removed the label just
          # before this point either sees the ask on one of its re-reads and puts
          # the label back, or has already finished, and then the add below
          # stands. Claiming the label first would leave a posted ask with no
          # label whenever a clean run deleted it in between.
          asked=0
          while read -r id found; do
            [ "${found:-}" = "$marker" ] && asked=1
          done < "$asks"
          if [ "$asked" = 1 ]; then
            echo "already asked about this body"
          else
            printf '%s\n\n%s\n' \
              "This text points at a repository or a tracker that people outside this project cannot open. Please edit the reference out, or replace it with a link anyone can follow, so that everyone reading can get to what it names. If it is not a repository reference at all, a space before the number sign is enough: \`name #8\` reads as prose, \`name#8\` reads as a repository. The reference itself is not printed anywhere by this check." \
              "$marker" | gh api "repos/$REPO/issues/$NUMBER/comments" -F body=@- >/dev/null
          fi
          gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=leak" >/dev/null
          echo "::error ::a reference in this body is not openable by a stranger"
          exit 1
