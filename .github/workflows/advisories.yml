name: Advisory audit (cargo-deny, scheduled)

# The advisory half of the dependency audit, on a clock.
#
# `ci.yml`'s `Dependency Audit (cargo-deny)` job runs `cargo deny ... check
# advisories licenses bans sources` on every pull request, every merge-queue
# batch and every push to `main`. Licences, bans and sources are decided by
# `Cargo.lock` and `tools/release/deny.toml` together, and an edit to either is
# a push `ci.yml` triggers on. Advisories are not: `tools/release/deny.toml`
# pins no advisory database, so each run resolves the current RustSec database
# against the committed lockfile, and an advisory published after the last push
# matches a lockfile nobody has edited. No event `ci.yml` triggers on fires.
#
# So the advisories check runs here on a schedule against the default branch,
# and `tools/scripts/advisory_issue.sh` records the result on ONE issue carrying
# the `security` label that `.github/labels.yml` declares. That script reads the
# log as well as the exit status, because the classes do not all land the same way
# under `tools/release/deny.toml`: a vulnerability or notice advisory on any crate
# in the resolved graph, and an unmaintained advisory, which that file leaves at
# scope `all`, each render as `error[<class>]` and exit nonzero; the yanked class
# that file holds at warn level renders as `warning[yanked]` and exits 0, so the
# exit status alone would overlook a yanked crate.
#
# WHAT STAYS SILENT. `unsound` is a scope key, and that file leaves it at the
# cargo-deny 0.20.2 default `workspace`: an unsound advisory is reported only when
# at least one DIRECT dependent of the crate is a workspace member. An unsound
# advisory on a crate reached only through third-party edges emits no diagnostic
# and the check exits 0, so neither this run nor the per-change `Dependency Audit
# (cargo-deny)` job reading the same file sees it.
#
# A `warning[index-failure]` is cargo-deny's own, one per crate whose registry
# index query failed, at warn level and exit 0: the registry query failed, so the
# yanked half of the check did not run for those crates. The script routes it to
# exit 3, which writes nothing and turns this run red, rather than reading that
# log as a clean result and closing the issue.
#
# Licences, bans and sources stay out of this run: every path into `main`
# already checks them, and they move only when a file in the checkout moves.
#
# Neither trigger is reachable from a fork: `schedule` and `workflow_dispatch`
# only ever run on a branch of this repository.
on:
  workflow_dispatch:
  schedule:
    # 04:37 UTC daily. Off-peak and off the hour, where GitHub queues the whole
    # world's `0 * * * *` crons at once; moveit-hero.yml holds 03:43,
    # stale.yml 07:17 and examples-replay.yml 07:30.
    - cron: "37 4 * * *"

# Read the checkout; write one issue. `issues: write` is what lets
# `advisory_issue.sh` create, edit, comment on and close it.
permissions:
  contents: read
  issues: write

# A daily cron plus manual dispatch can overlap itself, and two runs would race
# on the same issue: one would create it while the other edits or closes it.
# Queue rather than cancel, so the newer lockfile reading is the last write.
concurrency:
  group: advisory-audit
  cancel-in-progress: false

jobs:
  advisories:
    name: Advisories against the committed lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release archive, version and checksum `ci.yml`'s Dependency Audit
      # job installs. cargo-deny runs against the runner image's own cargo, so
      # there is no toolchain step and no cache.
      - name: Install cargo-deny 0.20.2
        run: |
          set -eu
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl -sSL --retry 3 -o cargo-deny.tgz "$url"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tgz" | sha256sum -c -
          tar -xzf cargo-deny.tgz
          install -m 0755 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version

      # `shell: bash` runs this under `bash --noprofile --norc -eo pipefail`, so
      # errexit is on and a nonzero cargo-deny would end the step right here:
      # the `|| status=$?` capture is what keeps the step alive and turns the
      # exit status into the output the next step reads. `--format json` is what
      # that step parses, one JSON object per line naming each diagnostic's
      # severity, class, affected crate and message, so the crate names in the
      # issue body are read rather than scraped out of prose. Both streams go to
      # the log file, and `cat` puts that same JSON in the run log, which is
      # readable as it stands because it carries the message text: a second
      # `--format human` run would resolve the RustSec database again and could
      # print a different reading from the one the verdict came from.
      - name: Check advisories
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          status=0
          cargo deny --format json --config tools/release/deny.toml check advisories \
            > "$RUNNER_TEMP/advisories.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/advisories.log"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      # `GH_TOKEN` is the run's own token, scoped by the `issues: write`
      # permission above. The status reaches the script through `env`, not
      # through an expression expanded into the shell. The script reads the JSON
      # log with `jq`, which the ubuntu runner image carries; it refuses with a
      # message of its own if `jq` is ever absent.
      - name: Record the result on one issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
        run: |
          set -euo pipefail
          tools/scripts/advisory_issue.sh "$AUDIT_STATUS" "$RUNNER_TEMP/advisories.log"
