name: CI

# Every job in this workflow runs on a GitHub-hosted runner.

on:
  pull_request:
  # THE MERGE QUEUE (batches up to 10, ~2 min minimum
  # wait, squash merges). GitHub builds a temporary branch holding main plus the
  # batch and runs THIS workflow on it; branch protection's required contexts are
  # checked against that run, so every required job must appear here with the
  # SAME NAME it has on a pull request — a renamed context is an unsatisfiable
  # gate, and the queue simply never merges anything.
  #
  # The rule applied at every event-conditional site below: a `merge_group` run is
  # treated like a `pull_request` run, and push-only jobs stay push-only.
  # `main`'s push run is still the control, so a queue run that also did the
  # push-only work would do it twice.
  merge_group:
  push:
    branches: [main]
  # Manual trigger, primarily so the latency job (gated off the
  # per-PR critical path below) can be run on demand against any ref.
  workflow_dispatch:

# Declared explicitly rather than inherited from the repository's
# `default_workflow_permissions` setting. That setting reads `read` today, but
# it is a UI toggle any admin can flip with no review. A workflow-level
# declaration wins over the repository default, so the posture becomes a
# reviewable line in this file instead of a checkbox somewhere else.
#
# Audited job by job: every step in this file is checkout,
# cache, rust-toolchain, cargo, or cargo-deny — none needs write. If one ever
# does, widen that JOB, never this block.
permissions:
  contents: read

# Cancel a pull request's superseded run; never queue or cancel anything else.
#
# Measured on PR runs since 2026-08-01: 34% were superseded by a newer push to
# the same PR within ~18 min and ran to completion anyway, because nothing here
# cancelled them. Branch protection's required checks bind to the NEWEST head
# SHA, so a cancelled run on a superseded commit gates nothing, and a hosted
# runner is a throwaway VM, so cancelling one leaves nothing half-finished.
#
# The group key is DELIBERATELY not `github.ref`. Keying non-PR runs on the
# ref would fold every push-to-main and dispatch-on-main run into ONE group,
# and GitHub allows one running + one pending per group and CANCELS any older
# pending run even with `cancel-in-progress: false`. Measured on push-to-main
# runs since 2026-08-01 (194 runs): 103 (53%) started while the previous main
# run was still in flight and would have serialised behind it; 54 (28%)
# started with 2+ main runs in flight and would have been silently dropped —
# no `Lint` verdict for that SHA, no push-only `test-latency` /
# `cli-e2e-latency` signal, and no green-on-main evidence for the SHA studio
# later pins as its source revision. So:
#
#   * `pull_request`  ⇒ group = the PR number; cancel-in-progress on. A new
#     push to the PR cancels the run for the commit it just replaced.
#   * `merge_group`   ⇒ group = the queue's own temporary branch, which is
#     unique per BATCH; cancel-in-progress OFF. The queue is waiting on this
#     run's verdict to decide whether to merge, so a cancelled required
#     context reads as "not passed" forever and the batch stalls.
#   * push / workflow_dispatch / schedule ⇒ group = `github.run_id`, which is
#     unique per run, so every main commit keeps its own run, nothing is
#     ever queued behind a sibling, and nothing is ever cancelled.
#
# Contrast `moveit-hero.yml`: it uses a FIXED group with
# `cancel-in-progress: false` on purpose, because it races on shared state and
# a nightly result is worth finishing. Here the per-PR runs share nothing, and
# the non-PR runs must never share a group at all.
concurrency:
  # THREE shapes, and the middle one is why this line changed. A PR keys on its
  # number so a new push supersedes the old run. A MERGE-QUEUE run keys on the
  # queue's own temporary branch (`merge_group.head_ref`), which is unique per
  # BATCH: keyed on anything coarser, two queued batches would cancel each other
  # and the queue would stall on a context that never reports; keyed on the PR
  # number it does not have, every queue run would collapse into one group with
  # whatever else evaluated to empty. Everything else keys on the run id, which
  # groups with nothing.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.run_id }}
  # A queue run is NEVER cancelled by a newer one: the queue is waiting on its
  # verdict to decide whether to merge, and a cancelled required context reads as
  # "not passed" forever.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Suppress iceoryx2 log noise
  IOX2_LOG_LEVEL: error
  # Single source of truth for the nightly pin used by the fuzz and miri
  # jobs. iceoryx2 0.8.1 failed to compile on the newer nightlies tested
  # (StaticString::as_str trait-scope regression);
  # nightly-2026-04-07 verified locally to compile the full dep tree.
  # Bump deliberately, not via drift.
  PINNED_NIGHTLY: nightly-2026-04-07

jobs:
  deb-smoke:
    name: Debian and APT package smoke
    runs-on: ubuntu-22.04
    # CI cost policy: push and workflow_dispatch only — these six were ~1/3 of hosted Linux minutes on every PR push; breakage is caught on the merge to main.
    # merge_group is excluded with pull_request: `main`'s push run is still the
    # control, so doing this work in the queue too would pay for it twice.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # Measured 22 min on the PR head (the debug-binary tar + dpkg-deb step
    # alone is ~12 min); 30 left eight minutes of headroom on a
    # compression-bound job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.93.0

      - name: Test workspace version parser
        run: tools/scripts/test_workspace_version.sh

      - name: Verify workspace version
        id: version
        run: echo "version=$(tools/scripts/workspace_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build the three release binaries
        run: cargo build --locked -p cerulion_cli -p cerulion_netd -p cerulion_connectd

      # build_deb.sh requires every license notice the archive ships, so this
      # smoke has to produce the generated one like the release does. Doing it
      # here rather than faking a placeholder means the packaging smoke
      # assembles a real package, and a break in tools/release/about.toml or the template is
      # caught on the pull request that causes it instead of at tag time. The
      # version and flags match the release workflow.
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      - name: Generate the third-party license inventory
        run: |
          cargo about generate -c tools/release/about.toml --locked --fail \
            -o THIRD-PARTY-LICENSES.md tools/release/about.hbs

      - name: Assemble a Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # This smoke packages debug binaries with no Jazzy container, so the
          # archive carries no rmw library; build_deb.sh refuses that by
          # default because a released Linux package without it is the bug
          # `cerulion ros2 run` exits 69 on. The release workflow never sets
          # this.
          CERULION_DEB_ALLOW_MISSING_RMW: "1"
        run: |
          debian_version=$(tools/scripts/debian_version.sh "$VERSION")
          stem="cerulion-${VERSION}-x86_64-unknown-linux-gnu"
          stage="$RUNNER_TEMP/$stem"
          archive="$RUNNER_TEMP/$stem.tar.gz"
          mkdir -p "$stage" "$RUNNER_TEMP/debs"
          cp target/debug/cerulion "$stage/cerulion"
          cp target/debug/cerulion-netd "$stage/cerulion-netd"
          cp target/debug/cerulion-connectd "$stage/cerulion-connectd"
          cp LICENSE README.md "$stage/"
          cp docs/legal/NOTICE docs/legal/LICENSE-BSD-3-CLAUSE "$stage/"
          cp THIRD-PARTY-LICENSES.md "$stage/"
          chmod +x "$stage"/cerulion "$stage"/cerulion-netd "$stage"/cerulion-connectd
          tar czf "$archive" -C "$RUNNER_TEMP" "$stem"
          deb=$(tools/scripts/build_deb.sh "$archive" amd64 "$RUNNER_TEMP/debs")
          test "$(printf '%s\n' "$deb" | wc -l)" -eq 1
          test "$deb" = "$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          test -f "$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          dpkg --compare-versions '0.1.0~rc.1' lt '0.1.0'
          # apt installs Recommends by default, which is how an `apt-get
          # install cerulion` arrives with the C linker `cargo` needs. The
          # smoke below installs without them to stay hermetic, so the field
          # itself is asserted here rather than inferred from what apt pulled.
          deb_path="$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          recommends=$(dpkg-deb -f "$deb_path" Recommends)
          echo "Recommends: $recommends"
          for recommended in cerulion-archive-keyring build-essential git curl; do
            if ! printf '%s' "$recommends" | tr -d ' ' | tr ',' '\n' |
              grep -Fxq "$recommended"; then
              echo "Recommends does not list $recommended"
              exit 1
            fi
          done

      - name: Install apt-utils
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Reject unsafe Debian archives
        run: tools/scripts/test_build_deb.sh

      - name: Test release Debian eligibility gate
        run: tools/scripts/test_release_debian_gate.sh

      - name: Build signed APT repository
        id: apt-repo
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          debian_version=$(tools/scripts/debian_version.sh "$VERSION")
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          repo="$RUNNER_TEMP/apt-repo"
          mkdir -m 0700 "$GNUPGHOME"
          mkdir -p "$repo"
          gpg --batch --passphrase '' --quick-generate-key \
            'Cerulion CI APT Test A <apt-test-a@cerulion.com>' rsa2048 sign 1d
          fingerprint_a=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "sec" { want_fpr = 1; next }
              want_fpr && $1 == "fpr" { print $10; exit }')
          test -n "$fingerprint_a"
          gpg --batch --passphrase '' --quick-generate-key \
            'Cerulion CI APT Test B <apt-test-b@cerulion.com>' rsa2048 sign 1d
          fingerprint_b=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: -v first="$fingerprint_a" '$1 == "sec" { want_fpr = 1; next }
              want_fpr && $1 == "fpr" && $10 != first { print $10; exit }')
          test -n "$fingerprint_b"
          public_key_gnupghome="$RUNNER_TEMP/apt-public-key-gnupg"
          mkdir -m 0700 "$public_key_gnupghome"
          GNUPGHOME="$public_key_gnupghome" \
            gpg --batch --passphrase '' --quick-generate-key \
              'Cerulion CI APT Test Public Only <apt-public@cerulion.com>' rsa2048 sign 1d
          fingerprint_c=$(GNUPGHOME="$public_key_gnupghome" \
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint_c"
          public_key_material=$(GNUPGHOME="$public_key_gnupghome" \
            gpg --batch --armor --export "$fingerprint_c")
          printf '%s\n' "$public_key_material" | gpg --batch --import
          gpg --batch --yes --delete-key "$fingerprint_c"
          export APT_GPG_PUBLIC_KEYS="$public_key_material"
          printf '%s\n' "$APT_GPG_PUBLIC_KEYS" | gpg --batch --import
          {
            echo "key_a=$fingerprint_a"
            echo "key_b=$fingerprint_b"
            echo "key_c=$fingerprint_c"
          } >> "$GITHUB_OUTPUT"
          tools/scripts/build_apt_repo.sh "$repo" "$fingerprint_a" \
            "$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          missing_keyring="$RUNNER_TEMP/missing-signing-key.gpg"
          missing_keys="$RUNNER_TEMP/missing-signing-key.list"
          gpg --batch --yes --export "$fingerprint_a" > "$missing_keyring"
          printf '%s\n%s\n' "$fingerprint_a" "$fingerprint_b" > "$missing_keys"
          if tools/scripts/check_apt_keyring_coverage.sh \
            "$missing_keyring" "$missing_keys"; then
            echo "keyring coverage check accepted a missing signing key"
            exit 1
          fi
          umask 000
          umask_test_out="$RUNNER_TEMP/keyring-umask-000"
          mkdir -p "$umask_test_out"
          tools/scripts/build_keyring_deb.sh "$repo/cerulion-archive-keyring.gpg" \
            "$debian_version" 99 "$umask_test_out" >/dev/null
          test -f "$umask_test_out"/*.deb

      - name: Test APT client round trip
        run: |
          debian_version=$(tools/scripts/debian_version.sh "$VERSION")
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          python3 -m http.server 8000 --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/apt-repo" > "$RUNNER_TEMP/apt-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/dists/stable/InRelease >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/dists/stable/InRelease >/dev/null
          primary_fingerprints() {
            key_listing=$(gpg --batch --show-keys --with-colons "$1") || return 1
            printf '%s\n' "$key_listing" |
              awk -F: '$1 == "pub" { primary=1; next }
                primary && $1 == "fpr" { print toupper($10); primary=0; next }
                $1 == "sub" { primary=0 }' | sort -u
          }
          expected_primary_fingerprints=$(printf '%s\n' "$KEY_A" | sort -u)
          if ! actual_primary_fingerprints=$(primary_fingerprints \
              "$RUNNER_TEMP/apt-repo/cerulion-archive-keyring.gpg"); then
            echo "could not inspect the generated Cerulion APT keyring"
            exit 1
          fi
          test "$actual_primary_fingerprints" = "$expected_primary_fingerprints"
          extra_keyring="$RUNNER_TEMP/extra-keyring.gpg"
          gpg --batch --export "$KEY_A" "$KEY_B" > "$extra_keyring"
          if ! actual_primary_fingerprints=$(primary_fingerprints "$extra_keyring"); then
            echo "could not inspect the extra-key APT keyring"
            exit 1
          fi
          if [ "$actual_primary_fingerprints" = "$expected_primary_fingerprints" ]; then
            echo "exact keyring check accepted an unexpected extra key"
            exit 1
          fi
          echo "APT bootstrap exact-keyring check passed"
          for image in ubuntu:22.04 ubuntu:24.04; do
            echo "=== $image ==="
            docker run --rm --pull=missing --network host \
              -v "$RUNNER_TEMP/apt-repo:/repo:ro" \
              "$image" sh -euxc '
                install -d -m 0755 /usr/share/keyrings
                install -m 0644 /repo/cerulion-archive-keyring.gpg \
                  /usr/share/keyrings/cerulion-archive-keyring.gpg
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/cerulion-archive-keyring.gpg] http://127.0.0.1:8000 stable main" \
                  > /etc/apt/sources.list.d/cerulion.list
                if ! apt-get update > /tmp/apt-update.log 2>&1; then
                  cat /tmp/apt-update.log
                  exit 1
                fi
                cat /tmp/apt-update.log
                if grep -Eiq "NO_PUBKEY|GPG error|signatures could not be verified|Hash Sum mismatch|does not have a Release file|Clearsigned file is not valid|invalid signature" /tmp/apt-update.log; then
                  exit 1
                fi
                apt-get install -y --no-install-recommends cerulion
                cerulion --version
                test -x /usr/bin/cerulion
                test -x /usr/bin/cerulion-netd
                test -x /usr/bin/cerulion-connectd
                test "$(dirname "$(readlink -f "$(command -v cerulion)")")" = \
                  "$(dirname "$(readlink -f /usr/bin/cerulion-connectd)")"
              '
          done
          rotation_container=cerulion-apt-rotation
          docker run -d --pull=missing --name "$rotation_container" \
            --network host \
            -v "$RUNNER_TEMP/apt-repo:/repo" \
            ubuntu:24.04 sh -c 'sleep 600' >/dev/null
          docker exec "$rotation_container" sh -euxc '
            install -d -m 0755 /usr/share/keyrings
            install -m 0644 /repo/cerulion-archive-keyring.gpg \
              /usr/share/keyrings/cerulion-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/cerulion-archive-keyring.gpg] http://127.0.0.1:8000 stable main" \
              > /etc/apt/sources.list.d/cerulion.list
            apt-get update
            apt-get install -y gnupg
            apt-get install -y --no-install-recommends cerulion cerulion-archive-keyring
            dpkg -S /usr/share/keyrings/cerulion-archive-keyring.gpg
          '
          export APT_KEYRING_REVISION=2
          tools/scripts/build_apt_repo.sh "$RUNNER_TEMP/apt-repo" "$KEY_A,$KEY_B" \
            "$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          inrelease_log="$RUNNER_TEMP/inrelease-verification.log"
          gpg --batch --status-fd 1 --verify \
            "$RUNNER_TEMP/apt-repo/dists/stable/InRelease" > "$inrelease_log" 2>&1
          inrelease_key=$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $3; exit }' \
            "$inrelease_log")
          test "$inrelease_key" = "$KEY_A"
          docker run --rm --pull=missing --network host \
            -v "$RUNNER_TEMP/apt-repo:/repo:ro" \
            ubuntu:24.04 sh -euxc '
              install -d -m 0755 /usr/share/keyrings
              install -m 0644 /repo/cerulion-archive-keyring.gpg \
                /usr/share/keyrings/cerulion-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/cerulion-archive-keyring.gpg] http://127.0.0.1:8000 stable main" \
                > /etc/apt/sources.list.d/cerulion.list
              apt-get update
            '
          docker exec "$rotation_container" sh -euxc '
            apt-get update
            apt-get install -y --only-upgrade cerulion-archive-keyring
            dpkg -S /usr/share/keyrings/cerulion-archive-keyring.gpg
          '
          export APT_KEYRING_REVISION=3
          export APT_KEYRING_KEYS="$KEY_A,$KEY_B,$KEY_C"
          tools/scripts/build_apt_repo.sh "$RUNNER_TEMP/apt-repo" "$KEY_B" \
            "$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          docker run --rm --pull=missing --network host \
            -v "$RUNNER_TEMP/apt-repo:/repo:ro" \
            ubuntu:24.04 sh -euxc '
              install -d -m 0755 /usr/share/keyrings
              install -m 0644 /repo/cerulion-archive-keyring.gpg \
                /usr/share/keyrings/cerulion-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/cerulion-archive-keyring.gpg] http://127.0.0.1:8000 stable main" \
                > /etc/apt/sources.list.d/cerulion.list
              apt-get update
            '
          docker exec "$rotation_container" sh -euxc '
            apt-get update
            apt-get install -y --only-upgrade cerulion-archive-keyring
            dpkg -S /usr/share/keyrings/cerulion-archive-keyring.gpg
          '
          unset APT_KEYRING_KEYS
          export APT_KEYRING_REVISION=4
          tools/scripts/build_apt_repo.sh "$RUNNER_TEMP/apt-repo" "$KEY_B" \
            "$RUNNER_TEMP/debs/cerulion_${debian_version}_amd64.deb"
          docker exec -e KEY_A="$KEY_A" -e KEY_B="$KEY_B" \
            "$rotation_container" sh -euxc '
            apt-get update
            apt-get install -y --only-upgrade cerulion-archive-keyring
            fingerprints=$(gpg --show-keys --with-colons \
              /usr/share/keyrings/cerulion-archive-keyring.gpg |
              awk -F: '\''$1 == "fpr" { print $10 }'\'' | sort -u)
            test "$fingerprints" = "$KEY_B"
            if printf "%s\n" "$fingerprints" | grep -Fxq "$KEY_A"; then
              echo "old APT signing key remains in the installed keyring"
              exit 1
            fi
            dpkg -S /usr/share/keyrings/cerulion-archive-keyring.gpg
          '
          tools/scripts/test_apt_publication_order.sh
          docker rm -f "$rotation_container" >/dev/null
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEY_A: ${{ steps['apt-repo'].outputs.key_a }}
          KEY_B: ${{ steps['apt-repo'].outputs.key_b }}
          KEY_C: ${{ steps['apt-repo'].outputs.key_c }}

  # Fast lint check — gates all other jobs
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # The limit covers runner setup, cache restore, cold compilation of the
    # iroh tree (netd's `wan` is default-ON, so feature unification pulls it
    # into `cargo clippy --workspace --all-targets`), the checks, and the cache
    # save. A cold restore alone can take a quarter of an hour, and a job that
    # dies before its cache save leaves the next run paying the same cost, so
    # the budget is wide enough that one slow restore cannot strand it. This is
    # still a bound, and the required checks and runner routing are unchanged.
    timeout-minutes: 45
    env:
      # Clippy is pure analysis — debuginfo is dead weight, and the workspace's
      # full-debug target outgrew the hosted runner's disk (after
      # four large changes merged: every `Lint` run died with the runner's
      # own "No space left on device" before it could even report). debug=0
      # shrinks the lint target by tens of GB and composes with the disk-free
      # step below; test jobs keep their own profiles untouched.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release installer self-test
        run: ./tools/scripts/install.sh --self-test

      - name: Rust and Cargo bootstrap self-test
        run: ./tools/scripts/test_install_rust.sh

      # The rendered formula is Ruby, and parsing it is the headline assertion
      # of the self-test, which refuses to skip that check under CI. No other
      # step in any workflow reads Ruby, so this step installs an interpreter if
      # the runner image does not already carry one.
      - name: Homebrew formula render self-test
        run: |
          set -euo pipefail
          if ! command -v ruby >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ruby
            else
              apt-get update
              apt-get install -y --no-install-recommends ruby
            fi
          fi
          ruby --version
          ./tools/scripts/test_render_homebrew_formula.sh

      - name: Crates.io wait guard self-test
        run: ./tools/scripts/test_wait_for_crates_io.sh

      - name: Crates.io publish retry self-test
        run: ./tools/scripts/test_publish_crates.sh

      # A static linter is the only automated reader most of these scripts
      # get: CI executes only a few of them (the two gates this workflow runs,
      # `check_agents_md.sh` and `check_pr_title.sh`, and the shard runner that
      # decides what the test jobs run); the rest drive benches and real
      # hardware. shellcheck is preinstalled on the runner image, so this costs
      # an install of nothing and runs in about a second. `--version` is
      # printed so a future divergence between the runner's shellcheck and a
      # developer's is diagnosable from the log rather than guessed at.
      - name: Shell scripts pass shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          # RECURSIVE over both script trees, not two globs. `tools/scripts/*.sh`
          # alone missed `tools/scripts/benchmarks/**` entirely and double-linted
          # `tools/scripts/reproduce_benchmarks.sh`, which is a SYMLINK into that
          # directory — so `-type f` also deduplicates it.
          #
          # `-x -P SCRIPTDIR`: follow `source`d files, resolving them against
          # each script's OWN directory. Without it the two `source` lines in
          # `benchmarks/reproduce.sh` resolve against the process CWD and
          # report a false "does not exist".
          #
          # `tools/hooks` carries the leak guard's git hooks, which have no
          # extension (git looks them up by bare name), so that tree is matched
          # by path rather than by suffix.
          files=$(find tools/scripts tools/hooks -type f \( -name '*.sh' -o -path 'tools/hooks/*' \) | sort)
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$count" -lt 19 ]; then
            echo "::error::shellcheck swept only ${count} script(s): the find is not reaching the trees"
            exit 1
          fi
          # shellcheck disable=SC2086  # $files is a newline list of paths, split on purpose
          shellcheck -x -P SCRIPTDIR $files
          echo "shellchecked ${count} script(s)"

      # The workflows themselves had NO linter. That is the same gap the
      # shellcheck step above closed for scripts, one level up: `ci.yml` is the
      # largest and most-edited file in the repo, it is not compiled, not
      # tested, and not type-checked, and a mistake in it is found by a job
      # behaving oddly — or not at all. Three real defects this catches are
      # already on the record here: a duplicated `allowed_bots` key, a retired
      # `macos-13` label, and a heredoc at column 0 that broke `apt-repo.yml`.
      #
      # actionlint also runs shellcheck over every `run:` block, which is how
      # those blocks get linted at all — the step above sweeps `tools/scripts/`,
      # and a `run:` block does not live there.
      #
      # Bare `actionlint` lints every workflow in `.github/workflows`; it is not
      # given a file list, so a workflow added tomorrow is covered without
      # editing this step (the same default-cover argument as the viz lanes).
      - name: Workflows pass actionlint
        run: |
          set -euo pipefail
          ./tools/scripts/install_actionlint.sh
          export PATH="$HOME/.local/bin:$PATH"
          actionlint -version
          actionlint

      # The workspace + restored target cache no longer fit ubuntu-latest's
      # free disk alongside the preinstalled toolchains the workspace never
      # uses. `ubuntu-latest` ships tens of GB of them, and reclaiming ~25 GB up
      # front is what keeps this job off ENOSPC; the `df` lines make a
      # regression diagnosable from the log.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `cargo fmt --all` above covers ROOT-WORKSPACE members only. Everything
      # else in the repo is its own workspace: `examples/go2` (21k lines the
      # users of the demo actually read), each `benches/*`, each `examples/*`,
      # and `crates/cerulion_core/fuzz`. None of it had ever been fmt-checked
      # by anything. Four trees were dirty when this step was written.
      #
      # A WALK, not a hand list: a new bench or example is covered the day it
      # lands, which is the same default-cover reasoning the test jobs use and
      # the same failure mode (`a hand list goes stale`) this workflow keeps
      # paying for. `cargo fmt` needs no build, so the whole sweep is seconds.
      #
      # SCOPE: the walk names the three top-level TREES that exist today
      # (`benches`, `examples`, `crates/cerulion_core/fuzz`). A brand-new
      # top-level excluded tree would need a line here, visible in review,
      # unlike a missing file inside a directory already swept.
      - name: Check formatting (the workspaces the root does not cover)
        run: |
          set -uo pipefail
          fail=0
          checked=0
          # WALK for workspace ROOTS, not a shallow glob. A one-level glob such
          # as `benches/*/Cargo.toml` cannot see a nested root. Keying on
          # `[workspace]` finds a root wherever it sits, so a bench or example
          # added at any depth is covered the day it lands.
          #
          # `-not -path '*/target/*'`: a build artefact tree can hold vendored
          # manifests, and fmt-checking one would report a diff nobody owns.
          #
          # EVERY tree is checked before the step fails, so one dirty tree does
          # not hide the others.
          while IFS= read -r manifest; do
            grep -q '^\[workspace\]' "$manifest" || continue
            echo "::group::cargo fmt --check ${manifest}"
            cargo fmt --manifest-path "$manifest" --all -- --check || fail=1
            echo "::endgroup::"
            checked=$((checked + 1))
          done < <(find benches examples crates/cerulion_core/fuzz \
                        -type f -name Cargo.toml -not -path '*/target/*' | sort)
          # A walk that matched nothing would be a silent green. The floor is
          # the exact number of roots in the tree (two under benches/latency,
          # five examples, the fuzz crate), so losing any one of them trips it.
          # Raise it in the commit that adds a root.
          if [ "$checked" -lt 8 ]; then
            echo "::error::only ${checked} excluded workspace root(s) were fmt-checked: the walk is not reaching the trees"
            exit 1
          fi
          echo "fmt-checked ${checked} excluded workspace root(s)"
          exit $fail

      # THE WORKSPACE LINT. `dead_code` / `unused_imports` / `unused_variables`
      # are DENY across the root workspace, and `--all-targets` puts every test
      # and bench target under the same bar.
      #
      # It lives in `lint` rather than in a test job because it gates every
      # other job: a clippy break should cost seconds of ubuntu time, not an
      # hour of macOS. (`examples/go2` is outside the root workspace and gets its
      # own strict clippy step inside the job that has already built it.)
      - name: Run clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Grep-based lint — heap-allocation patterns in hot-path files
      # (transport/, the graph level executor, the scheduler) must carry an
      # explicit `// hot-path-alloc-ok:` / `-ok-fn:` / `-known:` annotation
      # (see script header for the allowlist semantics).
      # Pure bash/awk, no cargo involvement.
      #
      # The self-test runs FIRST and as its own step: the real tree is clean by
      # construction, so CI never drives the annotation grammar over a file that
      # VIOLATES it — a rule that stopped working would look exactly like
      # success.
      - name: Hot-path allocation lint (self-test)
        run: ./tools/scripts/check_hot_path_allocs.sh --self-test

      - name: Hot-path allocation lint
        run: ./tools/scripts/check_hot_path_allocs.sh

      # The agent-docs gate. Context files (`AGENTS.md` / `CLAUDE.md`) are
      # loaded by coding agents with SILENT truncation and nearest-file-wins
      # chaining, so a budget nothing enforces reinflates and a file that
      # quietly stopped being read looks exactly like one that is. This script
      # is what makes the repo the alarm: per-file and whole-chain size
      # budgets, a `CLAUDE.md` shim beside every `AGENTS.md`, no symlinked
      # context file (a symlink dodges every check while tools happily read
      # the target), and a banned-token scan over the public agent docs.
      #
      # It was written, and then ran nowhere — the class this change exists to
      # close. Pure bash, no cargo, ~0 s, and it belongs in `lint` for the same
      # reason the hot-path lint above does: ubuntu minutes, fails in seconds,
      # and gates every other job.
      #
      # It guards a real set now (the tree carries a root `AGENTS.md` plus one
      # per crate), and since the Linux lane landed it also carries a narrower
      # HOST-IDENTITY rule over the operator-facing files (`tools/scripts/*.sh` and
      # `.github/workflows/*.yml`), where a machine name or overlay-network address would turn
      # published CI tooling into a map of somebody's network. That rule is
      # separate from the banned-token tiers rather than a widened scope,
      # because those tiers are about tracker-id shapes, not machine names.
      #
      # `--self-test` runs FIRST and as its own step, the same shape as the
      # hot-path lint and `check_pr_title.sh`: the real tree is clean by
      # construction, so CI would otherwise never drive these patterns over
      # content that VIOLATES them — and a banned-token gate whose regex has
      # stopped matching looks exactly like a clean tree.
      - name: Agent-docs gate (self-test)
        run: ./tools/scripts/check_agents_md.sh --self-test

      - name: Agent-docs gate (budgets, shims, banned tokens, host identity)
        run: ./tools/scripts/check_agents_md.sh

      # The leak guard's blocking floor. `lint` is already required and gates
      # every other job, so these two steps block the day they land with no
      # branch-protection edit. GENERIC classes only, deliberately: this job
      # holds no secret, so the private tier lives in leak-guard.yml, which is
      # given one at step level. `--no-private` makes that explicit rather than
      # relying on an absent file.
      # Same shape as the gates above: the self-test runs FIRST as its own step.
      - name: Leak guard (self-test)
        run: python3 -B tools/scripts/leak_scan.py --self-test

      - name: Leak guard (tree, generic classes)
        run: python3 -B tools/scripts/leak_scan.py tree --no-private

      # The public-surface gate. The week before the public cut, seven classes
      # of mistake in the shipped tree were found and fixed BY HAND, one page
      # at a time: example programs that were not workspaces (several node
      # types in one file, a graph built in code, run with `cargo run`), links
      # and `cerulion` verbs and pre-move paths that did not exist, media
      # files nothing referenced, benchmark packages nothing cited, typographic
      # dashes and tracker ids in shipped text, figures no shipped package
      # backed, and a tracker-id scrub that rewrote the inside of a test's
      # string literal. Each of those is a shape a script can see, so this
      # gate reports them as `file:line: class: message` findings with one
      # remedy line per class, and it belongs in `lint` for the same reason the
      # gates above do: pure python3 over `git ls-files`, no cargo, seconds.
      #
      # It reads data files beside it: an allow list whose entries name
      # one finding each and FAIL when stale, a phrase list of claims the
      # README contradicts, and a per-file dash LEDGER that only burns down
      # (the tree carried thousands of dashes when the gate landed; a new one
      # fails, the existing debt stays until it is cleaned up, and a lowered count is the only
      # edit the ledger ever takes). The verb tree comes from the clap
      # definitions in `crates/cerulion_cli/src/cli.rs`, never from running
      # the binary, so the check cannot drift from the CLI.
      #
      # An eighth class, work-state, keeps project history out of shipped text
      # (who decided, a plan step, a review round, one of our machines, a to-do
      # list): shipped text describes the product to its user. Its patterns are
      # one more data file and its per-file LEDGER burns down the same way,
      # except that a user-facing page is never listed: it reads zero.
      #
      # `--self-test` runs FIRST and as its own step, the same shape as every
      # gate above: the real tree is clean by construction, so CI would never
      # drive these patterns over content that VIOLATES them, and a rule that
      # stopped matching would look exactly like success.
      - name: Public-surface gate (self-test)
        run: ./tools/scripts/check_public_surface.sh --self-test

      - name: Public-surface gate (examples, docs, media, benchmarks, shipped text, figures)
        run: ./tools/scripts/check_public_surface.sh

      # The semantic half of the shipped-text gates runs on its own workflow
      # (.github/workflows/public-surface-review.yml), but the script that
      # reads its verdict and decides the job's exit belongs to every push:
      # a blocking rule nobody drives is a blocking rule nobody has checked.
      - name: Public-surface review verdict renderer (self-test)
        run: python3 -B tools/review/render_public_surface_verdict.py --self-test
      # The README shows its logo and two schematics through <picture>, one
      # fixed-palette file per GitHub theme, because an SVG inside an <img>
      # follows the viewer's operating system and never the GitHub theme they
      # picked. The twins are generated from the theme-aware sources; this
      # fails when one is stale, missing, or still carries a theme rule.
      - name: README theme twins are current
        run: python3 tools/scripts/build_media_theme_variants.py --check

      # PR naming. `<type>(<scope>): <description>` for the title,
      # `<type>/<kebab-slug>` for the branch — no personal prefix, and no
      # tracker id baked into a branch name (a branch name is permanent and
      # public; the id belongs in the body, where it links and is editable).
      #
      # IN-REPO BASH, not a marketplace action: a third-party action is code
      # this repo executes with its own token, and the ones on offer are a
      # hundred lines of JavaScript for a regex. The script also runs locally
      # and is covered by `shellcheck tools/scripts/*.sh` below.
      #
      # `--self-test` runs FIRST, deliberately. It drives its whole oracle
      # table through both patterns — including the accept rows, so a pattern
      # tightened into uselessness fails HERE rather than by rejecting every
      # future pull request. A gate whose own regex is broken must not be
      # discovered by an author who cannot merge.
      #
      # The values come from the event payload through the ENVIRONMENT, never
      # interpolated into the shell: a PR title is attacker-controlled text and
      # `${{ github.event.pull_request.title }}` inside a `run:` block is a
      # script-injection seam.
      - name: PR title and branch convention
        # PULL REQUESTS ONLY, deliberately not merge_group: this step reads
        # `github.event.pull_request.title` and `.head.ref`, and a merge_group
        # payload has no pull_request object at all — the check would run against
        # empty strings and pass without asserting anything. The title and branch
        # were already checked on the PR that entered the queue, which is the only
        # place they exist.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          # The number is minted by THIS repository and never reused; the head
          # ref is fork-controlled text. The grandfather list in the script is
          # keyed on the pair, so a fork pushing a grandfathered name gets no
          # exemption.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./tools/scripts/check_pr_title.sh --self-test
          ./tools/scripts/check_pr_title.sh --title "$PR_TITLE" --branch "$PR_BRANCH" --pr "$PR_NUMBER"

  # Cross-target type-check for aarch64-unknown-linux-gnu (the
  # Jetson/Orin robotics deployment target). The monitor-wait/doorbell cfg-matrix
  # code has per-(os,arch) construction sites; a variant constructed on EVERY cell
  # except aarch64-linux trips `dead_code = deny` ONLY there — invisible to the
  # x86_64-linux + macOS-aarch64 runners above (and to local x86_64-linux and
  # aarch64-macOS machines). `cargo check` (no link, no cross C/C++ toolchain
  # needed) catches that lint pre-link. Separate job → runs in PARALLEL, no serial
  # cost on the critical path.
  cross-aarch64-linux:
    name: Cross-check (aarch64-linux)
    runs-on: ubuntu-latest
    # CI cost policy: push and workflow_dispatch only — these six were ~1/3 of hosted Linux minutes on every PR push; breakage is caught on the merge to main.
    # merge_group is excluded with pull_request: `main`'s push run is still the
    # control, so doing this work in the queue too would pay for it twice.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (+ aarch64-linux target)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cross-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-cross-aarch64-

      - name: cargo check (aarch64-unknown-linux-gnu)
        run: cargo check -p cerulion_core --target aarch64-unknown-linux-gnu

  # MSRV enforcement. Pins the toolchain to the declared MSRV
  # (Cargo.toml `rust-version`) and `cargo check`s the whole workspace so the
  # "Rust 1.93+" claim in README/CONTRIBUTING/docs is a build-proven floor, not
  # a survey. `check` (not full `test`) keeps it fast — it only needs to prove
  # the workspace COMPILES on the floor, not that every test passes (that's
  # test-linux/test-macos on stable). 1.93 is the true minimum stable that
  # resolves the WHOLE workspace: the `rerun` 0.34 SDK (pulled by the
  # `cerulion_viz` / `cerulion-vizd` members) declares rust-version 1.92, but its
  # transitive `fixed` 1.31.0 dep declares 1.93 — so 1.93 is rerun's real floor
  # with unpinned deps, above the pre-viz 1.88 floor. `--workspace` deliberately
  # INCLUDES the viz members (they are excluded from `default-members` for lean
  # builds, NOT from `--workspace`), so this job also proves rerun compiles on
  # the floor.
  # Runs in PARALLEL (no `needs:`) — off the critical path. STABLE, not the
  # PINNED_NIGHTLY used by fuzz/miri.
  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    # CI cost policy: push and workflow_dispatch only — these six were ~1/3 of hosted Linux minutes on every PR push; breakage is caught on the merge to main.
    # merge_group is excluded with pull_request: `main`'s push run is still the
    # control, so doing this work in the queue too would pay for it twice.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (MSRV 1.93.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.93.0

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-1.93-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-msrv-1.93-

      - name: cargo check (workspace, MSRV 1.93.0)
        run: cargo +1.93.0 check --workspace --all-targets

  # The example workspaces under examples/ are excluded from the
  # root workspace (root Cargo.toml `exclude`), so no other job compiles
  # them — without this gate they rot invisibly against macro/runtime API
  # changes. `cargo check` per example workspace is the cheap blocking
  # check: an example that does not compile fails CI.
  examples:
    name: Examples (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same ENOSPC class as the lint job (see its comment): each example
      # workspace compiles the full cerulion_core dep tree into its own
      # target dir, and debuginfo is dead weight for a type-check.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/*/target
          key: cargo-examples-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'examples/**/Cargo.toml') }}
          restore-keys: |
            cargo-examples-${{ runner.os }}-

      # Each example is its OWN workspace with its OWN lockfile + target dir
      # (isolated workspaces resolve fresh), so check them one at a time from
      # inside each directory. Two kinds of directory are skipped on purpose:
      # examples/go2 is checked and tested by the dedicated demos-go2 job
      # below (its joystick crate needs the libudev system library, which
      # only that job installs; on the hosted image this check dies in
      # libudev-sys's build script), and a directory with no Cargo.toml
      # (examples/moveit_hero ships no Rust workspace) would make cargo walk
      # up and check the entire root workspace under this job's cache key.
      - name: cargo check each example workspace
        run: |
          for dir in examples/*/; do
            case "${dir}" in
              examples/go2/) echo "skip ${dir} (covered by the demos-go2 job)"; continue;;
            esac
            if [ ! -f "${dir}Cargo.toml" ]; then
              echo "skip ${dir} (no Cargo.toml)"
              continue
            fi
            echo "::group::cargo check ${dir}"
            (cd "${dir}" && cargo check)
            echo "::endgroup::"
          done

  # The Go2 demo workspace (examples/go2) is ISOLATED: not a member of
  # the root cargo workspace, and deliberately skipped by `examples` (its
  # joystick crate needs the libudev system library, which only this job
  # installs), so without this job NOTHING in CI compiles it, and nothing runs
  # its tests. That gap would swallow a shipped-robot correctness guard: the
  # `/frontvideostream` wire tests decode REAL captured camera bytes against a
  # hand oracle and re-validate the SHIPPED `graphs/go2.bridge.yaml` (its
  # `msg_dirs` entry, its raw-route mapping, its `max_slice_len` headroom), and
  # a change anywhere in cerulion_core's codegen or wire format could break
  # every one of them with every check green.
  #
  # Deliberately NOT path-filtered to examples/go2/**: the demo's dependency is on
  # the MAIN workspace, so the breakages worth catching arrive from outside its
  # own directory. It runs in parallel with the other jobs, so it costs no
  # serial time on the critical path.
  #
  # GStreamer is NOT installed here. `camera_jpeg`'s capture
  # feature is non-default, so its pure frame/queue oracles and its transport
  # test build and run on a machine with no GStreamer at all — which is exactly the
  # property this job also proves. `--test loopback_e2e_test` is therefore NOT
  # run: it is the rig that needs GStreamer at runtime, and without the feature it deliberately FAILS
  # rather than reporting a vacuous `0 passed` (see its module docs).
  demos-go2:
    name: Demo workspace (examples/go2)
    # THIS JOB NEEDS MULTICAST. `cargo test --workspace` below runs `dds_bridge
    # --test shutdown_dispose_test`, which needs a multicast-capable,
    # non-loopback, non-point-to-point interface: rustdds 0.13.1 has no unicast
    # initial-peers knob, so same-host DDS discovery is multicast-only, and
    # that test's own `shared_discovery_iface` enumerates interfaces the way
    # rustdds does (`is_up()` + `is_multicast()` + non-loopback) and panics
    # FAST on its precondition when none exists. The stock runner image has
    # one; a container network that does not carry `IFF_MULTICAST` would make
    # the precondition unsatisfiable, so this job must stay on the plain VM.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Same ENOSPC class as the lint/examples jobs: this workspace compiles
      # its own copy of the cerulion_core + iceoryx2 + rustdds tree into its
      # own target dir, and debuginfo is dead weight for a test run.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # `joystick_teleop` depends UNCONDITIONALLY on gilrs, whose Linux backend
      # pulls `gilrs-core` -> `libudev-sys`, and that crate's build script
      # `unwrap()`s a `pkg-config --libs --cflags libudev` probe. Without the
      # dev package the FIRST build step of this job dies in a build-script
      # panic and every coverage promise below is inert (observed on one run).
      # `pkg-config` itself is already on ubuntu-latest.
      #
      # Not feature-gated, deliberately: gilrs is the joystick node's whole
      # reason to exist and its manifest declares it as a plain dependency, so
      # putting it behind a feature would change the demo's default build
      # surface against the crate's own documented intent. The system package
      # is the right fix — and it is invisible on macOS, where gilrs resolves
      # the IOKit backend and libudev-sys never enters the graph at all (which
      # is exactly why local Mac verification could not see this).
      #
      # This does NOT weaken the job's no-GStreamer stance: nothing GStreamer
      # is installed, and camera_jpeg still builds capture-less by design.
      - name: Install libudev (joystick_teleop -> gilrs -> libudev-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/go2/target
          key: cargo-examples-go2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'examples/go2/**/Cargo.toml') }}
          restore-keys: |
            cargo-examples-go2-${{ runner.os }}-

      # COMPILE EVERYTHING FIRST — `--tests`, because a plain `cargo build`
      # builds no test target at all. A cerulion_core API change that breaks a
      # examples/go2 test file must fail HERE even when that file's test is one we
      # deliberately do not RUN below. `--workspace` (not a hand list) is the
      # default-cover model: a new test file added to any demo crate is
      # compiled automatically, never silently dropped.
      #
      # This step is also the demo's headline claim: `cd examples/go2 && cargo build` is
      # ROBOT-DAY.md step 0.5, and the point of making camera_jpeg's capture
      # feature non-default is that it now succeeds with no GStreamer at all —
      # which is exactly the runner's state (nothing GStreamer is installed
      # below, deliberately).
      - name: cargo build --tests (every target, no GStreamer installed)
        run: cd examples/go2 && cargo build --workspace --tests

      # CLIPPY, in the job that already has the tree compiled. `lint`'s
      # `cargo clippy --workspace` covers ROOT-workspace members only, so the
      # demo's 21k lines — the code a user of the Go2 demo reads and copies —
      # had no lint gate at all, while the root workspace runs `dead_code`,
      # `unused_imports` and `unused_variables` at DENY.
      #
      # Here rather than in `lint` because this job has already paid for the
      # build (`lint` would otherwise pay a second cold compile of
      # the iceoryx2 + rustdds tree). Measured clean at `-D warnings` on the
      # committed tree, so it ships blocking with no crate-level `allow`s and
      # no exceptions.
      - name: cargo clippy (examples/go2, strict)
        run: cd examples/go2 && cargo clippy --workspace --all-targets -- -D warnings

      # RUN the runner-safe set. Two invocations, and the split is the whole
      # exclusion list — there are no other caps:
      #
      #   1. everything EXCEPT camera_jpeg, by `--exclude` rather than by name,
      #      so new test files in dds_bridge / go2_tf_source / joystick_teleop /
      #      keyboard_teleop / teleop_mux / cerulion_go2_dds run automatically.
      #   2. camera_jpeg enumerated, because ONE of its two test binaries
      #      cannot run here (below).
      #
      # `--test-threads=1`: several of these build real iceoryx2 transports and
      # DDS participants, whose process-global singletons race under libtest's
      # default intra-binary parallelism (the main test-linux job's rationale).
      #
      # EXCLUDED FROM RUNNING, each with its reason — nothing is capped silently:
      #
      #   * `camera_jpeg --test loopback_e2e_test` — needs GStreamer AND the
      #     H.264/JPEG elements (x264enc / jpegenc / avdec_h264) at RUN time,
      #     which this job deliberately does not install. Without the feature
      #     the binary is the intentional always-red shell that names the
      #     correct invocation (see its module docs), so running it here would
      #     fail BY DESIGN rather than report anything.
      #   * the `#[ignore]`d tests inside `cyclone_e2e_test`,
      #     `participant_lease_ageout_test` and `raw_route_test` — environment-bound by
      #     their own authors: they need a live CycloneDDS peer / a ROS distro /
      #     a real multi-process DDS discovery window with a ~10 s wall wait.
      #     These are NOT an exclusion this job makes: they still run as part of
      #     the invocations below and libtest reports them as `ignored`, so they
      #     stay visible in the log rather than disappearing from a hand list.
      #
      # Everything else runs: ~16 s locally for the full set.
      - name: cargo test (everything but camera_jpeg)
        run: cd examples/go2 && cargo test --workspace --exclude camera_jpeg -- --test-threads=1

      # camera_jpeg's featureless suites: the pure frame/queue oracles (--lib)
      # and the injected-buffer transport test. Both are GStreamer-free BY
      # DESIGN — that separation is what lets this job exist at all.
      - name: cargo test (camera_jpeg, featureless targets)
        run: |
          cd examples/go2
          cargo test -p camera_jpeg --lib -- --test-threads=1
          cargo test -p camera_jpeg --test node_publish_test -- --test-threads=1

  # Tests on Linux.
  #
  # Default-cover model. Instead of enumerating individual test
  # files (which silently dropped any file not named — a large share of the
  # `cerulion_core` integration files were dormant, never run in CI), this
  # job runs the WHOLE `cerulion_core` integration + lib suite in one
  # invocation. New test files are picked up automatically.
  #
  # There is NO blanket `--test-threads=1` on the invocation. The case for one
  # would be that cargo runs test BINARIES sequentially so the only remaining
  # hazard was libtest threading ONE binary's `#[test]` fns over the iceoryx2 /
  # zenoh singletons and the dlopen'd cdylib `NODES` static — one flag closing
  # that for every file at once, including future files that touch the singleton
  # and forget `#[serial]`.
  #
  # Instead, the shard execs `cargo nextest run`, which gives each
  # test its OWN PROCESS: the cdylib `NODES` static, `set_var`, the
  # `#[traced_test]` global subscriber and any counting allocator are all
  # process globals, so a fresh process makes those classes unreachable rather
  # than merely serialised. What a fresh process does NOT isolate is the DEFAULT
  # iceoryx2 namespace, which is a MACHINE resource — so the binaries that touch
  # it are fenced BY NAME in `.config/nextest.toml`, together with the
  # wall-clock latency gates, which need a quiet machine for a different reason
  # and therefore use a different mechanism.
  #
  # The "future file that forgets" case is covered better than the flag covered
  # it: `cerulion_core/tests/serial_discipline_test.rs` FAILS on a
  # singleton-creating test file that is not in the fence, and on a fence entry
  # that is not in its declared inventory. `#[serial]` attrs stay on the
  # individual tests — inert under process-per-test, still meaningful under a
  # plain `cargo test`, and documenting intent at the site.
  #
  # SHARDED (see the block above `tools/scripts/ci_test_shard.sh`'s usage): a shard is
  # one runner VM running a SUBSET of the `cerulion_core` test binaries. Each VM
  # has its own /dev/shm, which is what makes splitting ACROSS runners legal;
  # within one runner it is the fence, not a flag, that keeps the namespace
  # binaries apart.
  # ==========================================================================
  # BUILD ONCE, RUN MANY — the test binaries the four Linux shards execute.
  #
  # MEASURED (box-ci, 2026-09-14, cgroup sample of 909 rows): a heavy shard is busy
  # 99.7 % of its wall at a mean 0.50 of 4 threads — ~48 % of busy time at <=2
  # threads (serial test EXECUTION) and ~38 % above 3 threads (COMPILE). That
  # compile is the same work four times: every shard linked the same ~180
  # `cerulion_core` test binaries and then ran a quarter of them. ~135 of the
  # ~290 thread-min a PR spends here was duplicate.
  #
  # This job builds them ONCE with `cargo nextest archive`; the shards RUN the
  # archive (`--archive-file`) and build nothing.
  #
  # HOW THE ARCHIVE REACHES THE SHARDS: as a run-scoped ARTIFACT, uploaded once
  # here and downloaded by each shard. It is VERIFIED rather than trusted:
  # this job exports the archive's `sha256` as a job OUTPUT and every shard
  # checks the file it downloaded against
  # `needs.test-archive.outputs.archive_sha256` BEFORE extracting it, which
  # also catches a torn or short download for free.
  test-archive:
    name: Test archive (Linux, build once)
    runs-on: ubuntu-latest
    needs: [lint]
    # The build half of a shard's work, without the test execution.
    timeout-minutes: 60
    # SAME value as `test-linux` below, and the shards ASSERT it rather than
    # trusting this comment: `ci_test_shard.sh` compares the archive job's
    # recorded `CARGO_PROFILE_DEV_DEBUG` and `rustc -V` against its own and dies
    # on drift. GitHub Actions has no YAML anchors, so an asserted contract is
    # the closest thing to one shared block.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    outputs:
      archive_sha256: ${{ steps.publish.outputs.sha256 }}
      rustc: ${{ steps.publish.outputs.rustc }}
      profile_debug: ${{ steps.publish.outputs.profile_debug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Preinstalled-image bloat: same reclaim, same reason as `test-linux`.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # RESTORE ONLY. `test-linux` shard 0 remains the saver for this key; two
      # savers on one key race, and this job has no better cache to offer than
      # the one the shards already maintain.
      - name: Restore cargo (no save)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The fixture cdylibs the `DylibNodeEntry` tests dlopen and the binaries
      # the e2e tests spawn are NOT test targets, so `nextest archive` does not
      # build them — this step does, and `.config/nextest.toml`'s
      # `archive.include` then puts them into the archive at `target/debug/…`,
      # which is exactly where `find_fixture_cdylib` looks (it resolves from the
      # TEST BINARY's own location, so under an extracted archive that is the
      # extracted tree).
      - name: Build test cdylibs and binaries
        run: cargo build --workspace

      - name: Install cargo-nextest
        run: ./tools/scripts/install_nextest.sh

      # `--profile ci` so the archive is built under the same profile the shards
      # run with (the serial fences live there too, but those are read from the
      # repo at RUN time, not baked in).
      - name: Archive the test binaries
        run: |
          set -euo pipefail
          cargo nextest archive --profile ci -p cerulion_core \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          ls -l "$RUNNER_TEMP/nextest-archive.tar.zst"
          # THE NUMBER THE SHARDS ARE SIZED AGAINST, measured rather than assumed.
          #
          # What a shard has to find room for is the UNCOMPRESSED tree, and the
          # compressed figure above understates it several-fold — which is how
          # four shards came to be pointed at a filesystem that could not hold
          # it. Printing it here costs one decompress in a job that already runs
          # ~22 minutes, and it keeps being true as the tree grows: the day this
          # crosses the work volume's free space, the log says so.
          if command -v zstd >/dev/null 2>&1; then
            zstd -dc "$RUNNER_TEMP/nextest-archive.tar.zst" | tar -tvf - \
              | awk '{ n++; b += $3 } END {
                  printf "archive contents: %d entries, %d bytes uncompressed (%.2f GiB)\n", n, b, b/1073741824 }'
          else
            echo "::warning::no zstd CLI on this runner: the uncompressed size was not measured"
          fi

      # The PROVENANCE the shards check what they downloaded against. `sha256`
      # is per-run and not forgeable from another run; `rustc` and
      # `profile_debug` let `ci_test_shard.sh` refuse an archive built by a
      # different compiler or under a different profile rather than silently
      # rebuilding it.
      - name: Publish the archive provenance
        id: publish
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/nextest-archive.tar.zst"
          sha=$(sha256sum "$A" | awk '{print $1}')
          {
            echo "sha256=$sha"
            echo "rustc=$(rustc -V)"
            echo "profile_debug=${CARGO_PROFILE_DEV_DEBUG:-}"
          } >> "$GITHUB_OUTPUT"
          echo "archive sha256: $sha"

      # The artifact is how these bytes reach a shard, so this job uploads THE
      # FILE IT JUST BUILT.
      #
      # Delegating that to a second job which builds its own copy and refuses
      # to upload unless the sha256 matches could only ever fail: a nextest
      # archive is a tar, a tar records mtimes, and two independent builds do
      # not produce the same bytes, so such a fallback would refuse on every run
      # and the shards would have nothing. The remedy is to not rebuild rather
      # than to loosen the check: the check is right and a second build is the
      # mistake.
      #
      # `compression-level: 0` because the file is already zstd-compressed.
      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-archive-linux
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

  test-linux:
    name: Test (Linux) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # `test-archive` builds the `cerulion_core` test binaries this job RUNS — see
    # the block above it for the measurement that motivated it.
    #
    # There is no third job to wait on: `test-archive` uploads the artifact
    # itself, in that same job, so by the time it reports success the archive is
    # ready and these shards start immediately.
    needs: [lint, test-archive]
    strategy:
      # One shard's failure must not cancel the other three: the whole point of
      # the split is that the shards report independently, and a red shard 2
      # tells you nothing about shard 3.
      fail-fast: false
      matrix:
        # The shard COUNT is passed to the script as a literal below, and
        # `the_ci_shard_matrix_agrees_with_the_shard_count_argument`
        # (cerulion_cli_engine/tests/ci_test_coverage_test.rs) asserts this list
        # is exactly `0..count-1` for that literal — a mismatch would silently
        # drop or double-run test files across the shards.
        shard: [0, 1, 2, 3]
    # 30 → 45: main's serial suite already ran 29m22s
    # against the 30m ceiling — any test-adding PR gets CANCELED with every
    # suite green (observed on one pull request: 30m07s, zero failures, canceled).
    # 45 → 55: the `cerulion_netd --features wan` step below is the
    # FIRST job here to compile the iroh tree (~390 crates cold), so give the
    # cold-cache run headroom (the netd tests themselves finish in <1s).
    # 55 → 65: this job gains the `cerulion_bag`/`cerulion_bagd` steps
    # (~2 min), and the job was MEASURED at 45-53 min against the 55 ceiling
    # with SEVEN self-cancels in the last 40 runs — so adding steps under that
    # ceiling would convert green suites into cancellations. The ceiling is
    # SELF-CHOSEN, not a platform limit (GitHub's default is 360), and it exists
    # to stop a hung job burning minutes, not to enforce a runtime budget.
    # 65 → 80: the 65 ceiling fired THREE self-cancels in ONE
    # morning (three pull requests, each at 65m05-65m07s with tests still PASSING
    # at 63.5 min — not a hang), while passing runs sat at 60m33s-62m25s.
    # 80 → 60 (the shard split): a leg now links roughly a QUARTER of the
    # `cerulion_core` test binaries instead of all 237, plus one group of the
    # small packages.
    #
    # 60 and not the ~40 the arithmetic suggests, deliberately. The division is
    # a PREDICTION and only PART of the job divides: `cargo build --workspace`
    # (every fixture cdylib and every workspace lib) and the whole dependency
    # compile are paid per leg IN FULL. Nobody can measure the ratio off a
    # laptop, a cold-cache timeout is self-sustaining (the job dies before
    # `actions/cache` can save), and this file records the cost of guessing
    # tight FOUR TIMES — seven self-cancels at ~55 min in the 55 era, three at
    # ~65 min in one morning in the 65 era, every one of them a green suite
    # reported as a cancellation. Same rule as every number above: the ceiling
    # guards a HUNG job, not a budget. Tighten it once three or four green runs
    # have put a real wall on a leg — that is an OPEN ITEM, not an oversight.
    timeout-minutes: 60
    # Even with the SDK-bloat reclaim below, the union of the
    # external-source feature + the multi-process spawner overflowed the runner
    # disk mid-link ("No space left on device" building the CLI TUI test step).
    # Debuginfo dominates the debug target dir, so trim it to line tables only
    # for THIS job — backtraces keep file:line (all CI needs), and the target
    # footprint drops by roughly a third to a half. The release-mode latency
    # jobs are untouched.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The default-cover suite compiles ~70 integration-test binaries
      # + 11 cdylib fixtures in one job — far more link output than an
      # enumerated subset. The stock ubuntu-latest runner (~14 GB free) ran out
      # of disk mid-link (`ld ... signal 7 [Bus error]`, "Free space left: 88 MB")
      # while the smaller macOS runner passed. Reclaim preinstalled SDK bloat we
      # never use (~25-30 GB: Android, .NET, GHC/Haskell, CodeQL, Swift, tool
      # caches) so linking has headroom.
      #
      # Even with this fuller variant in place, it was
      # STILL not enough. All four pull requests open at the time died in
      # the `cerulion_netd tests (--features wan)` step below, on a runner this
      # step had just left with 42 G free of 72 G — `/dev/root 72G 30G 42G 42% /`,
      # byte-identical on all four. Three of them died as `collect2: fatal error:
      # ld terminated with signal 7 [Bus error]` linking the netd test binaries
      # (`wan_plane_iroh_test`, `daemon_idle_exit_e2e_test`, the netd bin test) —
      # the exact ENOSPC-during-link signature named above; the fourth's link squeaked
      # through and it died one step later inside the test itself, on a 19 MB
      # fixture write returning `Os { code: 28, kind: StorageFull }`. That step
      # builds a SECOND feature combination of netd (~390 crates of iroh tree) on
      # top of a target dir already holding the whole workspace plus every test
      # binary, so the remedy is more headroom up front, not a smaller wan build.
      #
      # Everything ADDED below is preinstalled tooling this job never touches, and
      # the two biggest already have precedent in `cli-e2e-graph-latency` below:
      # `$AGENT_TOOLSDIRECTORY` is the whole /opt/hostedtoolcache (Python / Node /
      # Go / Ruby / Java, ~8-9 G) and boost is ~1 G. Safe because the Rust
      # toolchain comes from rustup (not the tool cache) and actions/checkout +
      # actions/cache run on the runner's OWN bundled node, so nothing on this
      # job's path lives in there.
      #
      # NOT done here, having been checked: removing `target/debug/incremental`.
      # dtolnay/rust-toolchain already exports `CARGO_INCREMENTAL=0` (it appears
      # in every step's env block in the run logs), so there is no incremental
      # directory to reclaim.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
                      /usr/local/share/boost \
                      /usr/share/miniconda \
                      /usr/local/share/vcpkg \
                      /usr/lib/google-cloud-sdk \
                      /usr/local/lib/node_modules \
                      /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /
          # This step's own headroom lever is EXHAUSTED (see the
          # canonical note on the reclaim step below), so the open escalation
          # question is whether this runner carries a second, larger volume we
          # could move `target/` onto. Nothing in this workflow has ever printed
          # one, so no post-mortem can answer it. Costs a `df`; changes nothing.
          df -h /mnt 2>/dev/null || echo "no /mnt on this runner"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # ONE SAVER, CHOSEN RATHER THAN RACED. All four legs of this matrix share
      # `cargo-${{ runner.os }}-<lockhash>`, and `actions/cache` RESERVES a key
      # at save time: whichever leg finishes first wins, the other three upload
      # a multi-gigabyte archive that is then rejected ("another job may be
      # creating this cache"), and the archive that lands is whichever leg's
      # `target/` happened to be newest — arbitrary, and different run to run.
      # Shard 0 saves; shards 1-3 restore only.
      #
      # NOT a per-shard key, deliberately: `target/` for this workspace runs to
      # several GB, GitHub evicts a repository's caches against a 10 GB total,
      # and four archives per OS per lockfile would have the shards evicting
      # each other AND every other job's namespace. One archive, one writer.
      #
      # WHICH leg writes is a FIXED PICK, not a measured optimum, and shard 0
      # is a defensible one rather than the best one. It carries `--lib` and
      # the doctests, so it builds the `cerulion_core` rlib every other leg
      # also needs — its `target/` is never a strict subset of a bare leg's.
      # That is the whole claim.
      #
      # It is explicitly NOT the deepest tree, and a maintainer weighing the
      # "move the cache save off shard 0" lever named in the package-map table
      # should not read it as one. MEASURED against the map below: shard 1's
      # package tree is a strict SUPERSET of shard 0's (`cerulion_cli` depends
      # on `cli_engine`, `bagd`, `bag`, `cli_tui` and `dds`), and shard 3's
      # union is the largest of the four because it alone compiles the ~390-crate
      # iroh tree. If cache CONTENT ever becomes the deciding factor, shard 3
      # is the leg to measure — but note it would then also be paying the save
      # tail on top of the wan step's disk pressure. (Re-derived at the
      # shard rebalance: shard 0 now carries only `bagd` beside `--lib`, and
      # `cerulion_cli` depends on `bagd`, so shard 1's tree is still a strict
      # superset of shard 0's (`rmw_cerulion` rides shard 3). If the package
      # map moves again, re-derive this
      # rather than trusting it.)
      # (On Linux `lint` normally reserves this key first and every save here is
      # skipped as an exact hit; there is no `lint` leg on macOS, which is where
      # the race actually bit.)
      - name: Cache cargo (shard 0 is the saver)
        if: matrix.shard == 0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore cargo (shards 1-3, no save)
        if: matrix.shard != 0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Build the cdylib test fixtures (loaded via libloading at runtime, so
      # cargo doesn't treat them as deps of the test crates). `--workspace`
      # builds every fixture — drift-proof, unlike the prior enumerated `-p`
      # list (which had gone stale: a deleted crate + two missing ones). Same
      # spirit as the default-cover test model below.
      # The archived test binaries are RUN in this job, never built, so nothing
      # here puts a DEV-dependency source into the cargo registry: the workspace
      # build below compiles no test target, and the archive arrives as finished
      # binaries. One of those binaries needs dev-dependency sources at RUN time.
      # `macro_compile_fail_test` is a trybuild harness, and trybuild folds the
      # crate's dev-dependencies into the project it generates and then builds
      # that project with `--offline`. So `proptest`, and `bit-set` underneath
      # it, must already be on disk, or the harness dies with "attempting to
      # make an HTTP request, but --offline was specified" and the shard is red.
      #
      # Without this step, whether they are on disk is LUCK: it depends on what
      # the cargo restore above happened to carry and, on a runner whose cargo
      # home outlives the job, on what an earlier job on that same machine
      # fetched. `cargo fetch` downloads the whole lockfile closure,
      # dev-dependencies included, and costs seconds once the registry is warm.
      #
      # The macOS shards need no such step: they have no archive, so nextest
      # BUILDS the test binaries there and cargo fetches the dev-dependencies as
      # part of that build.
      - name: Fetch the lockfile closure (the archived trybuild test builds offline)
        run: cargo fetch --locked

      - name: Build test cdylibs
        run: cargo build --workspace

      # The whole-workspace build is the job's single biggest disk
      # consumer and was the one point between the reclaim and the wan step with
      # no `df` at all — every post-mortem had a reading from before the build
      # and one from 50 minutes later, with nothing in between to apportion it.
      - name: Report free disk after the workspace build
        run: df -h / || true

      - name: Install cargo-nextest
        run: ./tools/scripts/install_nextest.sh

      # Whole cerulion_core suite (every integration test binary + the lib
      # unit tests) in one invocation.
      # `latency_threshold_test` is `#![cfg(not(debug_assertions))]`, so it
      # compiles to zero tests here and is exercised by the release-mode
      # `test-latency` job instead. The const-eval trybuild cases are
      # `#[ignore]`d (rustc-version-fragile diagnostics) and run on demand.
      # ---------------------------------------------------------------
      # THE SHARD. `tools/scripts/ci_test_shard.sh` enumerates
      # `cerulion_core/tests/*.rs` at depth 1, sorts, and takes every file
      # whose position is `index mod count` — GENERATED, never hand-listed,
      # because a hand list is the failure mode this workflow has paid for
      # four times (a package or file named in no step). `--lib` rides shard 0.
      #
      # `--check` proves the partition is total and disjoint; it is driven from
      # `cerulion_cli_engine/tests/ci_test_coverage_test.rs` so a broken split
      # is a local red, not something you learn from a green CI run that
      # quietly ran 178 of 237 files.
      #
      # NOT SERIAL ANY MORE. The script now execs `cargo nextest run`, which
      # runs each test in its OWN PROCESS and serialises only the binaries that
      # genuinely cannot run beside a sibling — the fence in
      # `.config/nextest.toml`. `-- --test-threads=1` is gone, and its absence
      # is the change: the belief that iceoryx2's shared memory forces the whole
      # package to run one test at a time was measured and is false, because the
      # large majority of these binaries already mint per-test SHM roots.
      # Fence membership is gated by
      # `cerulion_core/tests/serial_discipline_test.rs`, so it cannot silently
      # lose a binary.
      # ---------------------------------------------------------------
      # THE ARCHIVE THE SHARD RUNS INSTEAD OF BUILDING.
      #
      # Note what did NOT move: `cargo build --workspace` above stays, because
      # this job is not only the `cerulion_core` shard — the rmw / CLI / bagd /
      # netd steps below need the workspace's binaries and the cdylib fixtures
      # they dlopen. What the archive removes is the ~180 `cerulion_core` TEST
      # BINARY links each shard would otherwise pay to run a quarter of them, which is
      # the duplicated half the cgroup sample measured.
      #
      # One transport, verified rather than trusted: the artifact this run's
      # archive job uploaded, checked against the sha256 it exported before a
      # byte is extracted. Hashing the file AFTER it lands in `$RUNNER_TEMP`
      # also catches a torn or short download for free.
      - name: Download the test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextest-archive-linux
          path: ${{ runner.temp }}

      - name: Verify the downloaded archive
        env:
          WANT_SHA: ${{ needs.test-archive.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          got=$(sha256sum "$RUNNER_TEMP/nextest-archive.tar.zst" | awk '{print $1}')
          [ "$got" = "$WANT_SHA" ] || {
            echo "::error::downloaded archive sha256 '$got' != '$WANT_SHA'"
            exit 1
          }
          echo "downloaded archive verified: $got"

      # WHERE THE ARCHIVE LANDS, and it was not a detail: an early run of this
      # died on ALL FOUR shards with `No space left on device (os error 28)` on
      # a machine with hundreds of GB free, because the extract went to a
      # RAM-backed `/tmp` rather than to the work volume. The archive was fine
      # (each shard had logged that it verified the download by sha256), so
      # this step makes the DESTINATION as legible as the source, on every run,
      # before anything is written.
      #
      # Two consequences a free-space figure alone would miss, and both argue
      # the same way:
      #
      #   * a tmpfs is RAM, so a bigger one would trade ENOSPC for an OOM kill.
      #     The extract must not be memory at all.
      #   * `/tmp` is also where iceoryx2 puts its SHM state, so an extract
      #     filling it would starve the tests it exists to run.
      - name: Space for the extract (evidence, not a guess)
        run: |
          set -euo pipefail
          echo "== free space where the archive will be unpacked =="
          df -h /tmp "$RUNNER_TEMP" || true
          echo "== filesystem type of each =="
          # `stat -f -c %T` is the one that says "tmpfs" rather than a device
          # name, which is the whole distinction this step exists to surface.
          for d in /tmp "$RUNNER_TEMP"; do
            printf '%s: fstype=%s\n' "$d" "$(stat -f -c '%T' "$d" 2>/dev/null || echo unknown)"
          done

      - name: cerulion_core tests (shard ${{ matrix.shard }} of 4, nextest)
        env:
          # Archive mode. `ci_test_shard.sh` asserts the two provenance facts
          # below against its own before it runs anything, so a drifted toolchain
          # or profile fails loudly rather than running one compiler's binaries
          # under another — or silently rebuilding, which would undo the job.
          CI_TEST_SHARD_ARCHIVE: ${{ runner.temp }}/nextest-archive.tar.zst
          CI_TEST_SHARD_ARCHIVE_RUSTC: ${{ needs.test-archive.outputs.rustc }}
          CI_TEST_SHARD_ARCHIVE_PROFILE_DEBUG: ${{ needs.test-archive.outputs.profile_debug }}
          # Unpack onto the WORK VOLUME, not the `/tmp` nextest would otherwise
          # pick via $TMPDIR (see the step above). Setting $TMPDIR instead would
          # move the tests' own scratch as well, including iceoryx2's, which is
          # an unmeasured change, so the extract is redirected by name and
          # nothing else moves.
          CI_TEST_SHARD_EXTRACT_DIR: ${{ runner.temp }}/nextest-extract
        run: ./tools/scripts/ci_test_shard.sh cerulion_core ${{ matrix.shard }} 4

      # cerulion_core's DOCTESTS — still `cargo test`, because NEXTEST DOES NOT
      # RUN DOCTESTS AT ALL (upstream limitation, not a configuration choice).
      # Dropping this step while moving the suite to nextest would silently
      # retire cerulion_core's 15 doctests, four `compile_fail` pins among them
      # (`DataOnlySubscriber` must be structurally un-attachable to a WaitSet;
      # three `state` misuse pins) — which is exactly the "ran in no job" class
      # this step was added to close. The shard step carries a target filter,
      # which excludes doctests either way. Measured 0.70 s of test time against
      # an already-built rlib. Shard 0 for the same reason `--lib` does: it has
      # to happen exactly once.
      #
      # Of those 15, exactly TWO execute (the rest are `no_run` / `compile_fail`
      # / `ignore`), and `serial_discipline_test` now walks every `src/` doctest
      # in the repo to keep it that way for any that would touch the singleton:
      # a doctest takes no `#[serial]` and is not a test BINARY, so it can join
      # neither of this repo's other two protections.
      - name: cerulion_core doctests
        if: matrix.shard == 0
        run: cargo test -p cerulion_core --doc

      # ======================================================================
      # THE RECLAIM (canonical explanation; the twin before the wan
      # step below is the same script, and says so rather than re-arguing it)
      #
      # MEASURED, five observed firings, all in this job: runs of two pull
      # requests and TWO main pushes. Every one died as
      #   collect2: fatal error: ld terminated with signal 7 [Bus error]
      # linking a `cerulion_netd` test binary, with ZERO test failures, at the
      # tail of an hour-long job. Three of them are still readable, and they say
      # the same thing three times.
      #
      # It is NOT a toolchain bug, lld's "PLEASE submit a bug report" banner
      # notwithstanding. The `df` this job already prints immediately before the
      # wan step read, in the three recoverable runs:
      #     72G  70G  2.3G  97% /      (a pull-request run)
      #     72G  71G  923M  99% /      (the first main push)
      #     72G  71G  824M  99% /      (the second main push)
      # and the runner's OWN warning lands in the same second as the Bus error:
      #   "You are running out of disk space ... Free space left: 0 MB"
      #   "You are running out of disk space ... Free space left: 88 MB"  (…134)
      # SIGBUS *is* the ENOSPC signature for a linker: lld writes its output
      # through an mmap, and the store faults when the filesystem can no longer
      # back the page. (OOM would be SIGKILL / exit 137; nothing here shows one.)
      #
      # WHY NOT MORE HEADROOM. That lever is spent. The reclaim at the top of
      # this job already takes `/` from 15 G free to 49 G — identically in all
      # three runs — and every large preinstalled tree is already in its list
      # (it was added once, doubled later, and was still not enough). The
      # job then consumes essentially the whole 49 G.
      #
      # So reclaim from the CONSUMER instead. The steps above link ~336
      # integration-test executables — 229 in `cerulion_core` alone — and by the
      # time each prune runs, every one of them has already RUN. Nothing below
      # reads them. Only executables sitting DIRECTLY in `target/debug/deps` are
      # removed, which is exactly that set:
      #   * `.rlib` / `.rmeta` / `.d` stay, so nothing RECOMPILES — a binary
      #     cargo wants again is relinked from the artifacts that stay;
      #   * `.so` stays: the dlopen'd cdylib fixtures (`test_fixtures/**`) and
      #     the proc-macro dylibs, which later steps genuinely load;
      #   * `build_script_build*` stays — cargo runs build scripts out of
      #     `target/debug/build/`, whose entries are hardlinks to these, and a
      #     hardlink means deleting one copy frees no blocks anyway.
      #
      # No cache cost: the `cargo-Linux-` archive measures ~563 MB restored
      # (registry + git — this job builds `target` cold), so there are no test
      # executables in it to lose.
      #
      # TWO placements, not one. Before the wan step alone would fix the five
      # observed firings and nothing else: the second main push entered that step
      # with 824 MB free, i.e. the steps ABOVE had already spent 48 of the 49 G,
      # so the next PR that adds test binaries to `cerulion_core` moves the wall
      # earlier and a single late prune misses it entirely. This one runs right
      # after the largest producer. The script is inlined twice because the only
      # way to share it is a composite action, which is a restructuring this
      # change deliberately is not.
      #
      # `|| true` throughout and a `df` on each side: a reclaim step must never
      # be the thing that reds a run, and the pair of readings is what makes the
      # next firing attributable.
      # ======================================================================
      #
      # ARCHIVE MODE MOVED THE LARGEST PRODUCER, so this step follows it. The
      # `cerulion_core` binaries the shard just ran no longer live in the
      # checkout's `target/debug/deps` at all — `--extract-to` unpacks them under
      # `$RUNNER_TEMP`, together with a 3.60 GiB compressed archive this shard is
      # finished with. Left behind, that pair is the largest single claim on the
      # work volume at the point the later linking steps need it, and the `find`
      # below cannot see either of them (the archive half and the extracted
      # tree are the same defect one directory over).
      # Both are removed by name, still with `|| true`.
      - name: Reclaim disk from already-run test binaries
        run: |
          df -h / || true
          find target/debug/deps -maxdepth 1 -type f -executable \
               ! -name '*.so' ! -name '*.rlib' ! -name '*.rmeta' ! -name '*.d' \
               ! -name 'build_script_build*' -delete || true
          rm -rf "$RUNNER_TEMP/nextest-extract" || true
          rm -f  "$RUNNER_TEMP/nextest-archive.tar.zst" || true
          df -h / || true

      # ---------------------------------------------------------------
      # THE NON-CORE PACKAGES, one shard each.
      #
      # These are NOT sharded by file — `cerulion_core` is the whole weight
      # (263 of the workspace's integration files at this writing) and the rest are small, so
      # splitting them further would buy nothing and cost four cold builds of
      # each. They are DISTRIBUTED instead, and the mapping is a plain literal
      # per step so a reader can see where a package runs without simulating
      # anything:
      #
      #   shard 0  bagd                                   (+ core `--lib`, doctests)
      #   shard 1  cli, cli_tui
      #   shard 2  cli_engine, heaphook, macros, discovery   <- the PINNED tail
      #   shard 3  rmw_cerulion, native_ros2_messages, bag, wireclient, connectd, netd --wan
      #
      # THE MAP IS A GREEDY LONGEST-FIRST PACKING OF MEASURED STEP WALLS, and
      # the measurement is the part that matters, so it is recorded here. Six
      # green runs (all 24 `Test (Linux)` shard jobs of those six runs), step
      # walls from the jobs API (`steps[].started_at/completed_at`), six-run
      # MEDIANS in minutes:
      #
      #   cli 7.1 · bagd 6.2 · cli_engine 5.3 · netd 2.3 · rmw 1.6 · ros msgs 1.5
      #   wireclient 1.3 · cli_tui 1.1 · bag 1.0 · connectd 0.9 · discovery 0.1
      #   macros 0.1 · heaphook 0.1 · core doctests 0.0        movable total 28.6
      #
      # WHAT A SHARD'S WALL IS: (the fixed run baseline — checkout, toolchain,
      # cache, `cargo build --workspace`, reclaim: 5.8-8.6 median, and the
      # spread is machine-to-machine contention on the build step, not a
      # structural shard-0 cost)
      # + (its `cerulion_core` nextest quarter: 2.2-2.7 of COMPILE plus 12-22 s
      # of RUN on every shard but 2, whose quarter is 6.2 because it carries
      # the pinned trybuild tail — 227-428 s of ONE test) + (its package
      # steps). The core quarter is therefore NOT where the imbalance lives:
      # the per-binary walls in the nextest final block of one of those runs sum
      # to 51-63 s per shard outside the tail and no other binary exceeds
      # 18 s, so the file map in `ci_test_shard.sh` stays round-robin and no
      # second pin is warranted. The package steps are the whole imbalance.
      # (The tail itself is not addressable: splitting it by expectation
      # WITHIN the job measured +158 s of trybuild work, +2.4 min of
      # shard-step wall. It is PINNED so it cannot relocate
      # when an unrelated test file is added — evidence and the bar for a
      # second name at `PINNED_TEST` in `tools/scripts/ci_test_shard.sh`. And it does
      # NOT get its own job: a new job is not in branch protection's required
      # list, which would silently demote the only compile-fail gate to
      # advisory.)
      #
      # THE PACKING. Fixed in place: the tail (shard 2), `--lib` + doctests
      # (shard 0), the iroh trio (shard 3, together — see below), heaphook
      # (shard 2, 0.1). Everything else is placed largest-first on the
      # currently lightest shard, and only TWO steps moved from the previous
      # map: `cli_engine` shard 0 -> 2 and `rmw_cerulion` shard 2 -> 3.
      #
      #   modelled wall = baseline + core quarter + packages, before -> after
      #     shard 0   22.8 -> 17.5        shard 1   17.9 -> 17.9
      #     shard 2   13.8 -> 17.5        shard 3   16.6 -> 18.2
      #     slowest shard 22.8 -> 18.2   (ideal 17.8; the measured job-wall
      #     medians before were 24.3 / 18.4 / 13.9 / 16.5)
      #
      # Under a UNIFORM baseline (all four at the 7.35 median, i.e. treating
      # the build-step spread as pure noise) the same two moves give
      # 16.3 / 17.9 / 19.0 / 18.2, max 19.0 from 21.6 — the moves are robust
      # to that assumption; only the sub-minute crates would shuffle under it,
      # and they are left where they are.
      #
      # THE TAIL SHARD CAN CARRY A BIG LOAD NOW. The previous map gave shard 2
      # the smallest package load because the tail was modelled at ~9.2 min;
      # measured at ~4.4 it left shard 2 the LIGHTEST shard by 3-9 min in every
      # one of the six runs, and that slack is what this packing spends.
      #
      # `cli_engine` AND `bagd` DO NOT SHARE A SHARD, and that is measured.
      # Pairing them so the `bagd` tree
      # (a dependency of `cli_engine`) compiles once does not hold in the logs:
      # on shard 0 of one measured run the `cli_engine` step compiled 120
      # crates AFTER the `bagd` step had compiled 131 on the same runner — 82
      # crate names appear in BOTH steps — and on a shard with no `bagd` step
      # before it (an earlier run, before the pair was formed) it compiled
      # 113. Every `cargo test -p` step resolves its own feature set and
      # rebuilds its own tree; the shared-lib artifacts both reuse come from
      # `cargo build --workspace`, which every shard runs. Splitting the pair
      # costs nothing measurable.
      #
      # `cli` AND `cli_engine` STILL DO NOT SHARE A SHARD. All three CLI steps
      # on one runner is the map that put `Test (Linux) shard 1` at 45 min;
      # `cli` (7.1) sets shard 1's floor and `cli_tui` (1.1) sits with it
      # because the packing has the room there. That is arithmetic, not family.
      #
      # Shard 3 holds the iroh-tree packages TOGETHER on purpose: `wireclient`,
      # `connectd` and `netd` share that ~390-crate tree, so compiling it once
      # on one runner beats dragging it onto three. It is also the shard whose
      # disk THE RECLAIM notes above are about, which is why the reclaim + `df`
      # steps around the wan step are scoped to it. (`rmw_cerulion` joining it
      # adds ~125 compiled crates and a handful of test binaries BEFORE that
      # reclaim, which prunes them.)
      #
      # RE-MEASURE BEFORE RE-TILTING. This is an n=6 median table taken on one
      # runner class, and the macOS twin is a different machine with its own
      # map. Shard 0's cache SAVE is a real post-job cost this table does not
      # model (11.8-13.8 min observed on macOS), so a re-measure should read
      # shard 0 first. The per-binary walls need `final-status-level = "pass"`
      # in `.config/nextest.toml` (the final block names every test with its
      # wall); the step walls are the jobs API.
      #
      # `cargo test -p <package>` stays literally on each line — the coverage
      # walk (cerulion_cli_engine/tests/ci_test_coverage_test.rs) reads these
      # lines as its evidence.
      # ---------------------------------------------------------------
      # Touches the iceoryx2 singleton — serial. Shard 3 after the
      # rebalance (see the map above); it runs BEFORE that shard's pre-wan
      # reclaim, which prunes its test executables.
      - name: rmw_cerulion tests (serial)
        if: matrix.shard == 3
        # The runner has no ROS: a build that silently fell back to (or
        # away from) the vendored bindings could not otherwise be told —
        # every claim test is a disjunction over both sources.
        env:
          CERULION_RMW_EXPECT_BINDINGS: vendored
        run: cargo test -p rmw_cerulion -- --test-threads=1

      # The borrow-window heap hook (`cerulion_heaphook`). LINUX ONLY (this
      # step is only on `test-linux`; the interposition `.so` cannot build on
      # macOS, and the pure-logic tests are platform-agnostic so Linux execution
      # suffices). Runs the pure-logic unit tests AND the subprocess LD_PRELOAD
      # e2e — which preloads `libcerulion_heaphook.so` + the `heaphook_probe` and
      # `libheaphook_shim.so` fixtures the `Build test cdylibs`
      # (`cargo build --workspace`) step above produced. Tiny — MEASURED 5.6 s
      # in one measured job, because that build step already produced everything
      # it needs — so it rides shard 2, the tail shard, beside `macros` and
      # `discovery`, and it is named in that job's package map above.
      - name: cerulion_heaphook tests
        if: matrix.shard == 2
        run: cargo test -p cerulion_heaphook

      - name: native_ros2_messages tests
        if: matrix.shard == 3
        run: cargo test -p native_ros2_messages

      # BOTH bag crates are named explicitly — every job here names its
      # `-p` packages and there is no blanket `cargo test --workspace`
      # (see the note below), so a suite nobody names compiles under clippy
      # `--all-targets` and never RUNS. A pin that cannot fail a pull request
      # is not a gate.
      #
      # bagd is SERIAL because of a process-GLOBAL panic hook, not because it
      # taps iceoryx2 (its tests mint isolated per-instance transports):
      # `threaded_writer_panic_surfaces_config_error_and_counts_dropped` installs
      # a no-op hook while it drives the writer thread's unwind, and a parallel
      # sibling panicking inside that window would lose its backtrace.
      # `cerulion_bag` needs no flag — no globals, per-test unique counters.
      # The two bag crates run on DIFFERENT shards and that is not an
      # oversight: `bagd` (6.2 min) is shard 0's one package step beside
      # `--lib` and the doctests; `bag` (1.0) is one of the small loads that
      # level shard 3. See the table above before pairing them up on cosmetic
      # grounds.
      - name: cerulion_bag tests
        if: matrix.shard == 3
        run: cargo test -p cerulion_bag
      - name: cerulion_bagd tests (serial, process-global panic hook)
        if: matrix.shard == 0
        run: cargo test -p cerulion_bagd -- --test-threads=1

      # cerulion_macros is a proc-macro crate compiled into the host
      # toolchain — its own unit tests (parse + determinism) are NOT
      # exercised transitively by `-p cerulion_core`, so name it explicitly.
      - name: cerulion_macros tests
        if: matrix.shard == 2
        run: cargo test -p cerulion_macros

      # The CLI crates are named here too. Their 160+ tests
      # are pure-logic / filesystem and safe to run with default threading.
      #
      # THE HEAVY TWO ARE SPLIT: `cli` on shard 1, `cli_engine` on shard 2 —
      # together the three are 13.5 of the 28.6 min of package work in this
      # job, and all of it on one runner is what once put shard 1 at 45 min.
      # The placement is the measured packing in the map above, not family.
      - name: CLI engine tests
        if: matrix.shard == 2
        run: cargo test -p cerulion_cli_engine
      - name: CLI binary tests
        if: matrix.shard == 1
        run: cargo test -p cerulion_cli
      - name: CLI TUI tests
        if: matrix.shard == 1
        run: cargo test -p cerulion_cli_tui

      # `cerulion_discovery` — the LAN peer-discovery substrate extracted
      # from `cerulion_cli_engine` (the peers.json format+reader, the discovered-peer
      # types, the bounded TCP pre-filter, the pure connect-set planner) so
      # `cerulion-netd` can fold cached peers into its session without a cyclic edge.
      # These jobs enumerate packages EXPLICITLY (no blanket `cargo test --workspace`),
      # so an extraction silently un-runs every test that moved unless the new package
      # is named here. Same reason as the wireclient/connectd
      # steps below. Leaf crate (std + serde + dirs + tracing) — ~3 s, no transport.
      - name: cerulion_discovery tests
        if: matrix.shard == 2
        run: cargo test -p cerulion_discovery

      # The test jobs enumerate packages explicitly: there is NO blanket
      # `cargo test --workspace` step (it would hang on iceoryx2's SHM singleton). So
      # cerulion_wireclient — a workspace member excluded from default-members because
      # it pulls the iroh tree — needs its own `-p` step to run its extracted
      # config/protocol oracle tests. (A `--workspace` invocation WOULD cover it —
      # `--workspace` overrides default-members — but we run no such step for tests.)
      # The iroh tree it compiles is shared with the connectd + netd steps below.
      - name: cerulion_wireclient tests
        if: matrix.shard == 3
        run: cargo test -p cerulion_wireclient

      # cerulion_connectd is a workspace member excluded from
      # default-members (it pulls the iroh tree), so — like wireclient above — it needs
      # its own explicit `-p` step. This CLOSES the reader-coverage gap the extraction
      # inherited: connectd's reinject_e2e drives cerulion_wireclient's
      # `run_topic_reader` (via the worker re-export) — the ONLY behavioral test of that
      # reader loop, and this is the only CI step that runs it. Loopback-iroh + per-test
      # SHM roots ⇒ parallel-safe; shares the iroh tree the wireclient/netd steps
      # compile (no extra cold cost).
      - name: cerulion_connectd tests
        if: matrix.shard == 3
        run: cargo test -p cerulion_connectd

      # The wan step below is where all four of the red PRs ran the
      # runner out of disk, and until now the ONLY `df` in this job ran before a
      # single crate was compiled — so every post-mortem had one number from before
      # the build and none from the moment it broke. This prints the state the wan
      # step actually starts from. Instant, `|| true` because a diagnostic must
      # never be the thing that reds a run, and it changes nothing else.
      - name: Report free disk before the wan step
        if: matrix.shard == 3
        run: df -h / || true

      # The twin of the reclaim after the `cerulion_core` step —
      # identical script, canonical explanation there. This is the placement
      # aimed straight at the five measured firings: every one of them died
      # linking a netd test binary in the step below, entering it with 824 MB
      # to 2.3 GB free. The test executables the steps between the two prunes
      # linked — on THIS shard: ros msgs, bag, wireclient, connectd — have all
      # RUN, and the step below is the last one in the job, so nothing reads any
      # of them again. (The list is per-shard because the package steps are
      # `if:`-gated; pre-split it was every package in the job.)
      - name: Reclaim disk from already-run test binaries (before the wan step)
        if: matrix.shard == 3
        run: |
          df -h / || true
          find target/debug/deps -maxdepth 1 -type f -executable \
               ! -name '*.so' ! -name '*.rlib' ! -name '*.rmeta' ! -name '*.d' \
               ! -name 'build_script_build*' -delete || true
          df -h / || true

      # cerulion_netd's iroh WAN plane. `wan` is DEFAULT-ON, so
      # `cargo test -p cerulion_netd` already includes it (`--features wan` is named
      # explicitly, redundant-but-harmless). netd is excluded from default-members, so
      # the default-feature test steps above never build it — this step is its coverage.
      # Runs the netd lib/bin unit tests + the daemon/mirror/client integration tests +
      # the loopback-iroh WAN-plane e2e (real iceoryx2 + loopback iroh, per-test SHM
      # roots + per-test iroh identities ⇒ parallel-safe).
      - name: cerulion_netd tests (--features wan)
        if: matrix.shard == 3
        run: cargo test -p cerulion_netd --features wan

      # The terminal reading, and the one every post-mortem so far has
      # lacked — `if: always()` because the state that matters is the state a
      # FAILING run ends in. The three readable firings had to infer the moment
      # of exhaustion from the runner's own warning line; this records it.
      - name: Report free disk after the wan step
        # `always()` for the reason above; scoped to the shard that RUNS the
        # wan step, so the other three do not print a reading of a step they
        # never reached.
        if: always() && matrix.shard == 3
        run: df -h / || true

  # Tests on macOS — same default-cover model as test-linux (see that job's
  # comment). Mirrored so macOS-specific failures (path handling,
  # case-sensitivity, dlopen differences) are caught.
  #
  # TWO SHARDS, not `test-linux`'s four. The macOS map does NOT mirror the
  # Linux 4-way one: every shard pays a fixed cost (`cargo build --workspace`,
  # toolchain setup, the nextest install, the shared dev-dep test-compile), so
  # the macOS side runs fewer, fuller shards. The 2-way package tilt below is
  # balanced BY HAND (see the shard-step comment): shard 0 takes the
  # `cerulion_core` half that carries the pinned `macro_compile_fail_test`
  # trybuild tail (~6-9 min) plus the lighter package set; shard 1 takes the
  # other half, the CLI binary/TUI, the iroh tree (wireclient / connectd /
  # netd-wan) and the folded viz suites. Re-tilt if a run shows the two legs
  # more than 5 min apart.
  test-macos:
    name: Test (macOS) shard ${{ matrix.shard }}
    runs-on: macos-latest
    needs: [lint]
    strategy:
      # 2 shards, NOT `test-linux`'s 4: see the note above.
      # `fail-fast: false` for the same reason as `test-linux`: one red shard
      # must not cancel the other's report.
      fail-fast: false
      matrix:
        shard: [0, 1]
    # 30 → 45 with the Linux job: same suite-growth pressure —
    # headroom over the observed ~20m so the ceiling isn't the next flake.
    # 45 → 55: first job here to cold-compile the iroh tree for the
    # `cerulion_netd --features wan` step (netd tests themselves finish in <1s).
    # 55 → 65: mirrors the Linux job — the new `cerulion_bag`/
    # `cerulion_bagd` steps add ~2 min against a ceiling already measured at
    # 45-53 min with seven self-cancels in 40 runs. The ceiling is self-chosen
    # (GitHub's default is 360) and guards against a hung job, not runtime.
    # 65 → 80: mirrors the Linux raise — Linux fired three
    # self-cancels at 65m in one morning; macOS passes sat at 47-53 min.
    # 80 → 60 (the shard split): mirrors the Linux job leg for leg — see its
    # note for why the number is a prediction rather than a measurement, and
    # why it is not the ~40 the arithmetic alone would suggest.
    # 60 → 75 (the 2-way split): two fuller shards each carry more of the
    # suite, so the ceiling is raised with them. It guards a HUNG job, not a
    # runtime budget.
    timeout-minutes: 75
    env:
      # `line-tables-only`, matching every other TEST job (`test-linux`,
      # `crate-tests`, `viz-tests`): backtraces keep file:line while rustc emits
      # a fraction of the debuginfo and the linker reads a fraction of the input.
      # This was the only test job still on the full-debug default; it also puts
      # the folded viz suites (E4) under the profile they ran under before.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release installer self-test
        if: matrix.shard == 0
        run: ./tools/scripts/install.sh --self-test

      # This job has NO reclaim step and, until now, no `df` anywhere —
      # on the strength of a comment in `test-linux` asserting "macOS has ample
      # disk", which nothing had measured. The four red PRs are LINUX-only for
      # disk (all four died in the wan step there; the three macOS
      # legs we read failed on unrelated timing/functional arms — netd client-retry
      # and a bag-play wall ceiling — with zero ENOSPC anywhere in their logs), so
      # this is deliberately NOT a blanket reclaim: it MEASURES first and reclaims
      # only if the volume is genuinely tight, and a healthy runner therefore pays
      # nothing but a `df`. The one tree it will delete is the Android SDK (~11 G,
      # nothing in this workflow touches it, and it deletes in seconds). Xcode is
      # deliberately left alone: deleting it costs minutes, and this job already
      # runs 42-52 min against a 55-min ceiling (the timeout half of the same problem), so trading
      # a disk failure for a timeout-cancel is no fix at all.
      # `|| true` on the reads: this step is a DIAGNOSTIC, and the job's shell is
      # `bash -e`, so an unreadable `df` must not be the thing that reds the run.
      # An unparseable figure simply skips the reclaim (verified on real BSD `df`:
      # empty and non-numeric both fall through the guard, exit 0).
      - name: Report free disk (reclaim only if tight)
        run: |
          df -h / || true
          avail=$(df -g / | awk 'NR==2 {print $4}') || true
          echo "free on /: ${avail:-unknown} GiB (reclaim threshold: 30 GiB)"
          if [ -n "$avail" ] && [ "$avail" -lt 30 ] 2>/dev/null; then
            echo "tight: reclaiming the Android SDK"
            sudo rm -rf "${ANDROID_HOME:-$HOME/Library/Android/sdk}" \
                        "${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}" || true
            df -h /
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # ONE SAVER, CHOSEN RATHER THAN RACED. Both legs of this matrix share
      # `cargo-${{ runner.os }}-<lockhash>`, and `actions/cache` RESERVES a key
      # at save time: whichever leg finishes first wins, the other uploads a
      # multi-gigabyte archive that is then rejected ("another job may be
      # creating this cache"), and the archive that lands is whichever leg's
      # `target/` happened to be newest — arbitrary, and different run to run.
      # Shard 0 saves; shard 1 restores only. (This job runs two shards; the
      # Linux twin above runs four, and its copy of this block says "four".)
      #
      # NOT a per-shard key, deliberately: `target/` for this workspace runs to
      # several GB, GitHub evicts a repository's caches against a 10 GB total,
      # and four archives per OS per lockfile would have the shards evicting
      # each other AND every other job's namespace. One archive, one writer.
      #
      # WHICH leg writes is a FIXED PICK, not a measured optimum, and shard 0
      # is a defensible one rather than the best one. It carries `--lib` and
      # the doctests, so it builds the `cerulion_core` rlib every other leg
      # also needs — its `target/` is never a strict subset of a bare leg's.
      # That is the whole claim.
      #
      # It is explicitly NOT the deepest tree, and a maintainer weighing the
      # "move the cache save off shard 0" lever named in the package-map table
      # should not read it as one. MEASURED against the map below: shard 1's
      # package tree is a strict SUPERSET of shard 0's (`cerulion_cli` depends
      # on `cli_engine`, `bagd`, `bag`, `cli_tui` and `dds`), and shard 3's
      # union is the largest of the four because it alone compiles the ~390-crate
      # iroh tree. If cache CONTENT ever becomes the deciding factor, shard 3
      # is the leg to measure — but note it would then also be paying the save
      # tail on top of the wan step's disk pressure. (`rmw_cerulion` rides shard 2;
      # if the package map moves again, re-derive this rather than trusting it.)
      # (On Linux `lint` normally reserves this key first and every save here is
      # skipped as an exact hit; there is no `lint` leg on macOS, which is where
      # the race actually bit.)
      - name: Cache cargo (shard 0 is the saver)
        if: matrix.shard == 0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore cargo (shard 1, no save)
        if: matrix.shard != 0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Build the cdylib test fixtures (loaded via libloading at runtime, so
      # cargo doesn't treat them as deps of the test crates). `--workspace`
      # builds every fixture — drift-proof, unlike the prior enumerated `-p`
      # list (which had gone stale: a deleted crate + two missing ones). Same
      # spirit as the default-cover test model below.
      - name: Build test cdylibs
        run: cargo build --workspace

      - name: Install cargo-nextest
        run: ./tools/scripts/install_nextest.sh

      # ---------------------------------------------------------------
      # THE SHARD. `tools/scripts/ci_test_shard.sh` enumerates
      # `cerulion_core/tests/*.rs` at depth 1, sorts, and takes every file
      # whose position is `index mod count` — GENERATED, never hand-listed,
      # because a hand list is the failure mode this workflow has paid for
      # four times (a package or file named in no step). `--lib` rides shard 0.
      #
      # `--check` proves the partition is total and disjoint; it is driven from
      # `cerulion_cli_engine/tests/ci_test_coverage_test.rs` so a broken split
      # is a local red, not something you learn from a green CI run that
      # quietly ran 178 of 237 files.
      #
      # NOT SERIAL ANY MORE — see the twin step in `test-linux` for why, and
      # `.config/nextest.toml` for the fence that replaces `--test-threads=1`.
      #
      # TWO shards here, not `test-linux`'s four. The macOS count is pinned to
      # the `shard:` matrix above by
      # the_ci_shard_matrix_agrees_with_the_shard_count_argument in
      # `cerulion_cli_engine/tests/ci_test_coverage_test.rs`, which walks every
      # job a pull request can fail and this job is one of them.
      # `--check cerulion_core 2` proves the partition
      # (131 + 130 files, `PINNED_SHARD % 2 == 0` so the trybuild tail lands
      # on shard 0, which is why shard 0 gets the lighter package set below).
      # ---------------------------------------------------------------
      - name: cerulion_core tests (shard ${{ matrix.shard }} of 2, nextest)
        run: ./tools/scripts/ci_test_shard.sh cerulion_core ${{ matrix.shard }} 2

      # cerulion_core's DOCTESTS — still `cargo test`, because NEXTEST DOES NOT
      # RUN DOCTESTS AT ALL (upstream limitation, not a configuration choice).
      # Dropping this step while moving the suite to nextest would silently
      # retire cerulion_core's 15 doctests, four `compile_fail` pins among them
      # (`DataOnlySubscriber` must be structurally un-attachable to a WaitSet;
      # three `state` misuse pins) — which is exactly the "ran in no job" class
      # this step was added to close. The shard step carries a target filter,
      # which excludes doctests either way. Measured 0.70 s against an
      # already-built rlib. Shard 0 for the same reason `--lib` does: it has to
      # happen exactly once.
      - name: cerulion_core doctests
        if: matrix.shard == 0
        run: cargo test -p cerulion_core --doc

      # Shard assignment is macOS's OWN 2-way tilt (it no longer mirrors
      # `test-linux`'s 4-way table): shard 0 = installer self-test, `--lib` +
      # doctests, rmw, native_ros2_messages, bag, bagd (serial), macros,
      # discovery, CLI engine; shard 1 = CLI binary, CLI TUI, wireclient,
      # connectd, netd-wan, the folded viz suites. Every `run:` line is
      # byte-identical to before, so both nightly mirrors still cover the job.
      # Touches the iceoryx2 singleton — serial.
      - name: rmw_cerulion tests (serial)
        if: matrix.shard == 0
        # The runner has no ROS: a build that silently fell back to (or
        # away from) the vendored bindings could not otherwise be told —
        # every claim test is a disjunction over both sources.
        env:
          CERULION_RMW_EXPECT_BINDINGS: vendored
        run: cargo test -p rmw_cerulion -- --test-threads=1

      - name: native_ros2_messages tests
        if: matrix.shard == 0
        run: cargo test -p native_ros2_messages

      # See the Linux job's note — neither bag crate was in ANY job's
      # `-p` list, so both suites compiled and never ran. bagd is serial for the
      # process-global panic hook, not for iceoryx2.
      - name: cerulion_bag tests
        if: matrix.shard == 0
        run: cargo test -p cerulion_bag
      - name: cerulion_bagd tests (serial, process-global panic hook)
        if: matrix.shard == 0
        run: cargo test -p cerulion_bagd -- --test-threads=1

      # cerulion_macros is a proc-macro crate compiled into the host
      # toolchain — its own unit tests (parse + determinism) are NOT
      # exercised transitively by `-p cerulion_core`, so name it explicitly.
      - name: cerulion_macros tests
        if: matrix.shard == 0
        run: cargo test -p cerulion_macros

      # `cli_engine` and `cli` are split (as on `test-linux`); here
      # the engine rides shard 0 and the binary + TUI ride shard 1, offsetting
      # bagd staying serial on shard 0.
      - name: CLI engine tests
        if: matrix.shard == 0
        run: cargo test -p cerulion_cli_engine
      - name: CLI binary tests
        if: matrix.shard == 1
        run: cargo test -p cerulion_cli
      - name: CLI TUI tests
        if: matrix.shard == 1
        run: cargo test -p cerulion_cli_tui

      # `cerulion_discovery` — the LAN peer-discovery substrate extracted
      # from `cerulion_cli_engine` (the peers.json format+reader, the discovered-peer
      # types, the bounded TCP pre-filter, the pure connect-set planner) so
      # `cerulion-netd` can fold cached peers into its session without a cyclic edge.
      # These jobs enumerate packages EXPLICITLY (no blanket `cargo test --workspace`),
      # so an extraction silently un-runs every test that moved unless the new package
      # is named here. Same reason as the wireclient/connectd
      # steps below. Leaf crate (std + serde + dirs + tracing) — ~3 s, no transport.
      - name: cerulion_discovery tests
        if: matrix.shard == 0
        run: cargo test -p cerulion_discovery

      # The test jobs enumerate packages explicitly: there is NO blanket
      # `cargo test --workspace` step (it would hang on iceoryx2's SHM singleton). So
      # cerulion_wireclient — a workspace member excluded from default-members because
      # it pulls the iroh tree — needs its own `-p` step to run its extracted
      # config/protocol oracle tests. (A `--workspace` invocation WOULD cover it —
      # `--workspace` overrides default-members — but we run no such step for tests.)
      # The iroh tree it compiles is shared with the connectd + netd steps below.
      - name: cerulion_wireclient tests
        if: matrix.shard == 1
        run: cargo test -p cerulion_wireclient

      # cerulion_connectd is a workspace member excluded from
      # default-members (it pulls the iroh tree), so — like wireclient above — it needs
      # its own explicit `-p` step. This CLOSES the reader-coverage gap the extraction
      # inherited: connectd's reinject_e2e drives cerulion_wireclient's
      # `run_topic_reader` (via the worker re-export) — the ONLY behavioral test of that
      # reader loop, and this is the only CI step that runs it. The tests are OS-portable
      # (loopback iroh + iceoryx2 both work on macOS), so they gate on both runners.
      - name: cerulion_connectd tests
        if: matrix.shard == 1
        run: cargo test -p cerulion_connectd

      # The wan step is where the Linux leg ran out of disk on all four of
      # the red PRs. macOS has no measured ENOSPC — see the reclaim step at the
      # top of this job — so this line exists to say whether it ever gets close.
      - name: Report free disk before the wan step
        if: matrix.shard == 1
        run: df -h / || true

      # cerulion_netd's iroh WAN plane (loopback iroh + iceoryx2). The
      # tests are OS-portable (both cerulion_link's loopback iroh and iceoryx2 work
      # on macOS — the cerulion_connectd reinject e2e this cribs runs on macOS too),
      # so it gates on both runners.
      - name: cerulion_netd tests (--features wan)
        if: matrix.shard == 1
        run: cargo test -p cerulion_netd --features wan

      # THE macOS HALF OF `viz-tests`, folded in here rather than run as two
      # more macOS jobs. The `run:` lines are VERBATIM copies of the
      # `viz-tests` steps, whose rationale (parallel vs serial, the hermetic
      # OpenH264 arms, the own-binary wiring pin) lives there.
      # `cargo build --workspace` above already builds the rerun tree and the
      # `cerulion-vizd` binary the vizd e2e spawns.
      #
      # `--no-fail-fast` carried over with them, so the two lanes stay verbatim
      # copies of each other. No step-level `timeout-minutes` here,
      # unlike the `viz-tests` lane: the number there is justified by that job's
      # measured wall, this fold has no separate measurement, and inventing one
      # for a REQUIRED check on the slower runner is the riskier error. The job
      # ceiling still bounds it.
      - name: cerulion_viz tests (whole suite, parallel)
        if: matrix.shard == 1
        run: cargo test -p cerulion_viz --no-fail-fast
      - name: cerulion_vizd tests (whole suite, serial)
        if: matrix.shard == 1
        run: cargo test -p cerulion_vizd --no-fail-fast -- --test-threads=1
      - name: go2_tf tests
        if: matrix.shard == 1
        run: cargo test -p go2_tf
      - name: cargo test -p cerulion_viz --lib openh264_fetch
        if: matrix.shard == 1
        run: cargo test -p cerulion_viz --lib openh264_fetch
      - name: cargo test -p cerulion_viz --test openh264_fetch_wiring_test
        if: matrix.shard == 1
        run: cargo test -p cerulion_viz --test openh264_fetch_wiring_test
      - name: cargo test -p cerulion_viz --test video_decode_test
        if: matrix.shard == 1
        run: cargo test -p cerulion_viz --test video_decode_test -- --test-threads=1

  # ==========================================================================
  # The packages that ran in NO job.
  #
  # Every test step in this workflow names its packages EXPLICITLY (there is no
  # blanket `cargo test --workspace` — it deadlocks on iceoryx2's shared-memory
  # singleton), so a package is covered only if somebody remembered to add a
  # `-p` line for it. Nine did not have one, between them 744 listed tests:
  #
  #   cerulion_pairing  182   offline pairing formats, CPace PAKE, chain verify
  #   cerulion_remoted  154   the robot remote plane (wire + ops multiplexing)
  #   cerulion_accountd 121   the cloud account service (OAuth, device code, CA)
  #   cerud             111   the robot ops service (authz, receipts, log tail)
  #   cerulion_dds       94   the DDS discovery + wire-rung decision engines
  #   cerulion_link      29   the iroh dial-by-key QUIC wrapper
  #   cerulion-wire      21   the permissive standalone wire decoder
  #   cerulion_mdns      17   the `_cerulion._tcp` gateway beacon
  #   cerulion_wsd       15   the local workspace engine daemon
  #   cerulion_hygiene   10   the daemons' shared socket lifecycle (added later, same rule)
  #
  # `cargo clippy --workspace --all-targets` COMPILED all of them, so a break
  # was caught and a FAILING ASSERTION was not — the same "a pin that cannot
  # fail a PR is not a gate" class that the bag, discovery and go2_tf steps
  # each close for one package at a time. `every_package_with_
  # tests_is_named_in_a_ci_test_step` (cerulion_cli_engine/tests/ci_test_
  # coverage_test.rs) is what stops another package from going untested.
  #
  # ITS OWN JOB, not folded into `test-linux` / `test-macos`. Those two sit at
  # 60-62 min against an 80-min ceiling and have self-cancelled in every
  # ceiling era (see the notes on their `timeout-minutes`); adding four
  # crypto/iroh/web dependency trees to them buys a cancellation, not coverage.
  #
  # PARALLEL (no `--test-threads=1`) for every package, and that is a READ of
  # the tests rather than an assumption: nothing here calls
  # `TransportManager::get_or_init()`. `cerulion_remoted` is the only package
  # that builds real iceoryx2 transports at all, and its five transport files
  # mint ISOLATED per-test SHM roots via `TransportManager::init_for_test`
  # (their own headers say "parallel-safe without `#[serial]`"), which is the
  # same property that lets the `cerulion_connectd` step above run parallel.
  # `cerud` binds per-test Unix sockets under a tempdir; `cerulion_accountd`
  # binds 127.0.0.1:0; `cerulion_link` runs loopback iroh with per-test
  # identities; `cerulion_pairing` / `cerulion-wire` / `cerulion_mdns` are pure
  # (the mDNS tests are ServiceInfo oracles — no daemon is started, so no
  # multicast socket is opened on a runner that may not have one).
  #
  # BOTH PLATFORMS. Four of these ship on the DESK (`cerulion_link`,
  # `cerulion-wire`, `cerulion_pairing`, and `cerulion_mdns`'s browse peer) and
  # macOS is where the desk is, exactly as `test-macos` and `viz-tests` argue.
  # Nothing here is Linux-only: all eight were run green on macOS while writing
  # this. `fail-fast: false` so one platform's failure still reports the other.
  #
  # `cerulion_dds` runs on DEFAULT features (`jazzy` -> `live`), which is the
  # rung's functional domain; its one integration file is `#[ignore]`d
  # (it needs a live CycloneDDS peer), so what runs here is the pure decision
  # engine. The `humble` variant stays CHECK-only, as the project docs say.
  #
  # TIMEOUT 60: not measured on a runner, and deliberately generous rather than
  # tight. `cerulion_link` / `cerulion_remoted` cold-compile the ~390-crate
  # iroh tree and `cerulion_accountd` a web stack (axum/hyper/rusqlite), none of
  # which any other job in this file caches for them. A cold-cache timeout is
  # self-sustaining (the job dies before `actions/cache` can save), so the
  # headroom is taken BEFORE the first red run. Recorded as an open item: tune
  # it down once two or three green runs have put a real number on it.
  # ==========================================================================
  crate-tests:
    name: Crate tests (${{ matrix.os }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # Both legs on every event: the job's `name:` interpolates `matrix.os`,
        # so each leg renders its own required check name.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # `line-tables-only`, matching the other TEST jobs: backtraces keep
      # file:line (what makes a red run diagnosable) while the target dir stays
      # a fraction of a full-debug build.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The leak guard's hook installer is written to bash 3.2 because a
      # contributor's macOS system bash is the one it will actually run
      # under, and a 3.2 interpreter exists only on a macOS runner. Its
      # self-test builds a scratch repository with masked global config, so
      # it touches nothing here.
      - name: Leak guard hook installer self-test (bash 3.2, macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash tools/scripts/install_hooks.sh --self-test

      # Linux-only, cribbed from `test-linux`: the iroh + web trees need link
      # headroom on the stock runner (the ENOSPC/SIGBUS class documented at
      # length in that job).
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # Own cache namespace. These packages are the iroh + web trees that the
      # `cargo-${{ runner.os }}-` archive does not carry under this job's
      # profile, and writing them into that shared archive would grow a restore
      # every other job pays for. Same argument as `viz-tests`.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-crates-${{ runner.os }}-

      # One step per package, deliberately: a single multi-`-p` invocation
      # reports one red for nine packages and makes the log hard to attribute,
      # and the coverage walk reads these lines as its evidence.
      #
      # No `--tests`/`--lib` target filter on any of them, so each package's
      # DOCTESTS run here too (7 of them across `cerulion-wire`,
      # `cerulion_link` and `cerulion_pairing`, including two `compile_fail`
      # pins that assert a misuse does NOT compile).
      - name: cerulion_pairing tests
        run: cargo test -p cerulion_pairing
      - name: cerud tests
        run: cargo test -p cerud
      - name: cerulion_remoted tests
        run: cargo test -p cerulion_remoted
      - name: cerulion_accountd tests
        run: cargo test -p cerulion_accountd
      - name: cerulion_dds tests (default features, jazzy/live)
        run: cargo test -p cerulion_dds
      - name: cerulion_link tests
        run: cargo test -p cerulion_link
      - name: cerulion-wire tests
        run: cargo test -p cerulion-wire
      - name: cerulion_mdns tests
        run: cargo test -p cerulion_mdns
      # The ONE non-`cargo test` step here, and it is load-bearing.
      # `cerulion_wsd`'s two production `--inspect-node` arms run the SHIPPED
      # binary against a real node cdylib, and a cdylib is opened with
      # `libloading` at RUNTIME — `cargo tree -p cerulion_wsd -i
      # test_node_cdylib` matches no package, so nothing `cargo test -p
      # cerulion_wsd` builds produces the artifact. Without this step the
      # fixture is simply absent on both legs. Those arms PANIC when it is
      # missing (the repo convention, `cerulion_core::testing::
      # find_fixture_cdylib`) rather than skipping, because libtest DISCARDS a
      # passing test's stderr: a skip reports `ok` and proves nothing — the
      # "a pin that cannot fail a PR is not a gate" class this job's header
      # names. Default profile and target dir, matching the `cargo test` below.
      - name: Build the cerulion_wsd --inspect-node fixture cdylib
        run: cargo build -p test_node_cdylib
      - name: cerulion_wsd tests
        run: cargo test -p cerulion_wsd
      - name: cerulion_hygiene tests
        run: cargo test -p cerulion_hygiene
      # The umbrella crate's test is not a unit test: it writes a bin crate
      # into a temporary directory OUTSIDE this workspace, whose only
      # dependency is the umbrella, and asks cargo to check it. That is the
      # only way to exercise the claim `cargo add cerulion` makes, because
      # every package inside this workspace also names the runtime crate
      # directly. It runs here rather than in a test shard because it drives
      # cargo itself, and this job's cache namespace is the one that carries
      # its dependency closure. The doctests in the same package run with it.
      - name: cerulion umbrella tests
        env:
          # The scratch project's artifacts live outside `target/`, which this
          # job caches. They are about 1.6 GB and belong to a package set
          # nothing else here builds, so caching them would cost every run an
          # upload and a restore to save one cold check.
          CERULION_SCRATCH_TARGET_DIR: ${{ runner.temp }}/cerulion-one-dependency-scratch
        run: cargo test -p cerulion

  # Release-mode latency threshold (Linux-only)
  #
  # Gated OFF the per-PR critical path — runs on push to main and on manual
  # workflow_dispatch only, because the release-mode build is a full recompile
  # that would gate PR merge on the slowest job, and latency thresholds on
  # shared runners are noisy enough that PR-blocking false positives outweigh
  # the signal.
  #
  # THIS JOB IS THE LATENCY REGRESSION GATE, and the only one. There is no
  # separate benchmark workflow running the same two tests, because this job
  # would be a strict superset of it on both axes —
  #   - TESTS: it runs `latency_threshold_test` and
  #     `graph_latency_test`, and additionally the release-mode `--lib` tests
  #     (cfg(not(debug_assertions))-gated) and a
  #     `cargo check --tests --release`;
  #   - TRIGGERS: this workflow is push-to-main with NO path filter, so a
  #     push outside `cerulion_core/**` that can still move latency is
  #     not skipped.
  # `--nocapture` on the two latency steps means a green run prints the
  # measured numbers — see the steps below.
  #
  # Accepted tradeoff: a PR that breaks release-only-compiled code
  # surfaces on main rather than on the PR. Use workflow_dispatch to run
  # it pre-merge when a PR touches release-gated code.
  test-latency:
    name: Latency Threshold (Linux)
    runs-on: ubuntu-latest
    # Allowlist (not `!= 'pull_request'`): a new event class has to be NAMED
    # here to reach the job, which is why the merge_group trigger on this
    # workflow does NOT start this slow release build on queued batches.
    # That is the decision, stated
    # rather than left to look like an accident — `main`'s push run is the
    # latency signal, and paying for it again per batch buys nothing.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint]
    # 10m died cold: this push-only job never gets a PR-warmed RELEASE cache,
    # and the post-netd-arc workspace's cold release build alone exceeds it
    # (cancelled at 10m03 on one merge to main, the same class as the lint
    # bump made in that change). 25m = cold release build + the test's own runtime.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      # `--nocapture` on both: these two tests PRINT their measurements
      # (`floor=… median=… p99=…`, `ratio=…x`, the per-payload user-POV table),
      # and libtest swallows that on a PASS. Without it a green run tells you
      # only that the thresholds held, never what the numbers were — so a slow
      # drift inside the threshold is invisible in the log. On a FAILURE
      # libtest prints captured stdout anyway, so this changes the green case
      # only. These flags came from the retired benchmark.yml, which carried
      # them from the start; this step is the only place that output lives now.
      - name: Latency threshold test (release mode)
        run: cargo test -p cerulion_core --test latency_threshold_test --release -- --nocapture --test-threads=1

      - name: Graph latency test (user-POV, release mode)
        run: cargo test -p cerulion_core --test graph_latency_test --release -- --nocapture --test-threads=1

      # Release-mode counterpart: `record_below_wire_header_size_silent_fallback_in_release`
      # in `cerulion_core::transport::adaptive_sizer::tests` is `cfg(not(debug_assertions))`-gated
      # and only compiles + runs under `--release`. Without this step the test would
      # silently never execute (bit-rot bait). Also catches any accidental
      # `unused_imports`-via-cfg-gating regression in the `cerulion_core` lib's
      # `cfg(test)` blocks under release builds.
      - name: Lib tests (release mode)
        run: cargo test -p cerulion_core --lib --release -- --test-threads=1

      # THE RELEASE-ONLY FILES NOTHING ELSE COMPILES.
      #
      # Some `cerulion_core/tests` files are `#![cfg(not(debug_assertions))]`:
      # `period_decompose_bench_test.rs` and `streaming_latency_bench_test.rs` at
      # the time of writing. Be precise about
      # how they are routed, because the obvious wording is wrong: the DEBUG
      # shard steps DO name them — `ci_test_shard.sh` enumerates every depth-1
      # `tests/*.rs` and passes each through `--test`, so each of these gets a
      # debug target built every run. But the cfg gate empties the file in debug,
      # so that target contains zero tests AND its body is never type-checked;
      # and no RELEASE step names them (the release steps above name specific
      # `--test` targets, none of these). Without the guard below, then, they are
      # not merely un-RUN: nothing ever type-checks the code inside them, and a
      # cerulion_core API change can rot both with every job green. That is
      # the same "compiled but never executed" family found in eight
      # packages, one step further along. The list is DOCUMENTATION, not the
      # gate — `--tests` below covers whatever set exists — so do not trust it as
      # a count.
      #
      # `check`, not `test`: both are measurement sweeps, so RUNNING them would
      # add wall time for no
      # verdict. Compiling them is the whole ask. `--tests` is DEFAULT-COVER —
      # a release-only file added tomorrow is checked with no edit here — and
      # it shares this job's release cache, so the marginal cost is small.
      #
      # WHETHER THOSE FILES SHOULD EXIST — yes. BOTH of the files named above carry a
      # measurement nothing else makes, so both stay, and each carries a
      # `# Status:` header saying so — that it is executed by nothing and that
      # THIS guard is the only thing compiling it.
      #
      # `period_decompose_bench_test` is the only per-hop split on a
      # PERIOD-driven graph — the moat graph's own topology — and nothing under
      # `benches/` splits an RTT per hop at all (no `seg1`/`seg2` in that tree).
      # `streaming_latency_bench_test` is the only spin-ON vs spin-OFF A/B on a
      # graph whose live loop genuinely idles, which is the only workload where
      # the spin can show a number (no `CERULION_LIVE_SPIN_US`/`spin_budget`
      # under `benches/` either).
      #
      # This guard stays: it is what keeps both of them compiling.
      - name: Type-check every test target in release mode (rot guard)
        run: cargo check -p cerulion_core --tests --release

  # CLI end-to-end graph latency (closest-to-real-user path, BOTH platforms)
  #
  # This is the most faithful end-to-end measurement we have: it drives the
  # real user journey — CLI scaffolds a workspace, `cerulion node build
  # --release` compiles the node crates into RELEASE cdylibs, `cerulion graph
  # run --release` launches the graph as a binary subprocess, and the test
  # measures round-trip latency against that live process. It exercises BOTH
  # real-clock and virtual-clock modes and is watchdog-bounded so a hung
  # subprocess can't wedge CI.
  #
  # Runs in RELEASE (`--test ... --release`): production-latency numbers only
  # make sense in release (debug is 10-50x slower), and the test module is
  # `#![cfg(not(debug_assertions))]`-gated so it would compile to a no-op
  # without `--release` anyway. Mirrors `graph_latency_test` / the
  # `test-latency` job.
  #
  # Gated push-to-main on BOTH platforms because it's slow (it builds the
  # `cerulion` binary + 3 cdylibs + a fresh cerulion_core in a tempdir, all
  # in release, several minutes per platform). It complements the in-process
  # `graph_latency_test` in the Linux-only `test-latency` job — this dedicated
  # matrix job is what gives the CLI-driven path its macOS coverage.
  cli-e2e-latency:
    name: CLI E2E Graph Latency
    # Allowlist (not `!= 'pull_request'`), same as `test-latency` and for the
    # same reason it just proved out: merge_group was added to this workflow
    # and this slow full-binary e2e build did NOT start running on queued
    # batches, because a new event class has to be NAMED here to reach the job.
    # Deliberate: `main`'s push run is the signal, and this is also the macOS
    # leg, which is the expensive half.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Generous: the cold cerulion_core release compile in the fresh tempdir dominates
    # (~11 min on a cache miss) and the test itself is ~17 min, so the ubuntu leg has
    # run 26-29 min for weeks; 30 cancelled a GREEN run on main (the test had already
    # passed). 45 restores the headroom; cutting the in-job build is a separate issue.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The fresh-tempdir cerulion_core build is large; reclaim the unused
      # preinstalled toolchains (~25 GB) on Linux before building. macOS
      # runners have more disk, so skip it there.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Release-mode job: use the `cargo-release-` namespace (like
          # test-latency) so it never shares a cache with the debug-profile
          # test-linux/test-macos jobs — a debug restore would force a full
          # release rebuild and risk tripping the 30-min timeout.
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      # The test itself runs `cargo build -p cerulion_cli --release` + builds
      # the node cdylibs internally (also release), so NO separate build step
      # is needed. It also pins the scaffolded workspace's iceoryx2 to the
      # repo Cargo.lock (avoids the 0.9.1/0.9.2 version-skew that breaks SHM
      # event connections).
      - name: CLI E2E graph latency test (release, serial)
        run: cargo test -p cerulion_core --test cli_e2e_graph_latency_test --release -- --test-threads=1 --nocapture

  # Fuzz testing (Linux-only, nightly toolchain)
  fuzz:
    name: Fuzz (Linux)
    runs-on: ubuntu-latest
    # CI cost policy: push and workflow_dispatch only — these six were ~1/3 of hosted Linux minutes on every PR push; breakage is caught on the merge to main.
    # merge_group is excluded with pull_request: `main`'s push run is still the
    # control, so doing this work in the queue too would pay for it twice.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: [lint]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Nightly pin: see PINNED_NIGHTLY in the top-level env block.
      - name: Install nightly toolchain (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.PINNED_NIGHTLY }}

      # Cache restore must precede the cargo-fuzz install so a warm
      # ~/.cargo/bin/cargo-fuzz skips the from-source compile entirely.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            target
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz (skipped when cache-restored)
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      - name: Fuzz wire header (30s)
        run: cd crates/cerulion_core && cargo +${{ env.PINNED_NIGHTLY }} fuzz run fuzz_wire_header -- -max_total_time=30

      - name: Fuzz parse graph (30s)
        run: cd crates/cerulion_core && cargo +${{ env.PINNED_NIGHTLY }} fuzz run fuzz_parse_graph -- -max_total_time=30

      - name: Fuzz parse info JSON (30s)
        run: cd crates/cerulion_core && cargo +${{ env.PINNED_NIGHTLY }} fuzz run fuzz_parse_info_json -- -max_total_time=30

  # Miri: interpret unsafe-code paths under the nightly Miri UB checker.
  #
  # Scope rationale — Miri cannot execute foreign functions or map shared
  # memory, so anything that touches iceoryx2 (transport, graph runtime,
  # history, e2e) is out. The scoped targets below were chosen by reading
  # their imports and confirming they never construct transport objects:
  #
  #   - wire_test                exercises the `unsafe` byte-level header
  #                              parse/write in src/wire.rs (2 unsafe
  #                              sites) — the prime Miri target.
  #   - codegen_test             pure schema parsing + string codegen;
  #                              reads .msg fixture files from disk
  #                              (hence -Zmiri-disable-isolation).
  #   - max_slice_len_newtype_test  pure MaxSliceLen boundary logic over
  #                              wire types; no IO, no transport.
  #
  # Deliberately excluded:
  #   - `--lib` unit tests: src/iceoryx_logger.rs tests call into
  #     iceoryx2's logging facade and src/transport/* test modules sit
  #     next to FFI-adjacent code — not provably Miri-clean.
  #   - everything in the serial iceoryx2 list (the Testing Patterns
  #     section of the project docs): shared-memory FFI, Miri cannot run it.
  #
  # PROPTEST_CASES=8: wire_test's proptest block defaults to 256 cases
  # per property; under Miri's interpreter that is needlessly slow. 8
  # cases per run still accumulates coverage across CI runs (fresh RNG
  # seed each run).
  #
  # This job is BLOCKING (no continue-on-error). It was promoted
  # from the original non-blocking stopgap after being observed green on
  # 12+ consecutive CI runs across main + PRs (the FFI-free scope on the
  # PINNED_NIGHTLY is stable). If a future nightly / iceoryx2 bump breaks
  # Miri, fix or re-pin rather than silently reverting to non-blocking.
  miri:
    name: Miri (Linux, scoped to FFI-free tests)
    runs-on: ubuntu-latest
    # CI cost policy: push and workflow_dispatch only — these six were ~1/3 of hosted Linux minutes on every PR push; breakage is caught on the merge to main.
    # merge_group is excluded with pull_request: `main`'s push run is still the
    # control, so doing this work in the queue too would pay for it twice.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: [lint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same pin as the fuzz job: see PINNED_NIGHTLY in the top-level env
      # block. The pinned nightly ships miri+rust-src (verified locally).
      - name: Install nightly toolchain with Miri (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.PINNED_NIGHTLY }}
          components: miri, rust-src

      # target/ holds the Miri-interpreted dep builds and ~/.cache/miri
      # holds the Miri sysroot — without both, every run recompiles the
      # entire dependency tree under the (slow) interpreter from scratch.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/miri
            target
          key: cargo-miri-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-miri-${{ runner.os }}-

      - name: Miri setup (download std sources)
        run: cargo miri setup

      - name: Miri (wire format, codegen, MaxSliceLen; FFI-free)
        env:
          # codegen_test reads .msg fixtures from disk; proptest persists
          # regression seeds on failure. Both need the isolation gate off.
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 8
        run: >
          cargo miri test -p cerulion_core
          --test wire_test
          --test codegen_test
          --test max_slice_len_newtype_test

  # Documentation check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [lint]
    # 30, and the number follows the MACHINE rather than the job. On a 4-core
    # runner the healthy build ran 8m56s-9m18s and 15 was ample; on a 2-core one
    # `cargo doc --workspace` takes about twice that, and 15 became a coin flip:
    # MEASURED in the reviewed runs, one job CANCELLED at the 15 min budget, a
    # second CANCELLED the same way, and a third PASSING at 13.7 min. Two
    # cancellations in three runs is not a flaky job, it is a budget set for
    # different hardware.
    #
    # 30 is ~2x the slower measured wall, the same ratio 15 gave the faster
    # machine, and it guards a HUNG job rather than rationing a healthy one,
    # the rule this file applies everywhere else. It is not a required context,
    # so the cancellations blocked nothing; they just meant the docs gate
    # silently stopped gating two runs out of three.
    timeout-minutes: 30
    env:
      # Same ENOSPC class as the lint job (see its comment): rustdoc's dep
      # builds don't need debuginfo either, and this job restores the same
      # ever-growing target cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # `wan` went DEFAULT-ON, so the workspace `lint` clippy + the
  # `docs` job now ALSO compile netd's iroh tree via feature unification — this
  # dedicated job is now belt-and-suspenders (its explicit `--features wan`
  # invocations are redundant-but-harmless) PLUS the lean-variant rot-guard: it lints
  # the `--no-default-features` (zenoh-only) build so the opt-out path keeps
  # compiling. It still compiles the iroh tree COLD on its own budget, keeping the
  # explicit-feature + lean-variant analysis OFF the tight `lint`/`docs` gates. Pure
  # analysis (clippy + doc), so no debuginfo. It gates NO other job.
  netd-wan:
    name: netd WAN (clippy + docs, --features wan)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reclaim preinstalled SDK bloat (crib test-linux) so the iroh tree has disk
      # headroom on the stock runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Clippy (cerulion_netd --features wan)
        run: cargo clippy -p cerulion_netd --features wan --all-targets -- -D warnings

      # `wan` is default-ON, so the lean zenoh-only opt-out
      # (`--no-default-features`, the `GatewayMirrorPlane` LAN path the CLI + vizd
      # NetdClient consumers select) is no longer the default build. Lint it here so
      # the opt-out path cannot rot silently (a wan-only import leaking outside a
      # `#[cfg(feature = "wan")]` guard would fail exactly this step).
      - name: Clippy (cerulion_netd --no-default-features, lean rot-guard)
        run: cargo clippy -p cerulion_netd --no-default-features --all-targets -- -D warnings

      - name: Docs (cerulion_netd --features wan)
        run: cargo doc -p cerulion_netd --features wan --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The iroh-leanness invariant guard. `cerulion_netd`'s `wan`
  # feature (→ the ~390-crate iroh tree) is default-ON, so netd is EXCLUDED from
  # `default-members` (root Cargo.toml). Otherwise cargo's per-package feature
  # unification would turn `wan` ON for the ONE shared netd rlib the CLI + vizd link
  # and drag iroh into every plain `cargo build` despite their `default-features =
  # false` edges. This job PINS both halves with `cargo tree` (resolve-only, no
  # compile — seconds): (a) the default-members graph has NO iroh reverse-tree (the
  # CLI + vizd stay iroh-free); (b) the per-package `cerulion_netd` DOES pull iroh
  # (the shipped daemon ships the WAN plane by default). A future edit that re-adds
  # netd to default-members, drops a consumer's `default-features = false`, or flips
  # `wan` off would fail EXACTLY here. Runs in PARALLEL, gates nothing.
  iroh-leanness:
    name: Iroh leanness (default build stays iroh-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # Only registry/git metadata is needed (cargo tree resolves, never compiles).
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-iroh-leanness-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-iroh-leanness-

      - name: Assert default build is iroh-free and shipped netd includes wan
        run: |
          set -uo pipefail
          # (a) The CLI + vizd default build (default-members resolution) must
          #     contain NO iroh reverse-tree. `cargo tree -i iroh` errors (nonzero,
          #     on stderr) when iroh is absent from the graph — the HEALTHY case — so
          #     hide stderr and treat any STDOUT as a violation.
          #     The probe covers the WHOLE FAMILY, not the umbrella name alone:
          #     dependency direction runs umbrella -> subcrate, so a crate that
          #     depends directly on `iroh-base` pulls the tree while `iroh`
          #     itself never enters the graph and an `-i iroh` probe stays green.
          #     The family is DERIVED from Cargo.lock, so a new subcrate in a
          #     future iroh release is covered with no edit here.
          iroh_family=$(grep '^name = "' Cargo.lock | sed 's/^name = "//; s/"$//' \
            | grep -E '^iroh($|-|_)' | sort -u)
          if [ -z "$iroh_family" ]; then
            echo "INVARIANT UNVERIFIABLE: no iroh-family package found in Cargo.lock."
            echo "The probe derives its family from the lockfile; an empty family would pass vacuously."
            exit 1
          fi
          iroh_violation=0
          for pkg in $iroh_family; do
            if cargo tree -e normal -i "$pkg" 2>/dev/null | grep -q .; then
              echo "INVARIANT VIOLATED: $pkg is in the default-members dependency graph."
              cargo tree -e normal -i "$pkg" || true
              iroh_violation=1
            fi
          done
          if [ "$iroh_violation" -ne 0 ]; then
            echo "The CLI + vizd default build must stay iroh-free: keep cerulion_netd OUT of default-members."
            exit 1
          fi
          # (b) The shipped per-package netd MUST pull iroh (wan default-on).
          if ! cargo tree -p cerulion_netd -e normal | grep -qi iroh; then
            echo "INVARIANT VIOLATED: cerulion_netd (per-package) no longer pulls iroh."
            echo "The shipped netd daemon must include the iroh WAN plane (wan default-on)."
            exit 1
          fi
          echo "OK: default build is iroh-free; shipped netd includes the iroh WAN plane."

  # L15 (NO viz/rerun on the ROBOT): the rerun-leanness
  # invariant guard, the `rerun` sibling of `iroh-leanness` above. Rerun is the
  # DESK-side rasterizer: the robot ships RAW frames, `cerulion-netd` mirrors a
  # demanded topic into desk-local SHM, and `cerulion-vizd` decodes + renders on
  # the USER's machine. The graph-embedded `rerun_sink` cdylib was deleted
  # and `ros2 attach` stopped staging any viz node, but the decision had NO
  # standing guard — and an audit found a live violation it would have caught:
  # `examples/go2/nodes/go2_tf_source` (a crate that ships to the robot) carried
  # `cerulion_viz` + `rerun` DEV-dependencies to host a viz e2e, dragging the
  # Rerun SDK and its MSRV floor onto the robot side. L15 moved that e2e to the
  # desk crate; this job keeps it from coming back, in EITHER workspace.
  #
  # Three probes (resolve-only, no compile — seconds):
  #   (a) root `default-members` has NO rerun reverse-tree (the CLI stays
  #       rerun-free; viz enters only via `-p cerulion_viz` / `--workspace`);
  #   (b) the ISOLATED `examples/go2` workspace has none under `-e normal,dev`
  #       either — dev-deps count, because that is exactly how the violation
  #       arrived;
  #   (c) THREE POSITIVE CONTROLS, each naming the failure it catches: the desk
  #       viz lib DOES pull rerun (probe (a) not vacuous); the examples/go2 probe
  #       DOES find a normal-edge package (not wrong-cwd); and it DOES traverse
  #       DEV edges (`tempfile`) — without that last one, narrowing (b) to
  #       `-e normal` would leave every check green while re-opening the hole.
  # Runs in PARALLEL, gates nothing.
  rerun-leanness:
    name: Rerun leanness (robot + default build stay rerun-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # Only registry/git metadata is needed (cargo tree resolves, never
      # compiles). `~/.cargo/git` matters here: examples/go2 patches in the rustdds
      # fork by git, so resolving that workspace fetches it.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rerun-leanness-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rerun-leanness-

      - name: Assert the robot and the default build stay rerun-free
        run: |
          set -uo pipefail

          # READ THIS BEFORE EDITING THE PROBES.
          #
          # `cargo tree -i <pkg>` exits NONZERO ("package ID specification
          # `rerun` did not match any packages", on stderr) when the package is
          # absent from the selected resolve graph. Absent IS the healthy case
          # here, so the verdict is taken from STDOUT (empty = clean), never
          # from the exit code — hence `2>/dev/null` + `grep -q .`, exactly as
          # the iroh job does.
          #
          # That inversion is also the job's main hazard: a BROKEN manifest, a
          # bad lockfile, or a registry failure makes `cargo tree` produce no
          # stdout too, and would read as "rerun absent, all green" forever. So
          # each workspace is first proven to RESOLVE AT ALL with the same
          # command family, and the THREE positive controls at the end prove the
          # `-i` probes can still FIND something — including through a DEV edge,
          # the one flag component this job exists for. An always-green guard is
          # worse than no guard.
          #
          # NB a package that IS in the lockfile but not reachable under the
          # selected `-e` set (e.g. `tempfile` under `-e normal`) exits ZERO with
          # "nothing to print" on stderr and EMPTY stdout — a different signature
          # from the absent-package 101. Reading stdout handles both uniformly.

          echo "::group::resolve sanity"
          cargo tree -e normal --depth 0 > /dev/null
          (cd examples/go2 && cargo tree -e normal,dev --depth 0 > /dev/null)
          echo "both workspaces resolve"
          echo "::endgroup::"

          # The probes below cover the WHOLE FAMILY, not the umbrella `rerun`
          # alone. Dependency direction runs umbrella -> subcrate, so a crate
          # depending directly on `re_chunk` or `re_log_types` pulls the tree
          # while `rerun` itself never enters the graph and an `-i rerun` probe
          # stays green. That is not exotic: `cerulion_vizd` names SEVEN `re_*`
          # crates directly, so the subcrate spelling is the norm. Each family is
          # DERIVED from the workspace's own lockfile, so a new subcrate in a
          # future Rerun release is covered with no edit here.
          rerun_family_of() {
            grep '^name = "' "$1" | sed 's/^name = "//; s/"$//' \
              | grep -E '^(rerun|re_)' | sort -u
          }

          # (a) The default build (default-members resolution) must be rerun-free.
          root_family=$(rerun_family_of Cargo.lock)
          if [ -z "$root_family" ]; then
            echo "INVARIANT UNVERIFIABLE: no rerun-family package found in Cargo.lock."
            echo "The probe derives its family from the lockfile; an empty family would pass vacuously."
            exit 1
          fi
          rerun_violation=0
          for pkg in $root_family; do
            if cargo tree -e normal -i "$pkg" 2>/dev/null | grep -q .; then
              echo "INVARIANT VIOLATED: $pkg is in the default-members dependency graph."
              cargo tree -e normal -i "$pkg" || true
              rerun_violation=1
            fi
          done
          if [ "$rerun_violation" -ne 0 ]; then
            echo "A plain 'cargo build' must stay rerun-free: keep the cerulion_viz/* crates OUT of default-members."
            exit 1
          fi

          # (b) The ROBOT demo workspace must be rerun-free including DEV-deps.
          #     No family floor here: examples/go2 is EXPECTED to carry no
          #     rerun-family package at all, so an empty family is the healthy
          #     answer and the loop correctly probes nothing. The resolve-sanity
          #     check above is what proves that workspace resolves at all.
          go2_violation=0
          for pkg in $(rerun_family_of examples/go2/Cargo.lock); do
            if (cd examples/go2 && cargo tree -e normal,dev -i "$pkg" 2>/dev/null) | grep -q .; then
              echo "INVARIANT VIOLATED: a examples/go2 crate pulls $pkg (project rule: no viz or rerun on the robot)."
              (cd examples/go2 && cargo tree -e normal,dev -i "$pkg") || true
              go2_violation=1
            fi
          done
          if [ "$go2_violation" -ne 0 ]; then
            echo "The offending edge is printed above. Robot crates ship RAW frames; rasterization is desk-side."
            echo "If this is a TEST that needs the viz stack, put the test in cerulion_viz/lib/cerulion_viz/tests/"
            echo "and dev-depend on the robot crate from there (see tf_source_e2e_test.rs), not the other way round."
            exit 1
          fi

          # ── POSITIVE CONTROLS. Each names the failure it catches; a control
          #    that catches nothing is decoration. All three must find something.

          # (c1) Kills "probe (a) is vacuous": the DESK viz lib really does pull
          #      rerun, so an `-i rerun` probe CAN produce output in this repo.
          if ! cargo tree -p cerulion_viz -e normal -i rerun 2>/dev/null | grep -q .; then
            echo "PROBE BROKEN: cerulion_viz (per-package) no longer pulls rerun."
            echo "Either the desk viz stack lost its rerun edge, or this job's probe is no longer probing anything."
            exit 1
          fi

          # (c2) Kills WRONG-CWD / mistyped-`-i`: the same invocation shape, in
          #      the examples/go2 workspace, finds a package that IS there.
          #      Deliberately a NORMAL-edge package — it does NOT test the `dev`
          #      half (go2_tf is a plain dependency of dds_bridge AND
          #      go2_tf_source, so this arm survives dropping `,dev`). That is
          #      (c3)'s job.
          if ! (cd examples/go2 && cargo tree -e normal,dev -i go2_tf 2>/dev/null) | grep -q .; then
            echo "PROBE BROKEN: the examples/go2 reverse-tree probe found no go2_tf edge."
            echo "go2_tf is a real dependency of the demo's producer nodes: probe (b) is not probing anything."
            exit 1
          fi

          # (c3) Kills DROPPING `,dev` FROM PROBE (b) — the single flag component
          #      this job exists for ("dev-deps count, because that is exactly
          #      how the violation arrived"). `tempfile` is a dds_bridge
          #      DEV-dependency and reachable ONLY through a dev edge, so it is
          #      EMPTY under `-e normal` and NON-EMPTY under `-e normal,dev`.
          #      Without this arm, a future edit narrowing (b) to `-e normal`
          #      would keep every other check green while silently re-opening
          #      the exact hole L15 closed.
          #      (Verified NOT substitutable by `pnet_datalink` — that one is
          #      normal-reachable via cerulion_core → zenoh → zenoh-util.)
          if ! (cd examples/go2 && cargo tree -e normal,dev -i tempfile 2>/dev/null) | grep -q .; then
            echo "PROBE BROKEN: probe (b) no longer traverses DEV dependencies."
            echo "tempfile is a dev-only dependency of examples/go2's dds_bridge and MUST be reachable under '-e normal,dev'."
            echo "If the '-e normal,dev' in probe (b) was narrowed to '-e normal', a robot crate could take a rerun"
            echo "DEV-dependency again with this job still green: the precise regression L15 closed."
            exit 1
          fi

          # KNOWN LIMITATION (accepted): the probes are NAME-EXACT on `rerun`, so
          # a crate depending DIRECTLY on an SDK sub-crate (`re_sdk`, `re_types`,
          # …) without the `rerun` facade would not be caught.
          echo "OK: default build and examples/go2 (incl. dev-deps) are rerun-free; desk viz still pulls rerun."

  # THE viz test lanes — the whole `cerulion_viz` + `cerulion-vizd`
  # suite, on both platforms.
  #
  # DEFAULT-COVER (the same model as `test-linux`): every step below
  # names a PACKAGE, never a test file, so every viz test file that exists today
  # and every one added tomorrow runs automatically. Nothing here needs editing
  # when a test file lands — which is the property that makes this job a gate
  # rather than a hand-maintained list that silently goes stale (the exact way
  # the predecessor job left ~22 files uncovered). Any COUNT written in this
  # comment block is a measurement taken while writing the PR, for budgeting
  # only; no assertion depends on one, and three sibling PRs in flight add viz
  # test files, so treat them as as-of-this-PR snapshots rather than facts to
  # re-verify.
  #
  # WHY THIS JOB EXISTS. `cargo clippy --workspace --all-targets` (the `lint`
  # job) COMPILES every viz test target, so a compile break was always caught —
  # but no job EXECUTED a viz test binary other than the two the predecessor job
  # named, so a FAILING ASSERTION shipped green. A pin that cannot fail a PR is
  # not a gate. The live-queue file
  # declared itself a HARD GATE and ran nowhere until its own review pass
  # bolted a step onto the tf-source job for it alone, and a separate viz fix was
  # verifiable only by running the suite by hand. Everything else — the entire
  # sidebar-truth / liveness / attach surface (seven changes in a row) was
  # enforced by local discipline alone.
  #
  # This job REPLACES the narrower `viz-tf-source-e2e` job, which ran exactly two
  # named test files. Both are now subsumed by the package-wide runs below, so
  # their rationale is recorded here rather than lost:
  #
  #   * `cerulion_viz --test tf_source_e2e_test` moved out of
  #     `examples/go2/nodes/go2_tf_source` so the ROBOT crate could shed its rerun
  #     dev-deps (see `rerun-leanness` above); the move would otherwise have
  #     dropped it from CI entirely. It was run `--test-threads=1` because it
  #     builds real iceoryx2 transports and installs the PROCESS-GLOBAL Rerun
  #     stream — it is a SINGLE-`#[test]` binary, so the flag was a no-op and
  #     the parallel lane below is byte-for-byte the same run.
  #   * `cerulion_vizd --test live_backlog_test` was run
  #     `--test-threads=1` because each arm hosts a real gRPC message proxy and
  #     streams megabytes through it, so concurrent arms make the byte-occupancy
  #     oracle contend with its own siblings. The vizd lane below is serial, so
  #     that guarantee is preserved — and it is one of the reasons it is serial.
  #
  # WHY TWO LANES, ONE FLAG APART. Cargo runs test BINARIES sequentially, so the
  # cross-binary hazards (the iceoryx2 SHM singleton, the process-global Rerun
  # stream, `tracing_test`'s capture buffer) are already handled by cargo itself.
  # The only remaining hazard is WITHIN one binary, and the two packages differ
  # there — the classification was made by READING every file, not by guessing:
  #
  #   `cerulion_viz` — PARALLEL (default threads). Every file that touches real
  #     iceoryx2 (`tap_manager_test`, `tf_drain_all_test`, `tf_source_e2e_test`)
  #     uses `TransportManager::init_for_test` + `iceoryx_test_config`, i.e. an
  #     ISOLATED per-test SHM root.
  #
  #     THE LIB UNIT-TEST BINARY IS PART OF THIS LANE, and it is the one that
  #     matters most: ~314 of the lane's ~665 tests (47 %) live in
  #     `cerulion_viz`'s own `#[cfg(test)]` modules, which is also where the
  #     crate's process-globals are DEFINED — `BLUEPRINT_SENT`,
  #     `RUNTIME_BLUEPRINT` and `ATTACHED_ENTITIES_SNAPSHOT` in `blueprint.rs`,
  #     `STREAM` in `stream.rs`, the flood latches. Counting only the 23
  #     INTEGRATION files would silently understate the lane.
  #
  #     Every file that touches process-global state confines it, by one of FIVE
  #     mechanisms — enumerated because a future test that fits none of them
  #     belongs in the other lane:
  #       1. SINGLE-`#[test]` binary — `tf_drain_all_test` + `tf_source_e2e_test`
  #          (the only two callers of `stream::set_stream`, which installs the
  #          PROCESS-GLOBAL Rerun stream) and `never_block_grpc_tcp_test` (binds
  #          a TCP port).
  #       2. Its own file-local mutex — `coordinate_frame_test`'s `rerun_lock`,
  #          `sink_dispatch_test`'s `SKELETON_STATICS_LOCK`.
  #       3. The global state is unreachable from the tests that RUN —
  #          `element_cap_bench` installs a `#[global_allocator]` writing to a
  #          process-global counter, but is 5 tests of which 3 are `#[ignore]`d,
  #          and `measure_alloc` (the only thing that arms the counter) is called
  #          by exactly those 3. The 2 that run never touch it.
  #       4. The second test touches no globals — `reconnect_test` calls the
  #          process-global `stream::reset_for_test()`, and its other `#[test]`
  #          is a pure source-text walk over `worker.rs`.
  #       5. A CRATE-LEVEL `#[cfg(test)]` LOCK — the lib binary's mechanism.
  #          `blueprint.rs`'s guard test asserts an EXACT `swap` sequence on the
  #          process-global `BLUEPRINT_SENT`, and it is NOT that flag's only
  #          reacher: `ensure_setup` swaps it on the PRODUCTION path
  #          (blueprint.rs:159), `worker.rs` calls that at :679/:782/:836, and
  #          `worker.rs`'s test module spawns a `VizLogWorker` at EIGHT sites —
  #          same binary, sibling threads. Until this job existed the only thing holding
  #          those apart was libtest's dispatch ORDER, under a comment claiming
  #          "no intra-binary race"; ordering is an accident that survives until
  #          someone renames a test. All nine now take
  #          `test_support::blueprint_statics_guard()` as their FIRST statement
  #          (first ⇒ dropped LAST ⇒ still held while `VizLogWorker::drop` joins
  #          the spawned thread). A file-local mutex could not serve — the racing
  #          tests are in DIFFERENT modules of one binary. Verified 3x at default
  #          parallelism and once at `--test-threads=32`: no deadlock (production
  #          never takes the lock, so a worker thread cannot block on it).
  #     Running this lane PARALLEL is deliberate: it is the stronger gate,
  #     because it exercises the parallel-safety those files claim in their own
  #     headers.
  #
  #   `cerulion_vizd` — SERIAL (`--test-threads=1`), for three MEASURED reasons,
  #     not caution: (a) `vizd_e2e_test.rs`'s own header records a real
  #     intra-binary parallel flake (1 run in 14 at `--test-threads=16`)
  #     whose fix is a blueprint mutex that 52 of its 71 tests must remember to
  #     take — a discipline a new test can silently omit.
  #     (b) `host_test.rs` mutates PROCESS env (`$CERULION_RERUN_URL`), which is
  #     visible to every thread in the binary and is guarded only by a file-local
  #     mutex; (c) the byte-occupancy reason above. Cost is +42 s
  #     (94 s → 136 s measured locally) against the 55-minute budget.
  #
  # WHAT WIRING THIS UP HAS FOUND SO FAR. SEVEN pre-existing flakes, in code
  # nothing had ever executed, in TWO classes. Stated as a RUNNING COUNT on
  # purpose: five were found while wiring the lane, and two more surfaced on the
  # lane's own first CI runs — the total is not a fixed number anyone should
  # trust, it is the count at the time of writing. That is itself the argument
  # for the job: they keep being found because something finally runs this code,
  # and every one of them had been shipping green.
  #
  # CLASS 1 — A BUDGET TIMING THE WRONG THING (six):
  #   * two `max_enqueue < 50ms` never-block asserts whose windows held the
  #     `tracing_test` capture and a three-times-per-frame parse of the
  #     254-message schema corpus (7 failures in 15 runs under load, worst 96.3 ms);
  #   * `catalog_events_e2e` applying a deliberately-short 150 ms "expect
  #     NOTHING" drain budget to the hello HANDSHAKE (macOS, first run);
  #   * `vizd_e2e`'s `Hz ≈ 100` band, which really asserted that the RUNNER could
  #     publish at 100 Hz; a macOS runner managed 19.12 and vizd reported it
  #     faithfully;
  #   * `discover_provenance_snapshot_is_cached_within_ttl_e2e`'s 4 s
  #     `discover_until` budget, which timed CONVERGENCE to the first gather
  #     rather than the caching property under test (macOS);
  #   * `an_attached_mirror_is_attributed_to_its_robot_on_list_and_status_e2e`,
  #     which read `list` ONCE immediately after `attach` and asserted the robot
  #     attribution as if it were synchronous. It is not, by design:
  #     `attribution_snapshot` unions a CACHED `gather_mirror_provenance()` whose
  #     `PROVENANCE_CACHE_TTL` is 3 s, so a gather that misses the record is
  #     served stale for the whole TTL — a transient daemon.rs:427 itself calls
  #     "acceptable (the reported bug was a PERSISTENT mis-group)" and the sibling
  #     TTL test asserts as CORRECT. Now converge-then-assert (macOS).
  #
  # CLASS 2 — DRAIN-SHAPE SENSITIVITY (one), a genuinely different failure mode:
  #   * `schema_less_remote_attach_catalog_resolves_seeds_and_taps` published
  #     three frames and THEN drained, so its exact-value oracle depended on the
  #     probe's queue surviving an arbitrary drive/drain interleaving — a burst
  #     split across drives, or an eviction at a shallow queue, changes what the
  #     test accumulates while nothing under test is wrong. This is the
  #     drain-shape class (the project docs' test table names this very test as the one a
  #     drain-shape change was measured to break). Fixed by per-frame lockstep —
  #     at most one frame in flight — NOT by loosening the oracle.
  #
  # LINUX HERE, macOS IN `test-macos`. `cerulion-vizd` is the DESK-side daemon
  # and the desk is where it ships, so macOS coverage is not a nice-to-have —
  # the ambient daemon-race flakes were macOS-only, and the UDS / dlopen /
  # `#![cfg(unix)]` paths differ. That coverage stays: the six steps below ALSO
  # run on `test-macos` shard 1 as VERBATIM `run:` copies, and this job's own
  # matrix is ubuntu-only. `fail-fast: false` so one lane's failure still
  # reports the other's.
  #
  # `needs: [lint]` — unlike the two leanness guards above, which are
  # resolve-only (`cargo tree`, seconds) and therefore ungated, this job COMPILES
  # the rerun SDK tree (257 crates, ~7 min measured). Gating it behind `lint` costs
  # nothing on a healthy PR (the critical path is the ~hour-long `test-linux` /
  # `test-macos` jobs, which are gated too) and saves a whole runner when a
  # PR arrives with a fmt/clippy failure. NB for anyone comparing: `demos-go2`,
  # `msrv`, `examples` and `cross-aarch64-linux` also compile source and are NOT
  # gated — "every compile job is gated" is not the house rule; this one is
  # gated because it is expensive AND nothing waits on its result.
  #
  # NOT folded into `test-linux` on purpose — and the reason is the OPPOSITE
  # of comfortable: that job keeps OUTGROWING its ceiling. (The macOS half IS
  # folded, into `test-macos` shard 1, where the work is incremental on a tree
  # that job already builds.) The
  # numbers here have been re-measured twice — 45.15-53.50 min (Linux) against
  # the 55 ceiling when this job was written, then 60m33s-62m25s passing runs with
  # THREE self-cancels at 65m05-65m07s in one morning (three pull requests)
  # against the 65 ceiling, which is why the ceiling is now 80.
  #
  # The timeout-cancel is NOT hypothetical: it has fired in every ceiling era
  # (seven jobs at 55.23-55.47 min across 40 runs in the 55 era, three at ~65m
  # in one morning in the 65 era). That is verbatim the class the `test-linux`
  # timeout note documents ("any test-adding PR gets CANCELED with every suite green"). It is
  # a CI-health problem in its own right; what matters
  # HERE is that folding ~3 min of viz work into a job that keeps eating its
  # own headroom accelerates the chase, so this job stays separate and PARALLEL.
  # TWO LANES. This job cancelled at 55.27 min against its
  # own 55-min ceiling once already — the `viz-tests` era's instance of the
  # ceiling-chase documented at length above — and the two halves are
  # independent: `cerulion_viz` runs PARALLEL, `cerulion_vizd` runs SERIAL, and
  # nothing in one reads anything from the other. So they are split onto
  # separate runners by a `lane` matrix dimension rather than run back to back
  # on one.
  #
  # A matrix DIMENSION, not a second job: every lane then shares one set of
  # steps, so a step added to the suite cannot reach one lane and miss the
  # other.
  #
  # The split does NOT halve the wall: both lanes cold-compile the rerun SDK
  # tree, which is the bulk of it. What it halves is the TEST time and the LINK
  # output (the viz lane links its ~29 rerun-carrying test binaries, the vizd
  # lane its own), which is exactly the part that had been growing.
  viz-tests:
    name: Viz tests (${{ matrix.lane }}, ${{ matrix.os }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # LINUX ONLY: the macOS half of this job (both lanes, all six steps
        # below) runs as `test-macos` shard 1, so the contexts
        # `Viz tests (viz|vizd, macos-latest)` are rendered by NO job on ANY
        # event and must not be in branch protection's required list.
        os: [ubuntu-latest]
        # `viz`  — the `cerulion_viz` + `go2_tf` suites and the OpenH264 steps.
        # `vizd` — the `cerulion-vizd` daemon suite, which is the serial one.
        lane: [viz, vizd]
    runs-on: ${{ matrix.os }}
    # 55, matching `test-linux` / `test-macos` rather than the predecessor's 40.
    # That 40 was set for a Linux-only job building TWO test binaries against a
    # WARM cache; this builds 29, and while it still had a macOS leg that leg
    # was the first job in the workflow ever to
    # cold-compile the rerun tree (`lint`,
    # which compiles it via `clippy --all-targets`, is ubuntu-only). Both test
    # jobs were raised 45 → 55 for exactly that reason on the iroh tree. A
    # cold-cache timeout is self-sustaining — the job dies before `actions/cache`
    # can save — so the headroom is taken BEFORE the first red run, not after.
    # 55 -> 70: 55 FIRED, at 55.27 min, on a run whose
    # suites were green. The lane split takes the test half off each leg, but
    # the rerun cold compile is unchanged and is what put the job near the
    # ceiling, so the ceiling is raised as well as the work divided — the same
    # "guard a HUNG job, not a budget" rule the two test jobs state.
    timeout-minutes: 70
    env:
      # `line-tables-only`, matching the other TEST jobs (test-linux) rather than
      # the `"0"` the pure-analysis jobs use: backtraces keep file:line, which is
      # what makes a red run diagnosable, while the target dir stays a fraction of
      # a full-debug build. (The predecessor job used `"0"`; it never had to read
      # a failing backtrace, because it ran two files that were expected to pass.)
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Linux-only: the rerun SDK tree needs link headroom on the stock runner
      # (the demos-go2/lint ENOSPC class). macOS runners have ample disk.
      #
      # This is `test-linux`'s FULLER reclaim, not the predecessor job's shorter
      # one, because the two changes that came with this job both push the other
      # way: 2 test binaries became 29, and `CARGO_PROFILE_DEV_DEBUG` went from
      # `"0"` to `line-tables-only`. `test-linux` pairs that exact profile with
      # this exact list precisely because it links ~70 test binaries — copying
      # the smaller list alongside the larger profile would inherit the
      # mitigation's name without its substance.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # Own cache namespace — and NOT because "no other job compiles rerun";
      # that claim is false. `test-linux` and
      # `test-macos` both run `cargo build --workspace`, and `--workspace`
      # OVERRIDES `default-members`, so they already build the viz members and
      # the whole rerun tree into the shared `cargo-${{ runner.os }}-` archive
      # (measured while this job still had a macOS leg: that archive was ~8 GB
      # and already contained it).
      #
      # The two real reasons:
      #   1. PROFILE. The shared key is a single namespace that five jobs write
      #      under at different `CARGO_PROFILE_DEV_DEBUG` settings (`lint` and
      #      `docs` at "0", `test-linux` and `test-macos` at
      #      `line-tables-only`). Every mismatch re-fingerprints and rebuilds
      #      what it restored. A private namespace means this job's `line-tables-only`
      #      artifacts are the ones it gets back.
      #   2. LINK OUTPUT. `cargo build --workspace` builds the viz LIBS; this job
      #      additionally LINKS 29 rerun-carrying test binaries, which is the
      #      bulky half. Keeping those out of the shared archive keeps the
      #      restore cost off every other job.
      #
      # The predecessor's `cargo-viz-tf-e2e-` prefix is deliberately NOT kept as
      # a second restore-key. The theory that it buys a warm `~/.cargo/registry`
      # for free does not survive contact with the facts: GitHub scopes caches
      # by BRANCH, so on a pull request the only entries that prefix can reach
      # live on refs this job never runs from, and no macOS variant of it has
      # ever existed (the predecessor was ubuntu-only). So it is dead on a pull
      # request and, post-merge, would restore a
      # `target/` built under the OLD `CARGO_PROFILE_DEV_DEBUG="0"` profile —
      # which re-fingerprints and rebuilds under `line-tables-only` anyway, while
      # occupying exactly the disk headroom the reclaim step above exists to
      # create. A key that cannot help and can hurt is not a fallback.
      #
      # PER LANE, and that is a measured bug fix rather than tidiness. The two
      # `lane` legs are two JOBS sharing one key, so the first to finish saves
      # and the second is told it has nothing to do: in one observed run BOTH
      # `Post Cache cargo` steps logged *"Cache hit occurred on the primary key
      # cargo-viz-Linux-<lock>, not saving cache"*, so exactly ONE lane's
      # artifacts have ever been in that archive and the other rebuilds from it
      # every run. The asymmetry is visible in the same two logs: the `viz` lane
      # compiled 7 crates (1m12s, 0 downloads) while the `vizd` lane compiled
      # 167 and DOWNLOADED 13 (2m01s) — arrow, tokio, ring, re_log, axum-core —
      # i.e. it restored a `target/` whose fingerprints were resolved for the
      # other lane's feature set. Two lanes that build different feature
      # resolutions of the same tree need two archives; one key can only ever
      # hold one of them.
      #
      # The lane segment goes BEFORE `runner.os` deliberately: `restore-keys`
      # match by PREFIX, so with the lane after the OS the legacy
      # `cargo-viz-Linux-` prefix would also match `cargo-viz-Linux-vizd-<lock>`
      # and could hand one lane the other lane's archive — which is the defect
      # this change exists to remove. With the lane first, neither lane's prefix
      # can reach the other's entries.
      #
      # The legacy shared prefix IS kept as the LAST restore-key, and the
      # objection to `cargo-viz-tf-e2e-` above does not transfer to it: that
      # prefix was written by a different job under the old
      # `CARGO_PROFILE_DEV_DEBUG="0"` profile and existed on refs this job never
      # runs from, whereas this one was written by THIS job under THIS profile
      # and is live on `main`. Without it the first run after this change is a
      # cold rerun compile on both lanes; with it each lane warm-starts from
      # today's archive exactly once, then saves its own. It decays on its own —
      # nothing writes that key any more.
      #
      # COST: one additional ~1.7 GB entry per ref (the repo measured 37.0 GB
      # over 50 active entries in the reviewed cache inventory, and GitHub evicts by LRU + 7 days).
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-viz-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-viz-${{ matrix.lane }}-${{ runner.os }}-
            cargo-viz-${{ runner.os }}-

      # PARALLEL by design — see the classification in the job comment. Runs the
      # WHOLE package: every integration binary plus the lib suite, so a viz test
      # file added tomorrow is covered without touching this file (the
      # default-cover model). When last measured: 665 tests + 3 `#[ignore]`d
      # measurement sweeps, ~21 s of test time and a 28-35 s warm wall — a
      # snapshot for budgeting, NOT a number anything asserts.
      # `--no-fail-fast`: this step runs MANY test binaries, and without it the
      # first binary to fail aborts the whole step — every later binary is
      # skipped and reports nothing. On a required check that turns one flaky
      # arm into a total loss of signal for the rest of the package, which is
      # the opposite of what a whole-suite lane is for. With the flag, every
      # binary runs and the step still fails.
      - name: cerulion_viz tests (whole suite, parallel)
        if: matrix.lane == 'viz'
        run: cargo test -p cerulion_viz --no-fail-fast

      # SERIAL by design — see (a)/(b)/(c) in the job comment. Whole package,
      # same default-cover property. When last measured: 244 tests + 2 `#[ignore]`d
      # measurement arms, 132-139 s warm wall over four measured runs.
      # `--no-fail-fast` for the same reason as the viz lane above — this lane
      # runs 11 binaries, so without it one failing arm skips every binary that
      # has not run yet.
      #
      # `timeout-minutes` because fail-fast is NOT the whole story: this lane
      # has also HUNG, and a hang is immune to `--no-fail-fast`. The job ceiling
      # (70 above) does bound it, but only by cancelling the job after more than
      # an hour, which reads as an infra cancellation rather than a test fault
      # and holds a runner the whole time. 30 min is chosen from measured
      # data: this job's whole wall is ~8 min median / ~13 min p90 INCLUDING
      # checkout, cache restore and compile, so 30 is over 2x the p90 for the
      # test step alone — no healthy run comes near it — while turning a hang
      # into an attributable step failure in well under half the job ceiling.
      - name: cerulion_vizd tests (whole suite, serial)
        if: matrix.lane == 'vizd'
        timeout-minutes: 30
        run: cargo test -p cerulion_vizd --no-fail-fast -- --test-threads=1

      # `go2_tf` is the viz tree's THIRD package (`cerulion_viz/lib/go2_tf`);
      # naming only two packages would leave it executed by NO CI job, the exact
      # gap this job exists to close. 10 tests, pure TFMessage codec
      # (std + thiserror, no transport, no rerun), runs in ~0.0 s. Parallel: it
      # has no globals to share and no `tests/` dir.
      - name: go2_tf tests
        if: matrix.lane == 'viz'
        run: cargo test -p go2_tf

      # The OpenH264 fetcher's own suite. SAME argument as the two
      # whole-suite lanes above — `cargo clippy --workspace --all-targets`
      # COMPILES these, so a break was caught and a FAILING ASSERTION was not,
      # and every regression-catching claim in that module would have been
      # true on a laptop and inert here.
      #
      # HERMETIC: this crate's test build enables `decoder-from-source`, so
      # `openh264_fetch::fetch_enabled()` is false and NOTHING in these three
      # commands opens a socket (the live CDN round trip is `#[ignore]`d,
      # network-only, in `openh264_live_fetch_test.rs`). The marginal cost is seconds
      # — the expensive part, building the rerun SDK tree, is already paid above.
      - name: cargo test -p cerulion_viz --lib openh264_fetch
        if: matrix.lane == 'viz'
        run: cargo test -p cerulion_viz --lib openh264_fetch

      # Its OWN binary on purpose: the wiring pin counts a process-global
      # consultation counter and asserts it starts at zero, which only holds when
      # nothing else in the process has driven a decoder-less pool.
      - name: cargo test -p cerulion_viz --test openh264_fetch_wiring_test
        if: matrix.lane == 'viz'
        run: cargo test -p cerulion_viz --test openh264_fetch_wiring_test

      # `--test-threads=1`: two arms drive the process-global cache generation
      # (one bumps it, one asserts it did not move). They take a file-local mutex,
      # but the surrounding decode arms share a Rerun stream, so serial is the
      # cheap correct answer here.
      - name: cargo test -p cerulion_viz --test video_decode_test
        if: matrix.lane == 'viz'
        run: cargo test -p cerulion_viz --test video_decode_test -- --test-threads=1

  # Unused-dependency audit (cargo-machete).
  #
  # `deny.toml`'s `[bans]` section is currently toothless about dead deps, and
  # `cargo build` is happy to carry one forever — a dependency nobody uses is
  # still compile time, still lockfile surface, still an advisory the `deps`
  # job has to adjudicate, and (on this workspace) still a tree that decides
  # whether a crate can sit in `default-members`.
  #
  # NON-BLOCKING to start (`continue-on-error: true`), the `miri` precedent
  # spelled out at that job: machete is heuristic — it reads `use` statements
  # rather than resolving the graph — so it has a real false-positive rate on
  # build-dep-only and re-exported crates. Promote it to blocking after a run
  # of ~12 green, and if a nightly toolchain or a crate layout ever breaks it,
  # fix or pin rather than silently reverting to non-blocking.
  #
  # On adoption it found genuine unused declarations across `cerulion_core`,
  # `cerulion_cli`, `cerulion_connectd`, `cerulion_viz`, three example nodes,
  # the go2 demo and two benches. Those were left VISIBLE rather than waived — a
  # waiver for a true positive is how a dead dependency becomes permanent — and
  # have since been DELETED, so this job is quiet. Do not re-silence a finding
  # with a waiver: remove the dependency.
  #
  # The earlier failure (unused `tokio` + `tracing` in
  # `benches/shm_comparison` and `benches/shm_fast` — TRUE positives) was held
  # open awaiting the change that deletes both trees wholesale; when that stalled
  # behind a conflicting base, the four dep lines were removed at the manifests
  # instead (every gate must be meaningful — a standing red on every PR is not).
  # The removal resolves trivially in that change's favor when it rebases (delete wins
  # over modify). DELETE THIS PARAGRAPH once those trees are gone.
  #
  # And do NOT "fix" the red X by adding `continue-on-error: true` to the STEP.
  # The job-level flag above already does the job it is meant to do — it keeps
  # the WORKFLOW from failing (observed: a main run concluded success
  # with this job red), and this job is not in the required-status-checks list,
  # so it gates no merge. A step-level flag would additionally make the job
  # conclude SUCCESS while machete is still finding things, which quietly makes
  # the promotion criterion four paragraphs up ("~12 green runs") vacuous — a
  # gate that is present but inert, which is the class this repo keeps paying
  # for. A visible red on a true positive is the mechanism working.
  #
  # Two classes of FALSE positive ARE waived, each at its own manifest with the
  # reason: `cerulion_core`'s `iceoryx2-bb-*` / `iceoryx2-pal-*` family, declared
  # on purpose so the version-lockstep contract holds (`iceoryx2-bb-posix` is
  # deliberately NOT in that list, because the tool correctly reports it as
  # genuinely used); and `examples/go2/lib/unitree_go`'s `cerulion_core`, whose only
  # `use` is inside `include!`d generated code the tool cannot read.
  #
  # Resolve-only against the manifests; no compile, no cargo cache, no `needs:`
  # gate. Runs in PARALLEL and gates nothing.
  machete:
    name: Unused dependencies (cargo-machete, non-blocking)
    runs-on: ubuntu-latest
    # CI cost policy: push and workflow_dispatch only — these six were ~1/3 of hosted Linux minutes on every PR push; breakage is caught on the merge to main.
    # merge_group is excluded with pull_request: `main`'s push run is still the
    # control, so doing this work in the queue too would pay for it twice.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # `~/.cargo/bin` only: machete resolves nothing and builds nothing, so a
      # warm binary is the whole cache. Same shape as the `fuzz` job's
      # `cargo-fuzz` restore.
      - name: Cache cargo-machete
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: cargo-machete-bin-${{ runner.os }}-v0.9.2

      # PINNED to the version the cache key names. An unpinned `cargo install`
      # resolves the newest release, so on a cache MISS the job silently ran a
      # different tool from the one the key claims — and then saved that binary
      # under the `v0.9.2` key, which every later run restores. Two numbers in
      # two places again: they are now one.
      - name: Install cargo-machete (skipped when cache-restored)
        run: command -v cargo-machete >/dev/null || cargo install cargo-machete --version 0.9.2 --locked

      # Walks every manifest under the repo, so it also covers the workspaces
      # the root does not: examples/go2, benches/*, examples/*.
      - name: cargo machete
        run: cargo machete

  # Dependency audit: advisories, licenses, bans, sources. cargo-deny is the
  # exact release the desk gate runs (0.20.2), fetched as a checksummed
  # binary, so the config flag and the policy file mean the same thing in
  # both places. No Rust toolchain, no cargo cache, no `needs:` gate.
  # Policy lives in tools/release/deny.toml. Blocking by design.
  deps:
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-deny 0.20.2
        run: |
          set -eu
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl -sSL --retry 3 -o cargo-deny.tgz "$url"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tgz" | sha256sum -c -
          tar -xzf cargo-deny.tgz
          install -m 0755 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: Run cargo-deny
        run: cargo deny --config tools/release/deny.toml check advisories licenses bans sources
