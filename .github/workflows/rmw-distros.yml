name: rmw distro lanes

# One hosted lane per ROS 2 distro in the support set (Jazzy, the validated distro, as the regression
# guard; Lyrical, Humble, Galactic and Foxy as they land), inside the stock ros:<distro>-ros-base
# image, building rmw_cerulion against that distro's REAL headers (bindgen; the vendored fallback is
# refused).
# Each lane asserts the distro's KNOWN state through tools/ci/rmw-distros/gate.sh, so the lane is
# green while the state is true and turns red the moment the truth moves in either direction.
# The per-distro lanes run on PRs and pushes to main that touch the rmw path (the crate, its
# in-tree dependencies, the workspace manifests); the emulated aarch64 Foxy job runs on manual
# dispatch only. No lane is a required context on main, so a
# path-filtered lane that does not run can never leave a PR pending.

on:
  pull_request:
    paths:
      - 'crates/rmw_cerulion/**'
      - 'crates/cerulion_core/**'
      - 'crates/cerulion_heaphook/**'
      - 'crates/native_ros2_messages/**'
      - 'tools/ci/rmw-distros/**'
      - '.github/workflows/rmw-distros.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'crates/rmw_cerulion/**'
      - 'crates/cerulion_core/**'
      - 'crates/cerulion_heaphook/**'
      - 'crates/native_ros2_messages/**'
      - 'tools/ci/rmw-distros/**'
      - '.github/workflows/rmw-distros.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  # A pull request's runs supersede each other; every main push and every dispatch keeps its own run,
  # so a later push can never replace a pending result for an earlier main commit.
  group: rmw-distros-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Cache save policy, identical to ci.yml (see the CACHE_SAVE_* comment there):
  # the rmw lanes are restore-only under the default and save when the variable
  # names `rmw-distros-<distro>` or `all`. The PRUNE runs on every
  # default-branch run of this lane either way, so a restore-only namespace is
  # emptied rather than left holding archives nothing will replace.
  CACHE_SAVE_NAMESPACES: ${{ vars.CACHE_SAVE_NAMESPACES || 'macOS Linux' }}
  CACHE_SAVE_ON_PULL_REQUEST: ${{ vars.CACHE_SAVE_ON_PULL_REQUEST }}

permissions:
  contents: read

jobs:
  lane:
    name: rmw distro lane (${{ matrix.distro }})
    runs-on: ubuntu-latest
    # `actions: write` is for the cache prune step only (it deletes stale
    # entries of this job's cache namespace). Every other step needs read.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical, humble, galactic, foxy]
    container:
      image: ros:${{ matrix.distro }}-ros-base
      options: --shm-size=1g
    env:
      # The toolchain action exports CARGO_TERM_COLOR=always; the gate harvests cargo's status lines,
      # so colour stays off (harvest.sh also strips escapes, belt and braces).
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the bindgen toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git clang libclang-dev pkg-config procps
      - name: Install Rust (stable, with rustfmt for the bindgen layout-test reader)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Fingerprint the distro headers
        # The image tag floats; bindgen's input is the header tree, so the cache follows the headers,
        # never a tag that may have been republished. Every ament prefix's include tree is hashed,
        # and an empty find fails the step rather than keying the cache on the hash of nothing.
        id: headers
        shell: bash
        run: |
          set -euo pipefail
          set +u; source "/opt/ros/${{ matrix.distro }}/setup.bash"; set -u
          files=$(for p in ${AMENT_PREFIX_PATH//:/ }; do [ -d "$p/include" ] && find "$p/include" -type f \( -name '*.h' -o -name '*.hpp' \); done | sort)
          n=$(printf '%s\n' "$files" | grep -c . || true)
          [ "$n" -gt 0 ] || { echo "::error::no headers found under any ament prefix ($AMENT_PREFIX_PATH)"; exit 1; }
          hh=$(printf '%s\n' "$files" | xargs sha256sum | sha256sum | cut -c1-16)
          echo "hash=$hh" >> "$GITHUB_OUTPUT"
          echo "distro header tree hash: $hh over $n files"
      - name: Self-test the gate's log harvester
        run: bash tools/ci/rmw-distros/gate_selftest.sh
      - name: Cache cargo (restore)
        id: cache-restore-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rmw-distros-${{ matrix.distro }}-${{ steps.headers.outputs.hash }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rmw-distros-${{ matrix.distro }}-${{ steps.headers.outputs.hash }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}-
            cargo-rmw-distros-${{ matrix.distro }}-${{ steps.headers.outputs.hash }}-main-
            cargo-rmw-distros-${{ matrix.distro }}-${{ steps.headers.outputs.hash }}-
      - name: Gate (expected state for this distro)
        run: bash tools/ci/rmw-distros/gate.sh "${{ matrix.distro }}"

      # `gh` and `jq` are on every hosted runner image and on NEITHER of the
      # ros:<distro>-ros-base images this lane runs in, so the prune step below
      # died at its first `gh cache list` the moment the policy enabled this
      # namespace. Installed under the prune's own condition, so it costs this
      # lane nothing on the runs that do not prune. `ci_cache_policy_check.py`
      # holds the pairing (rule R9_CONTAINER_TOOLS).
      - name: Install the cache prune tools (gh, jq)
        if: >-
          github.event_name != 'merge_group'
          && (github.ref == 'refs/heads/main' || (env.CACHE_SAVE_ON_PULL_REQUEST != '' && github.event.pull_request.head.repo.full_name == github.repository))
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq
          install -m 0755 -d /usr/share/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          arch=$(dpkg --print-architecture)
          printf 'deb [arch=%s signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n' \
            "$arch" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          gh --version
          jq --version

      # Cache save policy: see the CACHE_SAVE_* keys in the workflow `env` block.
      # The prune is gated on the BRANCH only, never on the namespace list: this
      # lane is restore-only under the default, and a namespace that never
      # prunes keeps its stale archives for ever.
      - name: Cache cargo (prune the namespace to the current key)
        id: cache-prune
        if: >-
          github.event_name != 'merge_group'
          && (github.ref == 'refs/heads/main' || (env.CACHE_SAVE_ON_PULL_REQUEST != '' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/scripts/ci_cache_prune.sh "cargo-rmw-distros-${{ matrix.distro }}-${{ steps.headers.outputs.hash }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}-${{ hashFiles('**/Cargo.lock') }}" "cargo-rmw-distros-${{ matrix.distro }}-"

      # Saved as the LAST step so a green job stores what it built, and never from
      # a merge-queue build: its branch is deleted after the batch, so nothing could
      # restore what it saved, and the upload only adds eviction pressure on the
      # store.
      - name: Cache cargo (save)
        if: >-
          steps.cache-restore-1.outputs.cache-hit != 'true'
          && github.event_name != 'merge_group'
          && (github.ref == 'refs/heads/main' || (env.CACHE_SAVE_ON_PULL_REQUEST != '' && github.event.pull_request.head.repo.full_name == github.repository))
          && steps.cache-prune.outputs.proceed == 'true'
          && (env.CACHE_SAVE_NAMESPACES == 'all' || contains(format(' {0} ', env.CACHE_SAVE_NAMESPACES), format(' rmw-distros-{0} ', matrix.distro)))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rmw-distros-${{ matrix.distro }}-${{ steps.headers.outputs.hash }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}-${{ hashFiles('**/Cargo.lock') }}

  # ---------------------------------------------------------------------------
  # aarch64 Foxy under QEMU emulation. Builds rmw_cerulion and runs the rclpy
  # cross-process exchange on the aarch64 Foxy platform (glibc 2.31) inside an
  # emulated linux/arm64 container, short of physical hardware: the architecture
  # and C-library surface a library built for a newer distribution can meet at a
  # different alignment and stride. Emulated, so slow; manual-dispatch only. It
  # never runs on a pull request, so the only status it can emit there is
  # skipped, and it is in neither required-check list.
  # ---------------------------------------------------------------------------
  lane_foxy_aarch64:
    name: rmw distro lane (foxy, aarch64 via QEMU)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # QEMU user-mode runs arm64 at roughly 5-20x slowdown; a from-scratch
    # clang+bindgen+rustc build of the whole dep tree, the exchange test-target
    # pre-build and the three exchanges (the in-process serial suite is deferred on
    # this leg) fit under this ceiling (GitHub caps at 6 h; this run measured ~65 min).
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Register the arm64 binfmt handler on the host so `docker run --platform
      # linux/arm64` executes arm64 binaries under QEMU. Done with the canonical
      # digest-pinned binfmt image rather than a third-party Action, so this adds
      # no new `uses:` entry. The digest is tonistiigi/binfmt:latest as resolved
      # on 2026-09-30; :latest moves, so the digest is the pin.
      - name: Register arm64 binfmt (QEMU)
        shell: bash
        run: |
          set -uo pipefail
          docker run --privileged --rm \
            tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 \
            --install arm64

      - name: Build + symbol audit + rclpy exchange on Foxy aarch64 (QEMU)
        shell: bash
        env:
          # Colour off at the source; the markers below are also read off a
          # colour-stripped copy (belt and braces, repo rule).
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/rmw-foxy-arm64.log"

          # stdin heredoc + `bash -s` avoids arg-quoting; the quoted delimiter
          # keeps $VAR expanding INSIDE the container. The `tee` is
          # non-truncating and the greps below read the FILE, not a live pipe.
          # RCLPY_TIMEOUT: the native exchange finishes far inside gate.sh's 600s
          # per-exchange default; 2400s keeps the per-exchange wall clear of the
          # emulation slowdown. RMW_GATE_SKIP_SERIAL_SUITE=1 runs build + symbol
          # audit + the staged-library digest + the exchanges, skipping the
          # in-process serial suite (see the POLICY line below).
          # The runner invokes `shell: bash` with -e; drop it only around the
          # docker pipeline so a nonzero gate is captured in rc (not an instant
          # abort), then restore it for the marker checks that follow.
          set +e
          docker run --rm -i \
            --platform linux/arm64 \
            --shm-size=1g \
            -e CARGO_TERM_COLOR=never \
            -e RCLPY_TIMEOUT=2400 \
            -e RMW_GATE_SKIP_SERIAL_SUITE=1 \
            -v "$PWD":/w -w /w \
            ros:foxy-ros-base \
            bash -s <<'CONTAINER' 2>&1 | tee "$log"
          set -euo pipefail

          # [planted-failure self-test, emulated path] The SAME predicates that
          # gate this leg on arm64-ness must ACCEPT the arm64 value and REJECT
          # the amd64 value. Drive each on known literals first (two-sided), so a
          # vacuous always-true predicate cannot let a silent amd64 fallback pass
          # as green. Mirrors gate.sh's wrong-payload self-test philosophy.
          is_aarch64_uname() { [ "$1" = aarch64 ]; }
          is_aarch64_elf()   { printf '%s' "$1" | grep -qi 'aarch64'; }
          is_aarch64_uname aarch64 || { echo "::error::planted-failure: the uname predicate REJECTED aarch64 (comparator broken)"; exit 1; }
          if is_aarch64_uname x86_64; then echo "::error::planted-failure: the uname predicate ACCEPTED x86_64 (no teeth)"; exit 1; fi
          is_aarch64_elf 'AArch64' || { echo "::error::planted-failure: the ELF predicate REJECTED AArch64 (comparator broken)"; exit 1; }
          if is_aarch64_elf 'Advanced Micro Devices X86-64'; then echo "::error::planted-failure: the ELF predicate ACCEPTED x86-64 (no teeth)"; exit 1; fi
          echo "PLANTED-FAILURE SELF-TEST OK: arm64 predicates accept aarch64/AArch64 and reject x86_64/X86-64"

          # [arch teeth] a silent amd64 fallback must die cheaply, before any
          # build. Uses the predicate the self-test just proved discriminates.
          echo "RUNNING UNDER: $(uname -m)"
          is_aarch64_uname "$(uname -m)" || { echo "::error::QEMU NOT active: uname -m=$(uname -m), expected aarch64 (a silent amd64 fallback invalidates this leg)"; exit 1; }

          # [rule 46] force a from-scratch compile: no cache is restored, and the
          # bind-mounted target/ is removed belt-and-suspenders, so a real
          # 'Compiling rmw_cerulion' line is guaranteed on a real arm64 build.
          rm -rf target

          # ROS env (setup.bash is nounset-hostile).
          set +u; source /opt/ros/foxy/setup.bash; set -u
          [ "${ROS_DISTRO:-}" = "foxy" ] || { echo "::error::ROS_DISTRO=${ROS_DISTRO:-} is not foxy"; exit 1; }
          echo "GLIBC: $(ldd --version | head -n1)"   # expect 2.31 -- the Ubuntu 20.04 (focal) ABI

          # bindgen toolchain (same package set as the amd64 lane) + Rust via
          # rustup (the arm64 ros image ships no Rust); rustfmt matches the amd64
          # lane (the bindgen layout-test reader needs it).
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git clang libclang-dev pkg-config procps
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt
          . "$HOME/.cargo/env"
          rustc -vV; cargo -vV

          # Parity with the amd64 lane: prove the gate's own self-tests run under
          # arm64 bash BEFORE the real gate.
          bash tools/ci/rmw-distros/gate_selftest.sh </dev/null

          # Scope on this emulated leg: build + nm symbol audit + the staged-
          # library digest + 3 fresh-process rclpy exchanges (both directions) +
          # the wrong-payload self-test. The in-process serial suite is skipped
          # (RMW_GATE_SKIP_SERIAL_SUITE=1); the POLICY line names the two tests
          # that drove the skip, so the gate reports what it judged.
          echo "POLICY: emulated aarch64 Foxy runs build + symbol audit + staged-library digest + 3 fresh-process rclpy exchanges + the wrong-payload self-test; the in-process serial suite is deferred (two of its tests behave differently under emulation; both pass on the amd64 foxy lane in the same run)."
          echo "POLICY detail: rmw_wait_event_test::a_nine_entity_hop_drains_and_probes_only_what_fired breaches its per-hop drain budget under emulation (timing-sensitive)."
          echo "POLICY detail: rmw_shadow_take_test::c_copied_then_malformed_frame_retires_the_shadow_instead_of_recycling_it terminates the harness by SIGBUS under emulation (undiagnosed, under investigation)."
          bash tools/ci/rmw-distros/gate.sh foxy </dev/null

          # [rule 46 + teeth] the freshly built .so must be an AArch64 ELF --
          # proves the compile produced arm64 code, not a leaked amd64 artifact.
          # Uses the predicate the self-test proved discriminates.
          so="target/release/librmw_cerulion.so"
          machine="$(readelf -h "$so" | awk -F: '/Machine:/ {gsub(/^[ \t]+/,"",$2); print $2}')"
          echo "BUILT .so MACHINE: ${machine}"
          is_aarch64_elf "${machine}" || { echo "::error::rule 46: ${so} is NOT an AArch64 ELF (Machine=${machine})"; exit 1; }
          echo "ELF TEETH OK: ${so} is AArch64"
          CONTAINER
          rc=${PIPESTATUS[0]}
          set -e

          # Read every marker off a colour-stripped copy (repo rule), belt and
          # braces with CARGO_TERM_COLOR=never.
          plain="$RUNNER_TEMP/rmw-foxy-arm64.plain"
          sed -E "s/$(printf '\033')\[[0-9;]*m//g" "$log" > "$plain"

          # 1) the gate itself must have passed.
          [ "$rc" -eq 0 ] || { echo "::error::Foxy aarch64 QEMU gate failed (rc=$rc)"; exit 1; }

          # 2) rule 46: a real arm64 compile happened. A target-cache hit would
          #    omit these lines; this leg caches nothing, so their ABSENCE means
          #    the build was skipped -- red it even on an rc=0 'green'.
          grep -qE '^[[:space:]]*Compiling rmw_cerulion v' "$plain" \
            || { echo "::error::rule 46: 'Compiling rmw_cerulion' absent from the arm64 build log -- not a real arm64 compile"; exit 1; }
          grep -qE '^[[:space:]]*Compiling cerulion_core v' "$plain" \
            || { echo "::error::rule 46: 'Compiling cerulion_core' absent -- in-tree deps were not compiled for arm64"; exit 1; }

          # 3) the planted-failure self-test and the arch/ELF teeth must have run.
          grep -qxE 'PLANTED-FAILURE SELF-TEST OK: .*' "$plain" \
            || { echo "::error::teeth: the planted-failure self-test line is absent -- the arm64 predicates were never proven to discriminate"; exit 1; }
          grep -qxE 'RUNNING UNDER: aarch64' "$plain" \
            || { echo "::error::QEMU teeth: the container never confirmed uname -m=aarch64"; exit 1; }
          grep -qE '^ELF TEETH OK: .*AArch64$' "$plain" \
            || { echo "::error::teeth: the built .so was not confirmed AArch64"; exit 1; }

          # 4) the in-process serial suite must NOT have run on this emulated
          #    leg, and the skip + policy lines must be present: the deferral is proven,
          #    not assumed, and the policy line that names the deferred tests cannot be
          #    dropped (or the skip flipped on elsewhere) without reddening here.
          if grep -qE '== rmw serial suite on foxy \(' "$plain"; then echo "::error::the in-process serial suite RAN on the emulated leg; the skip did not take effect"; exit 1; fi
          grep -qE '== in-process serial suite SKIPPED on foxy ' "$plain" \
            || { echo "::error::the serial-suite skip line is absent; the deferral is unproven"; exit 1; }
          grep -qE '^POLICY: emulated aarch64 Foxy ' "$plain" \
            || { echo "::error::the POLICY line that names the deferred tests is absent"; exit 1; }

          echo "Foxy aarch64 (QEMU) PASSED: planted-failure self-test + real arm64 compile + symbol audit + staged-library digest + 3 fresh-process rclpy exchanges + wrong-payload self-test (glibc 2.31, aarch64)."
