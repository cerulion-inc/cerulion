plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cerulion.sample'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cerulion.sample'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main.java.srcDirs += '../../java'
    }
}
