[package]
name = "cerulion_android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Embedded Cerulion runtime for Android apps: Java facade, JNI bindings and graph nodes linked into the app library"
readme = "README.md"
keywords = ["robotics", "android", "jni", "embedded", "cerulion"]
categories = ["science::robotics", "os::android-apis"]
# A crates.io download carries this crate's sources, the Java facade an app
# compiles against, its README, the text of its license and this manifest.
# The sample Gradle project and the integration tests serve work inside this
# repository, so they stay out of the package.
include = ["src/*.rs", "java/**", "Cargo.toml", "README.md", "LICENSE"]

# A library only: an app links this crate into its own runtime library (the
# `cdylib` that also links the app's graph nodes), so the app ships one
# native library and no build makes a second runtime library.
[lib]
crate-type = ["rlib"]

[dependencies]
cerulion_bag = { workspace = true }
cerulion_bagd = { workspace = true }
cerulion_cli_engine = { workspace = true }
cerulion_core = { workspace = true }
cerulion_mdns = { workspace = true }
iceoryx2 = "=0.10.0"
jni = "=0.21.1"
indexmap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9.11"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
cerulion_core = { workspace = true, features = ["local-transport"] }

[features]
# Test seams for this crate's own integration tests (the dev-dependency on
# itself below turns it on); never enabled by an app build.
test-helpers = ["cerulion_core/test-helpers"]
# Run the host build on the in-process transport an Android app uses, so the
# host tests cover the app's transport. Android builds turn it on already.
local-transport = ["cerulion_core/local-transport"]

[dev-dependencies]
cerulion_android = { path = ".", features = ["test-helpers"] }
# Turns on cerulion_core's `test-helpers` for tests (`testing::TestTransport`,
# used to seed a TopicServiceConfig for the pure provisioning helpers).
cerulion_core = { path = "../cerulion_core", features = ["test-helpers"] }
tempfile = "3"
# Node crates linked as plain libraries, the way an app runtime library links
# its nodes: `default-features = false` leaves the C exports out.
test_node_macro_period_cdylib = { path = "../test_fixtures/test_node_macro_period_cdylib", default-features = false }
test_node_macro_period_input_cdylib = { path = "../test_fixtures/test_node_macro_period_input_cdylib", default-features = false }
test_node_macro_period_panic_cdylib = { path = "../test_fixtures/test_node_macro_period_panic_cdylib", default-features = false }
test_node_macro_relay_rlib = { path = "../test_fixtures/test_node_macro_relay_rlib" }
zenoh = { version = "1", default-features = false, features = ["transport_tcp"] }

[lints]
workspace = true
