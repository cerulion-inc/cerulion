[package]
name = "cerulion_android"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cerulion_bag = { workspace = true }
cerulion_bagd = { workspace = true }
cerulion_cli_engine = { workspace = true }
cerulion_core = { workspace = true }
jni = "=0.21.1"
indexmap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
cerulion_core = { workspace = true, features = ["local-transport"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
