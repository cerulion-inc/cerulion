[package]
name = "cerulion_core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cerulion_core]
path = ".."
features = ["fuzz-helpers"]

[[bin]]
name = "fuzz_wire_header"
path = "fuzz_targets/fuzz_wire_header.rs"
doc = false

[[bin]]
name = "fuzz_parse_graph"
path = "fuzz_targets/fuzz_parse_graph.rs"
doc = false

[[bin]]
name = "fuzz_parse_info_json"
path = "fuzz_targets/fuzz_parse_info_json.rs"
doc = false

# Prevent cargo from treating this as part of the parent workspace.
# Required by cargo-fuzz convention.
[workspace]
