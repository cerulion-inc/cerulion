# SPDX-License-Identifier: AGPL-3.0-only
#
# `cerulion_tf` - rigid transforms for Cerulion frames, and the tf buffer.
#
# WHY A CRATE. The SE(3) math (compose, invert, apply, interpolate) and the
# tf buffer (a frame tree with a bounded time ring per edge, read by
# `lookup(parent, child, time)`) are pure: no transport, no allocation after
# construction, no I/O. Every later frame feature (`/tf` and `/tf_static`
# feeds, frame tree checks in graph YAML, `tf echo`, the robot state
# publisher) builds on them, and their results must be bit-identical on every
# machine so that frame lookups replay byte-exact. A leaf crate keeps them
# free of the runtime's dependency tree and keeps the mutation check fast.
# std + thiserror ONLY.
[package]
name = "cerulion_tf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Deterministic SE(3) rigid transform math and the tf buffer for Cerulion frames: compose, invert, apply, SLERP interpolation and lookup(parent, child, time) with bit-identical results on every machine"
keywords = ["robotics", "tf", "quaternion", "slerp", "cerulion"]
categories = ["science::robotics", "mathematics"]
# Not published to crates.io: no published crate depends on it.
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2"
