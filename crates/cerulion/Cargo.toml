# SPDX-License-Identifier: AGPL-3.0-only
#
# `cerulion` is the umbrella crate: it brings the runtime, the node macros and
# the generated ROS 2 message types in together at one version. A project
# that uses the node macros also names `cerulion_core` directly, because the
# macros expand to paths rooted at `::cerulion_core`.
#
# It holds no logic of its own. Every item it exposes is a re-export, which is
# what lets it pin its three dependencies exactly: the four crates are
# released in lockstep, so an exact pin can never resolve to a combination
# that was not tested together.
[package]
name = "cerulion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Zero-copy robotics middleware: re-exports the Cerulion runtime, node macros and ROS 2 message types at one version (node macros also need cerulion_core as a direct dependency)"
readme = "README.md"
keywords = ["robotics", "zero-copy", "ros2", "real-time", "cerulion"]
categories = ["science::robotics", "concurrency", "network-programming"]
# A crates.io download carries this crate's own sources, its README, the
# text of the license it is published under and this manifest. Whatever else
# the directory holds now or gains later, an integration test tree or an
# agent instruction file, serves work inside this repository: a dependent
# never builds from it, so it stays out of the package.
include = ["src/", "Cargo.toml", "README.md", "LICENSE"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cerulion_core = { workspace = true }
cerulion_macros = { workspace = true }
native_ros2_messages = { workspace = true }
