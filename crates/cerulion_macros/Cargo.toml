[package]
name = "cerulion_macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Procedural macros for defining Cerulion node types: #[cerulion_node], #[cerulion_node_impl] and #[derive(CerulionState)]"
readme = "README.md"
keywords = ["robotics", "proc-macro", "codegen", "cerulion"]
categories = ["science::robotics", "development-tools::procedural-macro-helpers"]
# A crates.io download carries this crate's own sources, its README, the
# text of the license it is published under and this manifest. Whatever else
# the directory holds now or gains later, an integration test tree or an
# agent instruction file, serves work inside this repository: a dependent
# never builds from it, so it stays out of the package.
include = ["src/", "Cargo.toml", "README.md", "LICENSE"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# Reads the CONSUMING package's Cargo.toml at expansion time and reports the
# name that package gave a dependency, so generated code can point at the
# crate root the package actually named. Already in this workspace's lockfile
# through four other proc-macro crates, so it adds no package and no license
# to the tree. A caret requirement: a downstream graph holds one 3.x, and an
# exact pin here would refuse every graph whose other crates need a later
# one. 3.5.0 is the first release on the toml_edit 0.25 line below.
proc-macro-crate = "3.5.0"
# Reads which table of the consuming package's manifest names a crate, and
# whether the entry is optional, so a runtime entry that is not linked into
# every target does not outrank an umbrella entry that is. The requirement
# and the single feature are the ones proc-macro-crate 3.5.0 declares, so
# the resolver serves both from one toml_edit.
toml_edit = { version = "0.25.0", default-features = false, features = ["parse"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "visit", "visit-mut", "extra-traits"] }
