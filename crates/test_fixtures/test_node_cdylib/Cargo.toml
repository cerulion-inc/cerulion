[package]
name = "test_node_cdylib"
version = "0.1.0"
edition = "2021"
description = "Test cdylib crate for DylibNodeEntry integration tests"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { workspace = true }
serde_json = "1"

# The ONE strict lint table lives in the root `[workspace.lints]`.
[lints]
workspace = true
