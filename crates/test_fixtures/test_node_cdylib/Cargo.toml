[package]
name = "test_node_cdylib"
version = "0.1.0"
edition = "2021"
description = "Test cdylib crate for DylibNodeEntry integration tests"
publish = false

[lib]
crate-type = ["cdylib"]

# A parity fix from review: the cdylib's `cerulion_node_init`
# reclaims the host's `Box::into_raw(NodeContext)` via `Box::from_raw` to
# avoid leaking one NodeContext per init call. This requires importing the
# `NodeContext` type from `cerulion_core`. Matches the pattern in
# `test_node_raw_ffi_template_cdylib` and the macro form generated by
# `cerulion_macros::gen_cdylib`.
[dependencies]
cerulion_core = { path = "../../cerulion_core" }

# The ONE strict lint table lives in the root `[workspace.lints]`.
[lints]
workspace = true
