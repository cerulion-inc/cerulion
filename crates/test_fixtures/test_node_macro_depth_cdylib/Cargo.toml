[package]
name = "test_node_macro_depth_cdylib"
version = "0.1.0"
edition = "2021"
# Test fixture — never publish to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { path = "../../native_ros2_messages" }

[features]
cdylib = []
