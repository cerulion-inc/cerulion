[package]
name = "test_node_macro_cdylib"
version = "0.1.0"
edition = "2021"
# Test fixture — never publish to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { path = "../../native_ros2_messages" }

[features]
cdylib = []
local-transport = ["cerulion_core/local-transport"]
default = ["cdylib"]

# The ONE strict lint table lives in the root `[workspace.lints]`.
[lints]
workspace = true

[dev-dependencies]
trybuild = "1"

# The context-helper programs, as binaries, with the default `cdylib` feature
# and no `cfg(test)`. Every build of this package compiles them: `cargo build
# -p test_node_macro_cdylib` resolves only the features this package asks
# for, as a downstream build does, and no build without dev-dependencies turns
# on cerulion_core's `test-helpers`. Cargo also builds a package's binaries
# for each of its integration tests, in the same invocation and with the same
# features (on shard 2, cerulion_core's test features), and
# `tests/context_helpers.rs` runs each one through `CARGO_BIN_EXE_<name>`.
[[bin]]
name = "pass_annotated_context_helper"
path = "tests/ui/annotated_context_helper.rs"
test = false
bench = false
doc = false

[[bin]]
name = "pass_data_only_helpers"
path = "tests/ui/data_only_helpers.rs"
test = false
bench = false
doc = false

[[bin]]
name = "pass_qualified_context_helper"
path = "tests/ui/qualified_context_helper.rs"
test = false
bench = false
doc = false
