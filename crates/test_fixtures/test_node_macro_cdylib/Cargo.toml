[package]
name = "test_node_macro_cdylib"
version = "0.1.0"
edition = "2021"
# Test fixture — never publish to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { path = "../../native_ros2_messages" }

[features]
cdylib = []
local-transport = ["cerulion_core/local-transport"]
default = ["cdylib"]

# The ONE strict lint table lives in the root `[workspace.lints]`.
[lints]
workspace = true

[dev-dependencies]
trybuild = "1"
# Turns on `cerulion_core/test-helpers` in each test build of this package,
# which the context-helper programs below require; a build that compiles no
# test of this package, the workspace build among them, skips them. The
# cerulion_core shard on shard 2 builds this package's tests with core's own
# test features, which carry the same feature.
cerulion_core = { path = "../../cerulion_core", features = ["test-helpers"] }

# The context-helper programs, as binaries. Cargo builds a package's binaries
# for each of its integration tests, in the same invocation and with the same
# features, with the default `cdylib` feature and no `cfg(test)`, as a
# downstream `cargo build` compiles them, and `tests/context_helpers.rs` runs
# each one through `CARGO_BIN_EXE_<name>`.
[[bin]]
name = "pass_annotated_context_helper"
path = "tests/ui/annotated_context_helper.rs"
required-features = ["cerulion_core/test-helpers"]
test = false
bench = false
doc = false

[[bin]]
name = "pass_data_only_helpers"
path = "tests/ui/data_only_helpers.rs"
required-features = ["cerulion_core/test-helpers"]
test = false
bench = false
doc = false

[[bin]]
name = "pass_qualified_context_helper"
path = "tests/ui/qualified_context_helper.rs"
required-features = ["cerulion_core/test-helpers"]
test = false
bench = false
doc = false
