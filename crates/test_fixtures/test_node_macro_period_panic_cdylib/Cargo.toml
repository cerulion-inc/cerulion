[package]
name = "test_node_macro_period_panic_cdylib"
version = "0.1.0"
edition = "2021"
# Test fixture — never publish to crates.io.
publish = false

# `rlib` too: a test links this node into its own binary with
# `default-features = false`, the way an app runtime library links its nodes.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { path = "../../native_ros2_messages" }

[features]
cdylib = []
default = ["cdylib"]

# The ONE strict lint table lives in the root `[workspace.lints]`.
[lints]
workspace = true
