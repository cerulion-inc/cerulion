[package]
name = "node_macro_ui"
version = "0.1.0"
edition.workspace = true
description = "The #[cerulion_node] diagnostics suite: trybuild compile-fail fixtures with their .stderr oracles, and the compile-pass programs built as binaries and run."
publish = false

# Cargo needs one library or binary target; this one is empty.
[lib]
path = "src/lib.rs"

# The crates the fixtures name, with the features cerulion_core's own test
# build turns on, because a fixture's diagnostic can name an item that exists
# only under one of them. `state_derive_escape_in_variant` derives serde's
# traits itself. trybuild's scratch project takes both tables, the
# dev-dependency entry over the plain one, so the plain entries below change
# nothing it builds.
[dev-dependencies]
cerulion_core = { path = "../../cerulion_core", features = ["test-helpers"] }
native_ros2_messages = { path = "../../native_ros2_messages", features = ["test-helpers"] }
serde = { version = "1", features = ["derive"] }
trybuild = "1"

# The crates the compile-pass programs use: a binary target links only plain
# dependencies. No features here, so a build of this package that compiles no
# test adds none to them.
[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { path = "../../native_ros2_messages" }

# The compile-pass programs, as binaries. Cargo builds a package's binaries
# for each of its integration tests, in the same invocation and with the same
# features, the way `cargo build` builds a package that uses the macros: no
# `cfg(test)`, no harness. `tests/pass_programs.rs` runs each one through
# `CARGO_BIN_EXE_<name>` and requires `main` to return success, which is what
# trybuild's pass mode checked. Cargo builds them for `--test pass_programs`
# named alone too, which it does not do for examples. `required-features`
# keeps them out of every build that compiles no test of this package: the
# dev-dependency above turns `cerulion_core/test-helpers` on in each test
# build, and no plain dependency of a workspace member turns it on, so a
# `cargo build` skips them. Unlike trybuild's scratch build they get the
# workspace lints and no `-A dead_code`, so three carry an `#![allow]` for
# what they compile on purpose: unread fields, an unconstructed node, a remedy
# written with `.last()`, and a doc comment's `+` line.
[[bin]]
name = "pass_determinism_allow_non_deterministic_passes"
path = "tests/ui/pass/determinism_allow_non_deterministic_passes.rs"
required-features = ["cerulion_core/test-helpers"]
test = false
bench = false
doc = false

[[bin]]
name = "pass_determinism_fs_read_dir_warns"
path = "tests/ui/pass/determinism_fs_read_dir_warns.rs"
required-features = ["cerulion_core/test-helpers"]
test = false
bench = false
