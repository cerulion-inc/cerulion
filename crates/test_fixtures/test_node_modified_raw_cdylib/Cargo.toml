[package]
name = "test_node_modified_raw_cdylib"
version = "0.1.0"
edition = "2021"
description = "Delivery fixture: the raw-FFI template after `node modify` added two geometry_msgs/Vector3 outputs. cerulion_cli_engine pins its INFO block to that modify output; node_raw_ffi_template_test loads it and checks typed delivery on all three ports."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cerulion_core = { path = "../../cerulion_core" }
native_ros2_messages = { workspace = true }

# The ONE strict lint table lives in the root `[workspace.lints]`.
[lints]
workspace = true
