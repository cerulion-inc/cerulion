[package]
name = "cerulion_node_abi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Compiler-independent C interface for Cerulion node plugins"
readme = "README.md"
include = ["src/", "Cargo.toml", "README.md", "LICENSE"]

[lints]
workspace = true

[features]
loader = ["dep:libloading", "stabby/libloading"]

[dependencies]
# 0.9 exactly as a major: the loader reads 0.9's error variants. Stabby's
# integration accepts 0.7.3 up to 0.10, so a resolve gives its extension trait
# and this owner one Library type, 0.9.
libloading = { version = "0.9", optional = true }
stabby = { version = "=72.1.16", default-features = false, features = ["std"] }
thiserror = "2"
