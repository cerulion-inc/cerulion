# SPDX-License-Identifier: AGPL-3.0-only
#
# `cerulion_device` - GPU residence for Cerulion message payloads.
#
# One `DeviceBackend` trait with four backends: HostShm (plain shared memory,
# the oracle every other backend is tested against), CUDA, HIP and Metal. The
# three vendor backends open their driver library with dlopen at run time, so
# building this crate needs no vendor SDK and a machine without the library
# reports the backend as unavailable instead of failing to link.
# std + thiserror + libc + libloading + tracing ONLY.
[package]
name = "cerulion_device"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "GPU residence for Cerulion payloads: one device backend trait over CUDA, HIP and Metal, loaded at run time, with a host shared-memory oracle"
keywords = ["robotics", "gpu", "cuda", "metal", "cerulion"]
categories = ["science::robotics", "hardware-support"]
# Not published to crates.io: no published crate depends on it yet.
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2"
libc = "0.2"
libloading = "0.8"
tracing = "0.1.44"
