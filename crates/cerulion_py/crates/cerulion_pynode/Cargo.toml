[package]
name = "cerulion_pynode"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
# Forwarded the same way a generated Rust node's `cerulion_core/local-transport`
# is: a Python-node cdylib selects the in-process transport with
# `cargo build --features cerulion_pynode/local-transport`.
local-transport = ["cerulion_core/local-transport"]

[dependencies]
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros"] }
cerulion_core = { path = "../../../cerulion_core" }
native_ros2_messages = { path = "../../../native_ros2_messages" }
libc = "=0.2.189"
tracing = "=0.1.44"
serde_json = "=1.0.149"
indexmap = "=2.14.0"

[build-dependencies]
pyo3-build-config = "=0.29.2"
