[package]
name = "cerulion_py"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "cerulion_py"
crate-type = ["cdylib"]

[workspace]
members = [".", "fixtures", "crates/cerulion_pynode"]

# Copied verbatim from the root Cargo.toml's [workspace.lints] (rust +
# clippy tables): this is a SEPARATE workspace so the same lint set is
# restated here; both members inherit via `[lints] workspace = true`.
[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cdylib"))',
    'cfg(cerulion_rmw_vendored_bindings)',
    'cfg(cerulion_rmw_generated_bindings)',
] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

[lints]
workspace = true

[profile.release]
strip = true

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py311", "extension-module"] }
cerulion_core = { path = "../cerulion_core" }
cerulion_bag = { path = "../cerulion_bag" }
native_ros2_messages = { path = "../native_ros2_messages" }
libc = "=0.2.189"
tracing = "=0.1.44"

# Mirrors the root workspace patch in `../../Cargo.toml`: patches do not cross
# workspace boundaries, and both workspaces must resolve the same iceoryx2 family.
# The root comment above that block explains why this fork is required.
[patch.crates-io]
iceoryx2 = { git = "https://github.com/cerulion-inc/iceoryx2", rev = "636ea14f102f69a420b41de904a5a92dfe6fa46c" }
