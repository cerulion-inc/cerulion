# The Go2 DDS-interop support library — a ONE-per-process
# ros2-client/rustdds participant wrapper + PURE CDR codecs for the v1 message
# set. NO nodes here (the DDS ingress/egress node crates live under `nodes/`); this
# is a `lib/*` support crate (not a node), so `cerulion graph run` node-type
# resolution never treats it as a node. (The helper libs `go2_tf` and
# `cerulion_viz` live in the isolated `cerulion_viz` workspace.)
#
# ---------------------------------------------------------------------------
# MSRV note (dep proof, verified against crates.io/docs.rs 2026-07-08):
#   ros2-client 0.10.0  (Apache-2.0, MSRV 1.82.0) -> pulls rustdds ^0.13
#     (resolves 0.13.1, Apache-2.0, MSRV 1.85.1  <-- highest MSRV here)
#     -> pulls cdr-encoding 0.11.0 (MIT OR Apache-2.0), the SAME serde-CDR
#        engine rustdds/ros2-client use for typed pub/sub. We depend on it
#        directly so the pure codecs go through the identical engine (wire
#        bytes are byte-identical to a real DDS publisher); ^0.11 unifies with
#        ros2-client's transitive 0.11.0 — one resolved version, no skew.
#   byteorder 1.x (MIT OR Apache-2.0): the `LittleEndian`/`BigEndian` markers
#     cdr-encoding's `to_vec::<T, BO>` / `from_bytes::<T, BO>` are generic over
#     (cdr-encoding imports them from byteorder directly — not re-exported).
#     ^1 unifies with cdr-encoding's own byteorder ^1.3.
#   serde 1.x / thiserror 2.x / tracing 0.1 (MIT OR Apache-2.0).
#
# EFFECTIVE MSRV: 1.85.1 (rustdds 0.13). Unlike `cerulion_viz` (rerun -> 1.92),
# this crate does NOT touch rerun, so its floor is only 1.85.1 — well under the
# `stable` toolchain the companion computer builds with. Like every crate in this ISOLATED
# demo workspace it is excluded from the root's 1.88 MSRV job and the root
# cargo-deny scan (separate lockfile); this workspace's own gate (cargo-deny + build
# on macOS + Linux) is the authoritative proof for THIS workspace's tree.
#
# DENY note: ros2-client / rustdds / cdr-encoding are Apache-2.0 (or MIT OR
# Apache-2.0), all on the demo deny.toml allow-list. Their rustdds transitives
# have NOT been surveyed against the allow-list here (`cargo deny check` in
# this workspace is the authority). `default-features = false` on ros2-client (set in the workspace dep)
# keeps the DDS-security (rustls/ring) tree out of the resolve.
# ---------------------------------------------------------------------------

[package]
name = "cerulion_go2_dds"
version = "0.1.0"
edition = "2021"
description = "Go2 DDS interop: one-per-process ros2-client/rustdds participant wrapper + pure CDR codecs"
license.workspace = true
rust-version = "1.85.1"

[features]
# The Go2 firmware + on-robot ROS 2 are Humble-era => pre-Iron 16-byte GID is
# WRONG for them; ros2-client's distro-feature chain selects the GID format.
# `humble` (default) = the correct pre-Iron GID. For a Jazzy-or-newer peer:
#   cargo build --no-default-features --features jazzy
# (wrong GID => `ros2 node list` empty + services
# break, though topic data may still flow.)
default = ["humble"]
humble = ["ros2-client/humble"]
jazzy = ["ros2-client/jazzy"]

[dependencies]
# default-features = false + the version pin live in the workspace dep table
# (examples/go2/Cargo.toml); the GID feature is forwarded via this crate's
# `[features]` above.
ros2-client = { workspace = true }
# The SAME serde-CDR engine ros2-client/rustdds use (see the MSRV note). Direct
# dep so the pure codecs are wire-identical to typed DDS pub/sub.
cdr-encoding = "0.11"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

# The demo workspace mirrors the root `[workspace.lints]` table (see
# `examples/go2/Cargo.toml`), so every member here inherits the SAME strict lints as
# the main tree rather than sitting under no lint table at all.
[lints]
workspace = true
