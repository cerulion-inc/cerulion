# The desk half of networked teleop: the terminal keyboard on YOUR machine
# publishes /go2/cmd_vel/keyboard, and the companion computer's
# teleop_remote graph imports it (see teleop_remote.yaml).
#
# Created with `cerulion graph create teleop_desk -n desk` +
# `cerulion node stage keyboard_teleop -g teleop_desk`; the `topic:` override
# is a hand edit so the desk publishes exactly the name the robot side
# declares as ingress.
#
# With no network block, every produced topic is eligible for paired export.
# The first export starts authenticated serving; the robot side demands the
# keyboard stream through the same account or an established explicit pairing.
# No listen setting, address or discovery override is needed.
#
# RUN (on the desk, in a real terminal):
#
#   cerulion graph run teleop_desk --single-process
#
# WASD to move, space to stop, Ctrl-C to quit (the terminal is restored). The
# robot-side stop guarantee is the mux's 750 ms keyboard staleness window,
# not this node: a dropped link reads as a stale keyboard and the mux zeros.

prefix: desk
nodes:
  - id: keyboard_teleop
    type: keyboard_teleop
    outputs:
      - name: cmd
        schema: geometry_msgs/Twist
        topic: /go2/cmd_vel/keyboard
