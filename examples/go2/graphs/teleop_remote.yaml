# The robot half of networked teleop: the gamepad on the companion computer,
# the keyboard on the desk (teleop_desk.yaml, arriving over the network), the
# safety mux, and the sport driver.
#
# Created with `cerulion graph create teleop_remote -n go2` + `cerulion node
# stage` for each node; the `topic:` overrides, the absolute `source:`
# references and the `network:` block are hand edits.
#
# The network block declares the desk keyboard import and restricts egress.
# Paired access selects a unique same-account or explicitly paired producer
# and pulls its allowed stream through the authenticated remote plane.
# The companion can serve sensor graphs and import keyboard frames through
# its shared endpoint, without separate ports or address configuration.
#
# `egress` exports the arbitrated command so a desk can watch what the robot
# is being told (`cerulion viz --robot <name> /go2/cmd_vel`). The raw
# joystick topic stays local on purpose.
#
# RUN (on the companion computer):
#
#   export GO2_IFACE=<this computer's robot-LAN interface IP>
#   cerulion graph run teleop_remote --single-process
#
# then, on the desk, `cerulion graph run teleop_desk --single-process`.
# Same safety preconditions as teleop.yaml (ROBOT-DAY.md section 4).
#
# A `--record` of this graph is refused: a run that declares `ingress:` is
# not recordable (docs/networking.md "Recording keeps the network").

prefix: go2
nodes:
  - id: joystick_teleop
    type: joystick_teleop
    outputs:
      - name: cmd
        schema: geometry_msgs/Twist
        topic: /go2/cmd_vel/joystick
  - id: teleop_mux
    type: teleop_mux
    inputs:
      - name: joy_cmd
        source: /go2/cmd_vel/joystick
      - name: key_cmd
        source: /go2/cmd_vel/keyboard
    outputs:
      - name: cmd
        schema: geometry_msgs/Twist
        topic: /go2/cmd_vel
  - id: sport_driver
    type: sport_driver
    inputs:
      - name: cmd
        source: /go2/cmd_vel
network:
  mode: peer
  egress:
    - /go2/cmd_vel
  ingress:
    - /go2/cmd_vel/keyboard
