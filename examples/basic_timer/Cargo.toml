[workspace]
members = ["nodes/*"]
resolver = "2"

[workspace.dependencies]
cerulion_core = { path = "../../crates/cerulion_core" }
native_ros2_messages = { path = "../../crates/native_ros2_messages" }

# This workspace is independent, so the root [patch.crates-io] does not
# reach its node cdylibs. Pin the same iceoryx2 fork so their Android
# shared-memory implementation matches cerulion_core.
[patch.crates-io]
iceoryx2 = { git = "https://github.com/cerulion-inc/iceoryx2", rev = "8657bc53bd0b544dd40fc9ce27e6cdb90c312b51" }
