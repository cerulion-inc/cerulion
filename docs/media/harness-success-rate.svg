an without it. Exact paired sign test on SOLVED, read after Holm&#x27;s correction:</text><text x="24" y="802" font-size="12" fill="#666">no difference shown for GPT-6 Astra (p = 1), GPT-6.2 Astra (p = 0.541) and Gemini 4 Carbon (p = 0.377).</text><text x="24" y="820" font-size="12" fill="#666">Claude Fable 5.2 without Cerulion: the provider&#x27;s content filter stopped 337 of its 1,101 replies; 86 of its 100 scored episodes ended on</text><text x="24" y="838" font-size="12" fill="#666">them, with no claim from the model. Three other arms had one filtered reply each, ending no scored episode.</text><text x="24" y="856" font-size="12" fill="#666">† GPT-6.1 Terra: added after the grid&#x27;s first rows had been seen.</text></svg>
