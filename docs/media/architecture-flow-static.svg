<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="764" viewBox="0 0 980 764" role="img" aria-labelledby="t d"><title id="t">Cerulion architecture: robot graph, network planes, desk tools</title><desc id="d">Robot: a graph scheduler drives Sensors, Perception and Control; nodes publish into and read from iceoryx2 shared memory; recording and Flashback capture every frame; cerulion-netd serves LAN and WAN (Iroh) planes on demand. Desk: cerulion-netd mirrors demanded topics locally for Cerulion Studio and the CLI; account ownership and grants authorize the WAN plane on both machines; the CLI drives replay; replay, verification and CI consume the recording.</desc><style>:root{--sheen:#a9d3ff;--sheenrec:#f6cf8c;--paper:#f6f8fa;--card:#ffffff;--ink:#1f2933;--muted:#5b6673;--line:#d0d7de;--rail:#aeb8c3;--railblue:#7bbcfc;--blue:#0080ff;--bluesoft:#e8f2ff;--amber:#d97706;--ambersoft:#fff4e0;--green:#1a9c5b;--greensoft:#e3f6ec;--white:#ffffff;--haloa:.26}@media(prefers-color-scheme:dark){:root{--sheen:#cfe6ff;--sheenrec:#ffe0a8;--paper:#0d1117;--card:#161b22;--ink:#e6edf3;--muted:#8b98a5;--line:#30363d;--rail:#6b7280;--railblue:#306197;--blue:#4da3ff;--bluesoft:#0f2540;--amber:#f5a524;--ambersoft:#2d2210;--green:#3fb950;--greensoft:#0f2a1a;--white:#0d1117;--haloa:.34}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--ink)}.title{font-size:20px;font-weight:600;letter-spacing:-.2px}.sub{font-size:14px;fill:var(--muted)}.lbl{font-size:14px;font-weight:600}.body{font-size:13px;fill:var(--muted)}.sm{font-size:12px;fill:var(--muted)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:var(--blue)}.tag{font-size:12px;font-weight:600;letter-spacing:1.2px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.card{fill:var(--card);stroke:var(--line);stroke-width:1}.pane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.plane{fill:var(--bluesoft);stroke:none}.edge{fill:none;stroke:var(--rail);stroke-width:1.5}.edge.data{stroke:var(--blue)}.edge.loop{stroke:var(--railblue)}.edge.rec{stroke:var(--amber)}.edge.demand{stroke:var(--blue);stroke-dasharray:4 4;stroke-width:1.2}.edge.gate{stroke:var(--green);stroke-dasharray:4 4;stroke-width:1.4}.pk{fill:var(--blue)}.pk.rec{fill:var(--amber)}.halo{fill:var(--blue);opacity:var(--haloa)}.halo.rec{fill:var(--amber)}.halo.dem{opacity:.2}.pkd{fill:var(--paper);stroke:var(--blue);stroke-width:2}.sheen{fill:none;stroke:var(--sheen);stroke-width:3;stroke-linecap:round;opacity:.95}.sheen.rec{stroke:var(--sheenrec)}.sheen.dem{stroke-width:2.2;opacity:.8}.lock{fill:var(--greensoft);stroke:var(--green);stroke-width:1.4}.cardlit{fill:var(--blue)}.cardlit.rec{fill:var(--amber)}@media(prefers-reduced-motion:reduce){.pk,.pkd,.halo,.sheen,.cardlit{display:none}}</style><defs><marker id="mRail" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5 L7 4 L0 7.5 Z" fill="var(--rail)"/></marker><marker id="mLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5 L7 4 L0 7.5 Z" fill="var(--railblue)"/></marker><marker id="mBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5 L7 4 L0 7.5 Z" fill="var(--blue)"/></marker><marker id="mAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5 L7 4 L0 7.5 Z" fill="var(--amber)"/></marker><marker id="mGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5 L7 4 L0 7.5 Z" fill="var(--green)"/></marker></defs><rect width="980" height="764" rx="14" fill="var(--paper)"/><text x="24" y="34" class="eyebrow">CERULION / ARCHITECTURE</text><text x="24" y="64" class="title">One graph on the robot. One view from your desk.</text><rect x="24" y="96" width="430" height="628" rx="12" class="pane"/><text x="40" y="122" class="eyebrow">ROBOT / LINUX OR macOS</text><rect x="476" y="96" width="480" height="628" rx="12" class="pane"/><text x="492" y="122" class="eyebrow">YOUR COMPUTER / LINUX OR macOS</text><rect x="40" y="146" width="398" height="84" rx="8" class="card"/><text x="52" y="170" class="lbl">Graph scheduler</text><text x="52" y="190" class="sm">Precomputed dependency levels, ready work</text><text x="52" y="206" class="sm">Parallel independent nodes, event-driven waiting</text><text x="52" y="222" class="sm">Measured-cost placement, observable execution</text><rect x="40" y="258" width="118" height="72" rx="8" class="card"/><text x="52" y="282" class="lbl">Sensors</text><text x="52" y="302" class="sm">timers,</text><text x="52" y="318" class="sm">device events</text><rect x="180" y="258" width="118" height="72" rx="8" class="card"/><text x="192" y="282" class="lbl">Perception</text><text x="192" y="302" class="sm">data-triggered</text><rect x="320" y="258" width="118" height="72" rx="8" class="card"/><text x="332" y="282" class="lbl">Control</text><text x="332" y="302" class="sm">deadlines, QoS</text><path d="M99 230 V257" class="edge" marker-end="url(#mRail)"/><path d="M239 230 V257" class="edge" marker-end="url(#mRail)"/><path d="M379 230 V257" class="edge" marker-end="url(#mRail)"/><text x="387" y="247.5" class="sm">drives</text><path d="M158 294 H179" class="edge data" marker-end="url(#mBlue)"/><path d="M298 294 H319" class="edge data" marker-end="url(#mBlue)"/><rect x="40" y="358" width="398" height="60" rx="8" class="card"/><text x="52" y="382" class="lbl"><tspan class="mono">iceoryx2</tspan><tspan> shared memory</tspan></text><text x="52" y="402" class="sm">Loaned fixed and variable fields</text><path d="M99 330 V357" class="edge data" marker-end="url(#mBlue)"/><path d="M231 330 V357" class="edge data" marker-end="url(#mBlue)"/><path d="M371 330 V357" class="edge data" marker-end="url(#mBlue)"/><path d="M247 358 V331" class="edge data" marker-end="url(#mBlue)"/><path d="M387 358 V331" class="edge data" marker-end="url(#mBlue)"/><rect x="236" y="446" width="202" height="196" rx="8" class="card"/><text x="248" y="470" class="lbl mono">cerulion-netd</text><text x="248" y="488" class="sm">One network daemon</text><rect x="248" y="502" width="178" height="60" rx="6" class="plane"/><text x="260" y="523" class="lbl">WAN plane</text><text x="260" y="541" class="sm">Iroh / QUIC</text><text x="260" y="556" class="sm">hole punch or relay</text><rect x="248" y="572" width="178" height="60" rx="6" class="plane"/><text x="260" y="593" class="lbl">LAN plane</text><text x="260" y="611" class="sm">local network</text><text x="260" y="626" class="sm">mDNS discovery</text><path d="M337 418 V445" class="edge data" marker-end="url(#mBlue)"/><text x="319" y="435.5" class="sm" text-anchor="end">on demand</text><rect x="40" y="542" width="180" height="100" rx="8" class="card"/><text x="52" y="566" class="lbl">Recording + Flashback</text><text x="52" y="586" class="sm">Frames, schemas,</text><text x="52" y="602" class="sm">graph + trace</text><text x="52" y="618" class="sm">Memory-bounded</text><text x="52" y="634" class="sm">incident history</text><path d="M130 418 V541" class="edge rec" marker-end="url(#mAmber)"/><text x="120" y="483.5" class="sm" text-anchor="end">every frame</text><rect x="492" y="446" width="206" height="196" rx="8" class="card"/><text x="504" y="470" class="lbl mono">cerulion-netd</text><text x="504" y="488" class="sm">One network daemon</text><rect x="504" y="502" width="182" height="60" rx="6" class="plane"/><text x="516" y="523" class="lbl">WAN plane</text><text x="516" y="541" class="sm">Iroh / QUIC</text><text x="516" y="556" class="sm">hole punch or relay</text><rect x="504" y="572" width="182" height="60" rx="6" class="plane"/><text x="516" y="593" class="lbl">LAN plane</text><text x="516" y="611" class="sm">local network</text><text x="516" y="626" class="sm">mDNS discovery</text><path d="M426 520 H503" class="edge data" marker-end="url(#mBlue)"/><path d="M504 544 H427" class="edge demand" marker-end="url(#mBlue)"/><path d="M426 590 H503" class="edge data" marker-end="url(#mBlue)"/><path d="M504 614 H427" class="edge demand" marker-end="url(#mBlue)"/><text x="465" y="506" class="sm" text-anchor="middle">data</text><text x="465" y="564" class="sm" text-anchor="middle">demand</text><rect x="492" y="214" width="206" height="100" rx="8" class="card"/><text x="504" y="238" class="lbl">Account ownership + grants</text><text x="504" y="258" class="sm">Device certificates</text><text x="504" y="274" class="sm">authorize access</text><text x="504" y="290" class="sm">Encrypted, authenticated</text><text x="504" y="306" class="sm">connections</text><path d="M670 314 V437" class="edge gate"/><path d="M670 428 H412 V437" class="edge gate"/><g class="lockg"><rect x="664" y="442" width="12" height="9" rx="2" class="lock"/><path d="M666.5 442 V439 A3.5 3.5 0 0 1 673.5 439 V442" fill="none" stroke="var(--green)" stroke-width="1.4"/></g><g class="lockg"><rect x="406" y="442" width="12" height="9" rx="2" class="lock"/><path d="M408.5 442 V439 A3.5 3.5 0 0 1 415.5 439 V442" fill="none" stroke="var(--green)" stroke-width="1.4"/></g><text x="660" y="392" class="sm" text-anchor="end">gates the WAN plane</text><text x="660" y="408" class="sm" text-anchor="end">on both machines</text><rect x="724" y="146" width="212" height="88" rx="8" class="card"/><text x="736" y="170" class="lbl">Cerulion Studio</text><text x="736" y="190" class="sm">Live sensors, scene,</text><text x="736" y="206" class="sm">graph, agent</text><text x="736" y="222" class="sm">Screenshots and view control</text><rect x="764" y="262" width="172" height="76" rx="8" class="card"/><text x="776" y="286" class="lbl">CLI + Cerulion MCP</text><text x="776" y="306" class="sm">Inspect, record,</text><text x="776" y="322" class="sm">rebuild, resim</text><rect x="724" y="500" width="212" height="100" rx="8" class="card"/><text x="736" y="524" class="lbl">Local topic mirrors</text><text x="736" y="544" class="sm">Tools subscribe to local data</text><text x="736" y="560" class="sm">Decode and rendering on the desk</text><path d="M686 520 H723" class="edge data" marker-end="url(#mBlue)"/><path d="M686 590 H723" class="edge data" marker-end="url(#mBlue)"/><path d="M850 500 V339" class="edge data" marker-end="url(#mBlue)"/><path d="M744 500 V235" class="edge data" marker-end="url(#mBlue)"/><rect x="724" y="632" width="212" height="76" rx="8" class="card"/><text x="736" y="656" class="lbl">Replay, verification, CI</text><text x="736" y="676" class="sm">MCAP recording +</text><text x="736" y="692" class="sm">current node builds</text><path d="M130 642 V670 H723" class="edge rec" marker-end="url(#mAmber)"/><text x="120" y="660" class="sm" text-anchor="end">MCAP file</text><path d="M936 300 H947 V670 H937" class="edge" marker-end="url(#mRail)"/><text x="939" y="620" class="sm" text-anchor="end">resim</text><text x="24" y="754" class="sub">Native data stays in shared memory locally. Network delivery follows subscriptions. Replay turns recorded behavior into a test.</text></svg>
