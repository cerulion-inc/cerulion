els.</text><text x="24" y="856" font-size="12" fill="#666">Claude Fable 5.2 without Cerulion: the provider&#x27;s content filter stopped 337 of its 1,101 replies; 86 of its 100 scored episodes ended on</text><text x="24" y="874" font-size="12" fill="#666">them, with no claim from the model. Three other arms had one filtered reply each, ending no scored episode.</text><text x="24" y="892" font-size="12" fill="#666">† GPT-6.1 Terra: added after the grid&#x27;s first rows had been seen.</text></svg>
