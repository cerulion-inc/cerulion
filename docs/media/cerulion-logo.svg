<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="-24 -18 900 212" fill="none" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Cerulion</title>
  <desc id="logo-description">Cerulion lion mark and wordmark. A subtle light sweep highlights the lion every three seconds. Animation respects reduced-motion preferences.</desc>
  <style>
:root { --wordmark: #001427; }
@media (prefers-color-scheme: dark) { :root { --wordmark: #FCFDFD; } }
.wordmark path { fill: var(--wordmark); }
.identity { animation: arrive .65s ease-out both; }
.sheen { opacity: 0; animation: sweep 3s cubic-bezier(.25,.1,.25,1) .25s infinite; }
@keyframes arrive { from { opacity: .5; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
@keyframes sweep {
  0% { transform: translateX(-120px); opacity: 0; }
  10.8% { opacity: .28; }
  45.6% { opacity: .28; }
  60% { transform: translateX(225px); opacity: 0; }
  100% { transform: translateX(225px); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .identity { animation: none; }
  .sheen { display: none; animation: none; }
}
</style>
