<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="383" viewBox="0 0 980 383" role="img" aria-labelledby="t d"><title id="t">From a robot run to a change you can review</title><desc id="d">Five stages on a stadium track: Run, Inspect, Capture, Re-execute, Review along the top straight, with the bottom straight returning from Review to Run: improve the code and keep the failure as a regression case. Under each stage, the component and what it contributes: the graph scheduler, Studio and an agent, MCAP and Flashback, current node builds, a CI verdict. One token travels the track in stage order; each stage lights as the token arrives, and the return caption lights as the token passes its arrowhead.</desc><style>:root{--paper:#f6f8fa;--card:#ffffff;--ink:#1f2933;--muted:#5b6673;--line:#d0d7de;--railblue:#7bbcfc;--blue:#0080ff;--white:#ffffff;--haloa:.26}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--ink)}.title{font-size:20px;font-weight:600;letter-spacing:-.2px}.sub{font-size:14px;fill:var(--muted)}.lbl{font-size:14px;font-weight:600}.body{font-size:13px;fill:var(--muted)}.note-h{font-size:13px;font-weight:600;fill:var(--ink)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:var(--blue)}.tag{font-size:12px;font-weight:600;letter-spacing:1.2px;fill:var(--muted)}.track{fill:var(--card);stroke:var(--railblue);stroke-width:1.5}.carrier{fill:none;stroke:none}.pk{fill:var(--blue)}.halo{fill:var(--blue);opacity:var(--haloa)}.node{fill:var(--card);stroke:var(--railblue);stroke-width:1.5}.num{font-size:12px;font-weight:700;fill:var(--muted)}.lit .node{fill:var(--blue);stroke:var(--blue)}.lit .num{fill:var(--white)}.lit .lbl{fill:var(--blue)}.node-lit{fill:var(--blue);stroke:var(--blue);stroke-width:1.5}.num-lit{font-size:12px;font-weight:700;fill:var(--white)}.lbl-lit{fill:var(--blue)}.body-lit{fill:var(--blue)}.rm{display:none}@media(prefers-reduced-motion:reduce){.litov,.token{display:none}.rm{display:inline}}</style><defs><marker id="mLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0.5 L7 4 L0 7.5 Z" fill="var(--railblue)"/></marker></defs><rect width="980" height="383" rx="14" fill="var(--paper)"/><text x="32" y="34" class="eyebrow">CERULION / THE DEVELOPMENT LOOP</text><text x="32" y="64" class="title">From a robot run to a change you can review.</text><text x="32" y="88" class="sub">Runtime, Studio and replay verification share the same data and execution context.</text><path d="M96 154 H884 A64 64 0 0 1 948 218 V235 A64 64 0 0 1 884 299 H96 A64 64 0 0 1 32 235 V218 A64 64 0 0 1 96 154 Z" class="track"/><path d="M109 154 H250" class="carrier" marker-end="url(#mLoop)"/><path d="M277 154 H418" class="carrier" marker-end="url(#mLoop)"/><path d="M445 154 H586" class="carrier" marker-end="url(#mLoop)"/><path d="M613 154 H754" class="carrier" marker-end="url(#mLoop)"/><path d="M884 299 H490" class="carrier" marker-end="url(#mLoop)"/><path d="M96 299 A64 64 0 0 1 32 235 V218 A64 64 0 0 1 82.08 155.53" class="carrier" marker-end="url(#mLoop)"/><g class="stage s0"><text x="83" y="128" class="lbl">Run</text></g><g class="litov" opacity="0"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.0884;0.1242;0.9930;0.9935;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><text x="83" y="128" class="lbl lbl-lit">Run</text></g><g class="rm"><text x="83" y="128" class="lbl lbl-lit">Run</text></g><text x="83" y="184" class="note-h">Graph scheduler</text><text x="83" y="201" class="body">Precomputed levels,</text><text x="83" y="218" class="body">parallel nodes,</text><text x="83" y="235" class="body">event-driven waiting</text><text x="83" y="252" class="body">Typed and ROS 2 nodes,</text><text x="83" y="269" class="body">zero-copy messages</text><g class="stage s1"><text x="251" y="128" class="lbl">Inspect</text></g><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1112;0.1117;0.2066;0.2424;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><text x="251" y="128" class="lbl lbl-lit">Inspect</text></g><text x="251" y="184" class="note-h">Studio + agent</text><text x="251" y="201" class="body">Live sensors, scene</text><text x="251" y="218" class="body">and graph</text><text x="251" y="235" class="body">An agent over Cerulion</text><text x="251" y="252" class="body">MCP and Hindsight</text><g class="stage s2"><text x="419" y="128" class="lbl">Capture</text></g><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2364;0.2369;0.3318;0.3675;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><text x="419" y="128" class="lbl lbl-lit">Capture</text></g><text x="419" y="184" class="note-h">MCAP + Flashback</text><text x="419" y="201" class="body">Recording, plus a rolling</text><text x="419" y="218" class="body">window written out on</text><text x="419" y="235" class="body">an event such as a dead</text><text x="419" y="252" class="body">worker, a stall, an e-stop</text><g class="stage s3"><text x="587" y="128" class="lbl">Re-execute</text></g><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3616;0.3621;0.4569;0.4927;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><text x="587" y="128" class="lbl lbl-lit">Re-execute</text></g><text x="587" y="184" class="note-h">Current node builds</text><text x="587" y="201" class="body">re-run on the recorded</text><text x="587" y="218" class="body">inputs and context</text><text x="587" y="235" class="body">Outputs byte-exact or</text><text x="587" y="252" class="body">within tolerances</text><g class="stage s4"><text x="755" y="128" class="lbl">Review</text></g><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4868;0.4873;0.5821;0.6179;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><text x="755" y="128" class="lbl lbl-lit">Review</text></g><text x="755" y="184" class="note-h">CI verdict</text><text x="755" y="201" class="body">A pass, or the first</text><text x="755" y="218" class="body">divergence, reported</text><text x="755" y="235" class="body">beside the change</text><text x="490" y="325" class="body" text-anchor="middle">Improve the code. Keep the failure as a regression case.</text><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7698;0.7703;0.8652;0.9010;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><text x="490" y="325" class="body body-lit" text-anchor="middle">Improve the code. Keep the failure as a regression case.</text></g><path id="loop" d="M96 154 H884 A64 64 0 0 1 948 218 V235 A64 64 0 0 1 884 299 H96 A64 64 0 0 1 32 235 V218 A64 64 0 0 1 96 154 Z" fill="none" stroke="none"/><g class="token" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.01s" begin="0s" fill="freeze"/><animateMotion dur="16.78s" begin="0s" repeatCount="indefinite" keyPoints="0;0.33398;1" keyTimes="0;0.50072;1" calcMode="linear" rotate="0"><mpath xlink:href="#loop" href="#loop"/></animateMotion><circle r="11.5" class="halo"><animate attributeName="r" values="9.2;12.7;9.2" dur="1.4s" repeatCount="indefinite"/></circle><circle r="5.75" class="pk"/></g><g class="rm" transform="translate(127 154)"><circle r="10.9" class="halo"/><circle r="5.75" class="pk"/></g><g class="stage s0"><circle cx="96" cy="154" r="13" class="node"/><text x="96" y="158" class="num" text-anchor="middle">1</text><g class="litov" opacity="0"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.0884;0.1242;0.9930;0.9935;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><circle cx="96" cy="154" r="13" class="node-lit"/><text x="96" y="158" class="num-lit" text-anchor="middle">1</text></g><g class="rm"><circle cx="96" cy="154" r="13" class="node-lit"/><text x="96" y="158" class="num-lit" text-anchor="middle">1</text></g></g><g class="stage s1"><circle cx="264" cy="154" r="13" class="node"/><text x="264" y="158" class="num" text-anchor="middle">2</text><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1112;0.1117;0.2066;0.2424;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><circle cx="264" cy="154" r="13" class="node-lit"/><text x="264" y="158" class="num-lit" text-anchor="middle">2</text></g></g><g class="stage s2"><circle cx="432" cy="154" r="13" class="node"/><text x="432" y="158" class="num" text-anchor="middle">3</text><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2364;0.2369;0.3318;0.3675;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><circle cx="432" cy="154" r="13" class="node-lit"/><text x="432" y="158" class="num-lit" text-anchor="middle">3</text></g></g><g class="stage s3"><circle cx="600" cy="154" r="13" class="node"/><text x="600" y="158" class="num" text-anchor="middle">4</text><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3616;0.3621;0.4569;0.4927;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><circle cx="600" cy="154" r="13" class="node-lit"/><text x="600" y="158" class="num-lit" text-anchor="middle">4</text></g></g><g class="stage s4"><circle cx="768" cy="154" r="13" class="node"/><text x="768" y="158" class="num" text-anchor="middle">5</text><g class="litov" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4868;0.4873;0.5821;0.6179;1" dur="16.78s" begin="0s" repeatCount="indefinite"/><circle cx="768" cy="154" r="13" class="node-lit"/><text x="768" y="158" class="num-lit" text-anchor="middle">5</text></g></g><text x="32" y="365" class="tag">LOCAL SHARED MEMORY  ·  REMOTE ROBOTS  ·  LIVE OBSERVABILITY  ·  REPEATABLE VERIFICATION</text></svg>
